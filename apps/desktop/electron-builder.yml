appId: com.peeragent.desktop
productName: Peer Agent
copyright: Copyright © 2026 Peer Agent

# 产物文件名模板：强制无空格。
# productName 带空格会导致 electron-builder 生成的更新清单（*-mac.yml）
# 把 URL 里的空格转成连字符，而实际产物文件名保留空格，两端对不上 → 自动更新 404。
# 这里固定为连字符命名，使「实际产物名」与「清单 URL」天然一致。
# 注意：productName（应用显示名/Dock/菜单）保持 "Peer Agent" 不变，仅影响产物文件名。
artifactName: Peer-Agent-${version}-${arch}.${ext}

directories:
  output: ../../dist-electron
  buildResources: build

# ── 打包文件 ──
files:
  - "dist/**/*"
  - "electron/**/*"
  - "!electron/**/*.test.*"

extraResources:
  # Rust native binary (must be pre-built for target platform)
  - from: "../../target/release/"
    to: "bin/"
    filter:
      - "cu-proxy-core"
      - "cu-proxy-core.exe"
  # 本地能力 Manifest
  - from: "../../capabilities/"
    to: "capabilities/"
    filter:
      - "**/*.json"

# ── macOS ──
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 阶段一：关闭公证（无 Apple Developer ID 证书时开启会导致构建失败）。
  # 阶段二补齐证书后改回 true，并在 CI 配置 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID。
  notarize: false

afterSign: scripts/after-sign.cjs

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ── Windows ──
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # nsis 安装包为多架构合成的单一产物，不带 ${arch}（否则模板里 arch 为空会留下多余连字符）。
  artifactName: Peer-Agent-Setup-${version}.${ext}

# ── 发布 (GitHub Releases) ──
# 通道分流由 tag 名驱动（见 .github/workflows/release.yml）：
#   - 纯 vX.Y.Z         → 正式 Release（latest 通道，latest-mac.yml / latest.yml）
#   - vX.Y.Z-beta.N     → 预发布 Release（beta 通道，beta-mac.yml / beta.yml）
# generateUpdatesFilesForAllChannels 确保即使一次构建也按版本号语义写入对应通道清单。
publish:
  provider: github
  owner: yinLiangDream
  repo: Peer-Agent
  releaseType: release

generateUpdatesFilesForAllChannels: true
