<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F6F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16191D" media="(prefers-color-scheme: dark)" />
    <style>
      /* 首帧兜底：在 CSS bundle 注入前避免透明 body 透出系统黑底。
         Electron vibrancy 仍由窗口层处理；这里只给 document 一个浅/深纸色。 */
      html, body {
        margin: 0;
        background: #F4F6F9;
      }
      @media (prefers-color-scheme: dark) {
        html, body { background: #16191D; }
      }
    </style>
    <link rel="icon" type="image/png" href="./favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="./favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <!-- Warm sidebar brand marks during startup so they are cache-ready when Sidebar mounts. -->
    <link rel="preload" as="image" href="./logo-light.png" />
    <link rel="preload" as="image" href="./logo-dark.png" />
    <title>Peer Agent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/renderer/src/main.tsx"></script>
  </body>
</html>
