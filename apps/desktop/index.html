<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F6F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16191D" media="(prefers-color-scheme: dark)" />
    <style>
      /* 首帧兜底：在 CSS bundle 注入前避免透明 body 透出系统黑底。
         Electron vibrancy 仍由窗口层处理；这里只给 document 一个浅/深纸色。 */
      html, body, #root {
        margin: 0;
        height: 100%;
        background: #F4F6F9;
      }
      @media (prefers-color-scheme: dark) {
        html, body, #root { background: #16191D; }
      }
      /* macOS 真毛玻璃：main.tsx 挂载时打上 data-vibrancy，放开这层未分层的
         首帧兜底实色（未分层样式会压过 @layer base 里的透明规则，必须在此同步放开）。
         标记不存在（首帧/bootstrap 失败/非 macOS）时上面的实色兜底照常生效。 */
      html[data-vibrancy='true'],
      html[data-vibrancy='true'] body,
      html[data-vibrancy='true'] #root {
        background: transparent;
      }
      @media (prefers-reduced-transparency: reduce) {
        html[data-vibrancy='true'],
        html[data-vibrancy='true'] body {
          background: #F4F6F9;
        }
        @media (prefers-color-scheme: dark) {
          html[data-vibrancy='true'],
          html[data-vibrancy='true'] body {
            background: #16191D;
          }
        }
      }
    </style>
    <link rel="icon" type="image/png" href="./favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="./favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <!-- Warm sidebar brand marks during startup so they are cache-ready when Sidebar mounts. -->
    <link rel="preload" as="image" href="./logo-light.png" />
    <link rel="preload" as="image" href="./logo-dark.png" />
    <title>Peer Agent</title>
  </head>
  <body>
    <div id="root">
      <!-- React 挂载前的首帧壳：避免透明窗口 + 空 #root 呈现整窗白屏 -->
      <div data-boot-shell style="min-height:100vh;display:grid;place-items:center;font:14px/1.4 system-ui,-apple-system,sans-serif;color:#5b6472;">
        Starting Peer Agent…
      </div>
    </div>
    <script type="module" src="/renderer/src/main.tsx"></script>
  </body>
</html>
