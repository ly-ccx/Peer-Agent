<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>紧凑思考强度滑钮原型</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #eef1f5;
      --surface: rgba(255, 255, 255, 0.94);
      --surface-strong: #ffffff;
      --border: rgba(24, 36, 51, 0.12);
      --text: #172033;
      --muted: #667085;
      --accent: #1683ff;
      --accent-soft: #e8f3ff;
      --shadow: 0 18px 48px rgba(33, 49, 71, 0.16), 0 2px 8px rgba(33, 49, 71, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 80%, rgba(22, 131, 255, 0.10), transparent 35%),
        var(--canvas);
    }

    .demo {
      width: min(680px, 100%);
    }

    .hint {
      margin: 0 0 18px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .composer {
      position: relative;
      min-height: 126px;
      padding: 17px 18px 14px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 16px 54px rgba(34, 48, 70, 0.12);
      backdrop-filter: blur(18px);
    }

    .placeholder {
      color: #98a2b3;
      font-size: 15px;
    }

    .toolbar {
      position: absolute;
      inset: auto 14px 12px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button { font: inherit; }

    .icon-button,
    .send-button {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
    }

    .send-button {
      margin-left: auto;
      color: white;
      background: #172033;
    }

    .effort {
      position: relative;
    }

    .effort-trigger {
      height: 30px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 9px;
      border: 1px solid transparent;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      transition: color 140ms ease, background 140ms ease, border-color 140ms ease;
    }

    .effort-trigger:hover,
    .effort-trigger[aria-expanded="true"] {
      color: var(--accent);
      border-color: rgba(22, 131, 255, 0.18);
      background: var(--accent-soft);
    }

    .effort-trigger svg { flex: 0 0 auto; }

    .trigger-label {
      max-width: 70px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 600;
    }

    .popover {
      position: absolute;
      z-index: 2;
      left: 0;
      bottom: calc(100% + 10px);
      width: 258px;
      padding: 12px 13px 11px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface-strong);
      box-shadow: var(--shadow);
      transform-origin: 28px 100%;
      transition: opacity 130ms ease, transform 130ms ease, visibility 130ms ease;
    }

    .popover[hidden] {
      display: block;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transform: translateY(5px) scale(0.98);
    }

    .popover::after {
      content: "";
      position: absolute;
      left: 22px;
      bottom: -5px;
      width: 9px;
      height: 9px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: var(--surface-strong);
      transform: rotate(45deg);
    }

    .popover-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .popover-title {
      font-size: 12px;
      font-weight: 650;
    }

    .current-value {
      color: var(--accent);
      font-size: 12px;
      font-weight: 650;
    }

    .range-wrap {
      position: relative;
      height: 26px;
      margin: 0 3px;
      touch-action: none;
    }

    .track,
    .fill {
      position: absolute;
      top: 11px;
      left: 0;
      height: 4px;
      border-radius: 999px;
      pointer-events: none;
    }

    .track {
      width: 100%;
      background: #e4e9f0;
      box-shadow: inset 0 1px 2px rgba(23, 32, 51, 0.08);
    }

    .fill {
      width: 50%;
      background: linear-gradient(90deg, #39a0ff, var(--accent));
      box-shadow: 0 0 10px rgba(22, 131, 255, 0.22);
    }

    input[type="range"] {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 26px;
      margin: 0;
      opacity: 0;
      cursor: grab;
    }

    input[type="range"]:active { cursor: grabbing; }

    .thumb {
      position: absolute;
      top: 4px;
      left: 50%;
      width: 8px;
      height: 18px;
      border: 2px solid white;
      border-radius: 3px;
      background: var(--accent);
      box-shadow: 0 3px 9px rgba(22, 131, 255, 0.36), 0 0 0 1px rgba(22, 131, 255, 0.12);
      pointer-events: none;
      transform: translateX(-50%);
      transition: left 180ms cubic-bezier(.2, .8, .2, 1), transform 120ms ease, box-shadow 120ms ease;
    }

    .range-wrap.dragging .thumb {
      transform: translateX(-50%) scaleX(1.45);
      box-shadow: 0 4px 12px rgba(22, 131, 255, 0.46), 0 0 0 4px rgba(22, 131, 255, 0.1);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .range-wrap.dragging .fill {
      filter: saturate(1.12);
    }

    .range-wrap.dragging .thumb,
    .range-wrap.dragging .fill {
      transition-property: none;
    }

    .range-wrap:focus-within {
      border-radius: 8px;
      outline: 2px solid rgba(22, 131, 255, 0.28);
      outline-offset: 3px;
    }

    .labels {
      display: flex;
      justify-content: space-between;
      margin-top: 2px;
      color: #8a94a4;
      font-size: 10px;
      user-select: none;
    }

    .labels span.active { color: var(--accent); font-weight: 650; }

    @media (max-width: 420px) {
      .popover { width: 236px; }
      .trigger-label { max-width: 52px; }
    }
  </style>
</head>
<body>
  <main class="demo">
    <p class="hint">点击输入框左下角的“标准”按钮展开思考强度滑钮</p>
    <section class="composer" aria-label="输入框原型">
      <div class="placeholder">有什么可以帮你？</div>
      <div class="toolbar">
        <button class="icon-button" type="button" aria-label="添加附件">＋</button>
        <div class="effort">
          <button id="effort-trigger" class="effort-trigger" type="button" aria-expanded="false" aria-controls="effort-popover">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M9 18h6M10 22h4M8.6 15.5A7 7 0 1 1 15.4 15.5C14.5 16.2 14 17 14 18h-4c0-1-.5-1.8-1.4-2.5Z"/>
            </svg>
            <span id="trigger-label" class="trigger-label">标准</span>
            <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3 7 3-3 3 3"/></svg>
          </button>

          <div id="effort-popover" class="popover" role="dialog" aria-label="思考强度" hidden>
            <div class="popover-heading">
              <span class="popover-title">思考强度</span>
              <span id="current-value" class="current-value">标准</span>
            </div>
            <div class="range-wrap">
              <div class="track"></div>
              <div id="fill" class="fill"></div>
              <div id="thumb" class="thumb"></div>
              <input id="effort-range" type="range" min="0" max="100" step="1" value="50" aria-label="思考强度" aria-valuetext="标准" />
            </div>
            <div id="labels" class="labels" aria-hidden="true"></div>
          </div>
        </div>
        <button class="send-button" type="button" aria-label="发送">↑</button>
      </div>
    </section>
  </main>

  <script>
    const levels = ['关闭', '简洁', '标准', '深度', '最大'];
    const trigger = document.querySelector('#effort-trigger');
    const popover = document.querySelector('#effort-popover');
    const range = document.querySelector('#effort-range');
    const fill = document.querySelector('#fill');
    const thumb = document.querySelector('#thumb');
    const rangeWrap = document.querySelector('.range-wrap');
    const labels = document.querySelector('#labels');
    const currentValue = document.querySelector('#current-value');
    const triggerLabel = document.querySelector('#trigger-label');

    levels.forEach((level) => {
      const label = document.createElement('span');
      label.textContent = level;
      labels.append(label);
    });

    function levelIndexFor(percent) {
      return Math.round((percent / 100) * (levels.length - 1));
    }

    function render() {
      const percent = Number(range.value);
      const index = levelIndexFor(percent);
      const label = levels[index];
      fill.style.width = `${percent}%`;
      thumb.style.left = `${percent}%`;
      currentValue.textContent = label;
      triggerLabel.textContent = label;
      range.setAttribute('aria-valuetext', label);
      [...labels.children].forEach((node, nodeIndex) => node.classList.toggle('active', nodeIndex === index));
    }

    function snapToLevel() {
      const index = levelIndexFor(Number(range.value));
      range.value = String((index / (levels.length - 1)) * 100);
      rangeWrap.classList.remove('dragging');
      render();
    }

    function setOpen(open) {
      popover.hidden = !open;
      trigger.setAttribute('aria-expanded', String(open));
      if (open) requestAnimationFrame(() => range.focus());
    }

    trigger.addEventListener('click', () => setOpen(popover.hidden));
    range.addEventListener('pointerdown', () => rangeWrap.classList.add('dragging'));
    range.addEventListener('input', render);
    range.addEventListener('change', snapToLevel);
    range.addEventListener('pointerup', snapToLevel);
    range.addEventListener('pointercancel', snapToLevel);
    document.addEventListener('pointerdown', (event) => {
      if (!event.target.closest('.effort')) setOpen(false);
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        setOpen(false);
        trigger.focus();
      }
    });

    render();
  </script>
</body>
</html>
