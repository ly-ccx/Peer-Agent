<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fluid Ink Drop Prototype — Peer Agent</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f1ea;
      --fg: #1a1d21;
      --panel: rgba(255, 255, 255, 0.72);
      --border: rgba(26, 29, 33, 0.12);
    }
    html[data-theme="dark"] {
      --bg: #0f1115;
      --fg: #e8edf4;
      --panel: rgba(18, 22, 28, 0.78);
      --border: rgba(232, 237, 244, 0.12);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    body {
      display: grid;
      place-items: center;
    }
    .stage {
      position: relative;
      width: min(920px, 94vw);
      height: min(560px, 72vh);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.14);
      background:
        radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.35), transparent 55%),
        radial-gradient(ellipse at 70% 80%, rgba(0,0,0,0.04), transparent 50%),
        var(--bg);
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    .wordmark {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      z-index: 2;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-size: clamp(42px, 7vw, 72px);
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--fg);
      opacity: 0.92;
      text-shadow: 0 1px 0 rgba(255,255,255,0.08);
    }
    .hud {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: min(720px, calc(100vw - 32px));
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    .hud button, .hud label {
      appearance: none;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
    }
    .hud button:hover { opacity: 0.85; }
    .hud .meta {
      align-self: center;
      opacity: 0.7;
      font-size: 12px;
      padding: 0 4px;
    }
    .hint {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      font-size: 12px;
      opacity: 0.85;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="hint">独立原型 · 最小 Stam 流体 · 速度场 + 密度场 + splat 双写（未接入 BrandStartupLoader）</div>
  <div class="stage" id="stage">
    <canvas id="fluid" aria-label="fluid ink canvas"></canvas>
    <div class="wordmark">Peer Agent</div>
  </div>
  <div class="hud">
    <button type="button" id="btn-drop">落一滴</button>
    <button type="button" id="btn-clear">清空</button>
    <button type="button" id="btn-theme">切换主题</button>
    <button type="button" id="btn-auto">自动落墨：开</button>
    <label class="meta" id="stats">N=64 · project/advect</label>
  </div>

  <script>
    /**
     * Minimal Jos Stam-style fluid prototype for Peer Agent startup research.
     * Core: velocity (u,v) + density (d) fields, splat dual-write, diffuse/advect/project.
     * Drop feel: density-first + weak velocity (not a center jet spray).
     * Not product code — visual acceptance only.
     */
    (function () {
      const N = 64;
      const SIZE = N + 2;
      const ITER = 10;
      const DT = 0.12;
      // Drop-in feel: denser diffusion, slightly stickier velocity decay
      const VISCOSITY = 0.000018;
      const DIFFUSION = 0.00012;
      const VEL_DISSIPATION = 0.988;
      const DEN_DISSIPATION = 0.996;
      const AUTO_MIN_MS = 1600;
      const AUTO_MAX_MS = 3200;

      const canvas = document.getElementById('fluid');
      const stage = document.getElementById('stage');
      const statsEl = document.getElementById('stats');
      const btnDrop = document.getElementById('btn-drop');
      const btnClear = document.getElementById('btn-clear');
      const btnTheme = document.getElementById('btn-theme');
      const btnAuto = document.getElementById('btn-auto');
      const ctx = canvas.getContext('2d', { alpha: true });

      function makeField() {
        return new Float32Array(SIZE * SIZE);
      }

      let u = makeField();
      let v = makeField();
      let u0 = makeField();
      let v0 = makeField();
      let d = makeField();
      let d0 = makeField();
      const p = makeField();
      const div = makeField();

      let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      let autoDrop = true;
      let nextDropAt = performance.now() + 600;
      let lastTs = 0;
      let frame = 0;
      let dragging = false;
      let lastX = 0;
      let lastY = 0;

      function IX(i, j) {
        return i + SIZE * j;
      }

      function setBnd(b, x) {
        for (let i = 1; i <= N; i++) {
          x[IX(0, i)] = b === 1 ? -x[IX(1, i)] : x[IX(1, i)];
          x[IX(N + 1, i)] = b === 1 ? -x[IX(N, i)] : x[IX(N, i)];
          x[IX(i, 0)] = b === 2 ? -x[IX(i, 1)] : x[IX(i, 1)];
          x[IX(i, N + 1)] = b === 2 ? -x[IX(i, N)] : x[IX(i, N)];
        }
        x[IX(0, 0)] = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]);
        x[IX(0, N + 1)] = 0.5 * (x[IX(1, N + 1)] + x[IX(0, N)]);
        x[IX(N + 1, 0)] = 0.5 * (x[IX(N, 0)] + x[IX(N + 1, 1)]);
        x[IX(N + 1, N + 1)] = 0.5 * (x[IX(N, N + 1)] + x[IX(N + 1, N)]);
      }

      function linSolve(b, x, x0, a, c) {
        const cRecip = 1 / c;
        for (let k = 0; k < ITER; k++) {
          for (let j = 1; j <= N; j++) {
            for (let i = 1; i <= N; i++) {
              x[IX(i, j)] =
                (x0[IX(i, j)] +
                  a *
                    (x[IX(i - 1, j)] +
                      x[IX(i + 1, j)] +
                      x[IX(i, j - 1)] +
                      x[IX(i, j + 1)])) *
                cRecip;
            }
          }
          setBnd(b, x);
        }
      }

      function diffuse(b, x, x0, diff, dt) {
        const a = dt * diff * N * N;
        linSolve(b, x, x0, a, 1 + 4 * a);
      }

      function project(velocX, velocY, pField, divField) {
        for (let j = 1; j <= N; j++) {
          for (let i = 1; i <= N; i++) {
            divField[IX(i, j)] =
              (-0.5 *
                (velocX[IX(i + 1, j)] -
                  velocX[IX(i - 1, j)] +
                  velocY[IX(i, j + 1)] -
                  velocY[IX(i, j - 1)])) /
              N;
            pField[IX(i, j)] = 0;
          }
        }
        setBnd(0, divField);
        setBnd(0, pField);
        linSolve(0, pField, divField, 1, 4);

        for (let j = 1; j <= N; j++) {
          for (let i = 1; i <= N; i++) {
            velocX[IX(i, j)] -= 0.5 * (pField[IX(i + 1, j)] - pField[IX(i - 1, j)]) * N;
            velocY[IX(i, j)] -= 0.5 * (pField[IX(i, j + 1)] - pField[IX(i, j - 1)]) * N;
          }
        }
        setBnd(1, velocX);
        setBnd(2, velocY);
      }

      function advect(b, dField, d0Field, velocX, velocY, dt) {
        const dt0 = dt * N;
        for (let j = 1; j <= N; j++) {
          for (let i = 1; i <= N; i++) {
            let x = i - dt0 * velocX[IX(i, j)];
            let y = j - dt0 * velocY[IX(i, j)];
            if (x < 0.5) x = 0.5;
            if (x > N + 0.5) x = N + 0.5;
            if (y < 0.5) y = 0.5;
            if (y > N + 0.5) y = N + 0.5;
            const i0 = Math.floor(x);
            const i1 = i0 + 1;
            const j0 = Math.floor(y);
            const j1 = j0 + 1;
            const s1 = x - i0;
            const s0 = 1 - s1;
            const t1 = y - j0;
            const t0 = 1 - t1;
            dField[IX(i, j)] =
              s0 * (t0 * d0Field[IX(i0, j0)] + t1 * d0Field[IX(i0, j1)]) +
              s1 * (t0 * d0Field[IX(i1, j0)] + t1 * d0Field[IX(i1, j1)]);
          }
        }
        setBnd(b, dField);
      }

      function dissipate(field, factor) {
        for (let i = 0; i < field.length; i++) field[i] *= factor;
      }

      function velocityStep() {
        // swap semantics: diffuse from u into u0 then advect back
        diffuse(1, u0, u, VISCOSITY, DT);
        diffuse(2, v0, v, VISCOSITY, DT);
        project(u0, v0, p, div);
        advect(1, u, u0, u0, v0, DT);
        advect(2, v, v0, u0, v0, DT);
        project(u, v, p, div);
        dissipate(u, VEL_DISSIPATION);
        dissipate(v, VEL_DISSIPATION);
      }

      function densityStep() {
        diffuse(0, d0, d, DIFFUSION, DT);
        advect(0, d, d0, u, v, DT);
        dissipate(d, DEN_DISSIPATION);
      }

      // Cheap value-noise for irregular deposition (breaks circular shock rings).
      function hash2(ix, iy) {
        let n = ix * 374761393 + iy * 668265263;
        n = (n ^ (n >>> 13)) * 1274126177;
        return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
      }

      function valueNoise(x, y) {
        const x0 = Math.floor(x);
        const y0 = Math.floor(y);
        const fx = x - x0;
        const fy = y - y0;
        const sx = fx * fx * (3 - 2 * fx);
        const sy = fy * fy * (3 - 2 * fy);
        const a = hash2(x0, y0);
        const b = hash2(x0 + 1, y0);
        const c = hash2(x0, y0 + 1);
        const d = hash2(x0 + 1, y0 + 1);
        const ab = a + (b - a) * sx;
        const cd = c + (d - c) * sx;
        return ab + (cd - ab) * sy;
      }

      /**
       * Irregular multi-lobe splat: density + velocity dual-write.
       * Noise-modulated elliptical falloff avoids concentric shockwave rings.
       * densityOnly=true deposits ink without adding impulse.
       */
      function splat(nx, ny, dx, dy, amount, radius, opts) {
        const options = opts || {};
        const densityOnly = !!options.densityOnly;
        const aspect = options.aspect != null ? options.aspect : 0.72 + Math.random() * 0.55;
        const rot = options.rot != null ? options.rot : Math.random() * Math.PI;
        const seed = options.seed != null ? options.seed : Math.random() * 1000;
        const noiseAmp = options.noiseAmp != null ? options.noiseAmp : 0.55;

        const cx = 1 + nx * N;
        const cy = 1 + ny * N;
        const r = Math.max(1.1, radius * N);
        const cosR = Math.cos(rot);
        const sinR = Math.sin(rot);
        // search bound large enough for elongated + noisy lobes
        const bound = r * (2.8 + noiseAmp);
        const i0 = Math.max(1, Math.floor(cx - bound));
        const i1 = Math.min(N, Math.ceil(cx + bound));
        const j0 = Math.max(1, Math.floor(cy - bound));
        const j1 = Math.min(N, Math.ceil(cy + bound));

        for (let j = j0; j <= j1; j++) {
          for (let i = i0; i <= i1; i++) {
            const ox = i - cx;
            const oy = j - cy;
            // rotate into ellipse frame
            const rx = (ox * cosR + oy * sinR) / r;
            const ry = (-ox * sinR + oy * cosR) / (r * aspect);
            const base = rx * rx + ry * ry;
            if (base > 5.5) continue;

            // multi-frequency noise warps the isocontour — breaks perfect circles
            const n1 = valueNoise(i * 0.22 + seed, j * 0.22 + seed * 0.7);
            const n2 = valueNoise(i * 0.55 + seed * 1.3, j * 0.55 - seed * 0.4);
            const n3 = valueNoise(i * 1.1 - seed, j * 1.1 + seed * 0.2);
            const n = (n1 * 0.55 + n2 * 0.3 + n3 * 0.15) * 2 - 1; // [-1,1]
            const warped = base * (1 + noiseAmp * n * 0.85) - noiseAmp * n * 0.35;
            if (warped > 3.2) continue;

            // soft but slightly steeper core — less ring-like bloom
            const falloff = Math.exp(-warped * 1.15) * (0.75 + 0.25 * (n1));
            if (falloff < 0.012) continue;

            const idx = IX(i, j);
            if (!densityOnly) {
              // mild local anisotropy on velocity so force isn't a perfect radial disk
              const tang = (n2 - 0.5) * 0.35;
              u[idx] += (dx + (-dy) * tang * 0.4) * falloff;
              v[idx] += (dy + dx * tang * 0.4) * falloff;
            }
            d[idx] += amount * falloff;
          }
        }
      }

      /** Natural seepage drop: many irregular density kernels + weak tangential curl. */
      function randomDrop() {
        // Avoid single circular splat + strong radial force (reads as shockwave).
        const nx = 0.24 + Math.random() * 0.52;
        const ny = 0.2 + Math.random() * 0.5;
        const baseAmt = theme === 'dark' ? 3.6 + Math.random() * 1.4 : 4.4 + Math.random() * 1.6;
        const baseR = 0.028 + Math.random() * 0.02;
        const seed = Math.random() * 2000;

        // 1) core multi-point deposit — density only, irregular lobes (no impulse)
        const cores = 5 + Math.floor(Math.random() * 5); // 5–9
        for (let k = 0; k < cores; k++) {
          const ang = Math.random() * Math.PI * 2;
          const dist = (Math.random() ** 1.6) * 0.045; // clustered near impact
          const px = nx + Math.cos(ang) * dist;
          const py = ny + Math.sin(ang) * dist * (0.75 + Math.random() * 0.4);
          const amt = baseAmt * (0.22 + Math.random() * 0.38);
          const rad = baseR * (0.55 + Math.random() * 0.9);
          splat(px, py, 0, 0, amt, rad, {
            densityOnly: true,
            aspect: 0.55 + Math.random() * 0.9,
            rot: Math.random() * Math.PI,
            seed: seed + k * 17.3,
            noiseAmp: 0.65 + Math.random() * 0.35,
          });
        }

        // 2) soft outer seepage fringe — still density-only, larger/noisier
        const fringes = 3 + Math.floor(Math.random() * 3); // 3–5
        for (let k = 0; k < fringes; k++) {
          const ang = Math.random() * Math.PI * 2;
          const dist = 0.02 + Math.random() * 0.055;
          splat(
            nx + Math.cos(ang) * dist,
            ny + Math.sin(ang) * dist * 0.85,
            0,
            0,
            baseAmt * (0.08 + Math.random() * 0.12),
            baseR * (1.2 + Math.random() * 0.9),
            {
              densityOnly: true,
              aspect: 0.45 + Math.random() * 1.1,
              rot: ang + (Math.random() - 0.5),
              seed: seed + 100 + k * 23.1,
              noiseAmp: 0.85,
            }
          );
        }

        // 3) weak tangential curl only — seepage, not blast
        //    inject tiny velocity at a few offset lobes (no strong radial force)
        const curls = 2 + Math.floor(Math.random() * 2); // 2–3
        for (let k = 0; k < curls; k++) {
          const ang = Math.random() * Math.PI * 2;
          const dist = Math.random() * 0.03;
          const px = nx + Math.cos(ang) * dist;
          const py = ny + Math.sin(ang) * dist;
          // pure tangential-ish, very small magnitude
          const swirl = 0.04 + Math.random() * 0.08;
          const sink = 0.02 + Math.random() * 0.04;
          const tx = -Math.sin(ang) * swirl;
          const ty = Math.cos(ang) * swirl * 0.7 + sink;
          splat(px, py, tx, ty, baseAmt * 0.06, baseR * 0.7, {
            densityOnly: false,
            aspect: 0.7 + Math.random() * 0.5,
            rot: ang,
            seed: seed + 200 + k * 11,
            noiseAmp: 0.5,
          });
        }
      }

      function clearFields() {
        u.fill(0);
        v.fill(0);
        u0.fill(0);
        v0.fill(0);
        d.fill(0);
        d0.fill(0);
        p.fill(0);
        div.fill(0);
      }

      function applyTheme() {
        document.documentElement.setAttribute('data-theme', theme);
      }

      function resize() {
        const rect = stage.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(2, Math.floor(rect.width * dpr));
        canvas.height = Math.max(2, Math.floor(rect.height * dpr));
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      }

      function inkColor(alpha) {
        if (theme === 'dark') {
          // cold light ink on dark bg
          return [210, 220, 235, alpha];
        }
        // deep ink on light bg
        return [18, 20, 26, alpha];
      }

      function render() {
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        // upsample density field with soft sampling
        const img = ctx.createImageData(w, h);
        const data = img.data;
        const ink = inkColor(1);
        for (let y = 0; y < h; y++) {
          const gy = 1 + (y / (h - 1)) * N;
          const j0 = Math.min(N, Math.max(1, Math.floor(gy)));
          const j1 = Math.min(N + 1, j0 + 1);
          const ty = gy - j0;
          for (let x = 0; x < w; x++) {
            const gx = 1 + (x / (w - 1)) * N;
            const i0 = Math.min(N, Math.max(1, Math.floor(gx)));
            const i1 = Math.min(N + 1, i0 + 1);
            const tx = gx - i0;
            const d00 = d[IX(i0, j0)];
            const d10 = d[IX(i1, j0)];
            const d01 = d[IX(i0, j1)];
            const d11 = d[IX(i1, j1)];
            const dens =
              (1 - tx) * (1 - ty) * d00 +
              tx * (1 - ty) * d10 +
              (1 - tx) * ty * d01 +
              tx * ty * d11;
            // nonlinear response → darker core, soft veil edge
            const a = Math.min(1, Math.pow(Math.max(0, dens) * 0.42, 0.85));
            if (a < 0.004) continue;
            const pidx = (y * w + x) * 4;
            data[pidx] = ink[0];
            data[pidx + 1] = ink[1];
            data[pidx + 2] = ink[2];
            data[pidx + 3] = Math.floor(a * 255);
          }
        }
        ctx.putImageData(img, 0, 0);
      }

      function pointerToNorm(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: Math.min(1, Math.max(0, (clientX - rect.left) / rect.width)),
          y: Math.min(1, Math.max(0, (clientY - rect.top) / rect.height)),
        };
      }

      function onPointerDown(e) {
        dragging = true;
        const pnt = pointerToNorm(e.clientX, e.clientY);
        lastX = pnt.x;
        lastY = pnt.y;
        // click = soft drop-in, not an upward jet
        splat(pnt.x, pnt.y, 0, 0.18, theme === 'dark' ? 4.0 : 5.0, 0.06);
        canvas.setPointerCapture?.(e.pointerId);
      }

      function onPointerMove(e) {
        if (!dragging) return;
        const pnt = pointerToNorm(e.clientX, e.clientY);
        const dx = (pnt.x - lastX) * 12;
        const dy = (pnt.y - lastY) * 12;
        splat(pnt.x, pnt.y, dx, dy, theme === 'dark' ? 1.4 : 1.8, 0.04);
        lastX = pnt.x;
        lastY = pnt.y;
      }

      function onPointerUp(e) {
        dragging = false;
        try {
          canvas.releasePointerCapture?.(e.pointerId);
        } catch (_) {}
      }

      function tick(ts) {
        if (!lastTs) lastTs = ts;
        const elapsed = ts - lastTs;
        lastTs = ts;
        // fixed substeps for stability when tab is throttled
        const steps = Math.min(3, Math.max(1, Math.round(elapsed / 16)));
        for (let s = 0; s < steps; s++) {
          velocityStep();
          densityStep();
        }

        if (autoDrop && ts >= nextDropAt) {
          randomDrop();
          nextDropAt = ts + AUTO_MIN_MS + Math.random() * (AUTO_MAX_MS - AUTO_MIN_MS);
        }

        render();
        frame++;
        if (frame % 30 === 0) {
          let maxD = 0;
          for (let i = 0; i < d.length; i++) if (d[i] > maxD) maxD = d[i];
          statsEl.textContent =
            'N=' + N + ' · project/advect · maxD=' + maxD.toFixed(2) + ' · ' + theme;
        }
        requestAnimationFrame(tick);
      }

      btnDrop.addEventListener('click', () => randomDrop());
      btnClear.addEventListener('click', () => clearFields());
      btnTheme.addEventListener('click', () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        applyTheme();
      });
      btnAuto.addEventListener('click', () => {
        autoDrop = !autoDrop;
        btnAuto.textContent = '自动落墨：' + (autoDrop ? '开' : '关');
        if (autoDrop) nextDropAt = performance.now() + 400;
      });

      canvas.addEventListener('pointerdown', onPointerDown);
      canvas.addEventListener('pointermove', onPointerMove);
      canvas.addEventListener('pointerup', onPointerUp);
      canvas.addEventListener('pointercancel', onPointerUp);
      window.addEventListener('resize', resize);

      applyTheme();
      resize();
      // first drop so preview is never empty
      randomDrop();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
