<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        try {
          var key = "peer-theme";
          var pref = localStorage.getItem(key) || "system";
          if (pref !== "light" && pref !== "dark" && pref !== "system") pref = "system";
          var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = pref === "dark" || (pref === "system" && systemDark) ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.setAttribute("data-theme-pref", pref);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="./favicon.png" type="image/png" />
    <title>Peer Agent — Changelog</title>
    <style>
      :root {
        --graphite-btn: #1a1d21;
        --graphite-btn-ink: #f5f7fa;
        --bg: #f5f5f7;
        --bg-elevated: #ffffff;
        --ink: #1d1d1f;
        --ink-soft: #6e6e73;
        --ink-fade: #86868b;
        --line: rgba(0, 0, 0, 0.08);
        --graphite: #1a1d21;
        --graphite-hover: #2a2d33;
        --azure: #3b7fab;
        --azure-soft: #d8e4ee;
        --hairline: #dce0e8;
        --shadow-soft: 0 1px 2px rgba(0,0,0,.04), 0 12px 28px rgba(0,0,0,.06);
        --wide: 1120px;
        --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
          "Inter", "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", system-ui, sans-serif;
        --mono: "SF Mono", "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
      }

      html[data-theme="light"] {
        color-scheme: light;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0f1114;
        --bg-elevated: #161a20;
        --ink: #f2f4f7;
        --ink-soft: #c2c9d2;
        --ink-fade: #98a1ad;
        --line: rgba(255, 255, 255, 0.10);
        --line-strong: rgba(255, 255, 255, 0.14);
        --graphite: #f5f7fa;
        --graphite-hover: #ffffff;
        --graphite-btn: #f5f7fa;
        --graphite-btn-ink: #121417;
        --azure: #6eb0d6;
        --azure-strong: #8fc4e2;
        --azure-soft: rgba(110, 176, 214, 0.18);
        --paper: #12161c;
        --fill: #1b212a;
        --composer: #1a2028;
        --hairline: rgba(255, 255, 255, 0.10);
        --code-bg: #0b0d10;
        --code-ink: #d8e0ea;
        --shadow: 0 2px 8px rgba(0,0,0,.35), 0 28px 60px rgba(0,0,0,.45);
        --shadow-soft: 0 1px 2px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.35);
        --nav-bg: rgba(15, 17, 20, 0.78);
        --nav-border: rgba(255, 255, 255, 0.08);
        --chip-bg: rgba(255, 255, 255, 0.06);
        --chip-active-bg: #1c222b;
        --hover-fill: rgba(255, 255, 255, 0.06);
        --card-bg: rgba(255, 255, 255, 0.03);
      }
      html[data-theme="light"] {
        --nav-bg: rgba(245, 245, 247, 0.72);
        --nav-border: rgba(0, 0, 0, 0.06);
        --chip-bg: rgba(0, 0, 0, 0.04);
        --chip-active-bg: #ffffff;
        --hover-fill: rgba(0, 0, 0, 0.04);
        --card-bg: #ffffff;
      }
      :root {
        --nav-bg: rgba(245, 245, 247, 0.72);
        --nav-border: rgba(0, 0, 0, 0.06);
        --chip-bg: rgba(0, 0, 0, 0.04);
        --chip-active-bg: #ffffff;
        --hover-fill: rgba(0, 0, 0, 0.04);
        --card-bg: #ffffff;
      }
      .theme-toggle {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--chip-bg);
        color: var(--ink-soft);
        width: 34px;
        height: 28px;
        border-radius: 980px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        transition: background .15s ease, color .15s ease, border-color .15s ease;
      }
      .theme-toggle:hover { color: var(--ink); background: var(--hover-fill); }
      .theme-toggle svg { width: 15px; height: 15px; display: block; }
      .theme-toggle[data-mode="light"] .icon-moon { display: none; }
      .theme-toggle[data-mode="dark"] .icon-sun { display: none; }
      .theme-toggle[data-mode="system"] .icon-sun,
      .theme-toggle[data-mode="system"] .icon-moon { display: none; }
      .theme-toggle[data-mode="system"] .icon-system { display: block; }
      .theme-toggle .icon-system { display: none; }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: var(--font);
        color: var(--ink);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        line-height: 1.47;
        letter-spacing: -0.01em;
      }
      a { color: inherit; text-decoration: none; }
      button { font: inherit; }

      .nav {
        position: sticky; top: 0; z-index: 40; height: 48px;
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        background: var(--nav-bg);
        border-bottom: 1px solid var(--nav-border);
      }
      .nav-inner {
        width: min(var(--wide), calc(100% - 40px));
        height: 100%; margin: 0 auto;
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
      }
      .nav-brand {
        display: inline-flex; align-items: center; gap: 8px;
        font-size: 14px; font-weight: 600; letter-spacing: -0.02em;
       color: var(--ink); }
      .mark {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        display: inline-block;
        object-fit: contain;
        flex-shrink: 0;
      }
.nav-links { display: flex; align-items: center; gap: 16px; }
      .nav-links a { font-size: 12px; color: var(--ink-soft); opacity: 0.88; }
      .nav-links a:hover { opacity: 1; }
      .nav-links a.active { opacity: 1; color: var(--ink); font-weight: 600; }
      .nav-links a.btn-link {
        color: var(--graphite-btn-ink) !important; background: var(--graphite-btn); border-radius: 980px;
        padding: 6px 12px; opacity: 1; font-weight: 500;
      }
      .nav-links a.btn-link:hover { background: var(--graphite-hover); }
      .lang {
        display: inline-flex; align-items: center; height: 28px; padding: 2px;
        border-radius: 980px; background: var(--chip-bg); gap: 1px;
      }
      .lang button {
        appearance: none; border: 0; background: transparent; color: var(--ink-fade);
        font-size: 11px; font-weight: 600; min-width: 30px; height: 24px;
        border-radius: 980px; cursor: pointer; padding: 0 8px;
      }
      .lang button[aria-pressed="true"] {
        background: var(--chip-active-bg); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08);
      }

      main {
        width: min(var(--wide), calc(100% - 40px));
        margin: 0 auto;
        padding: 56px 0 80px;
      }
      .hero {
        text-align: center;
        margin-bottom: 40px;
      }
      .kicker {
        margin: 0 0 12px;
        font-size: 15px; font-weight: 600; color: var(--azure);
      }
      h1 {
        margin: 0 0 10px;
        font-size: clamp(36px, 5vw, 52px);
        line-height: 1.08;
        letter-spacing: -0.03em;
        font-weight: 650;
      }
      .subhead {
        margin: 0 auto;
        max-width: 34em;
        font-size: 17px;
        color: var(--ink-soft);
      }

      .release-browser {
        display: grid;
        grid-template-columns: minmax(210px, 260px) minmax(0, 1fr);
        gap: 18px;
        align-items: start;
      }
      .release-nav {
        position: sticky;
        top: 78px;
        background: var(--bg-elevated);
        border-radius: 20px;
        padding: 14px;
        box-shadow: 0 1px 0 rgba(0,0,0,0.03);
      }
      .channel-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
      .channel-tab, .version-link, .retry-button { border: 0; font: inherit; cursor: pointer; color: var(--ink-soft); }
      .channel-tab { border-radius: 12px; padding: 9px 10px; background: transparent; font-size: 13px; font-weight: 650; }
      .channel-tab[aria-selected="true"] { color: var(--ink); background: var(--bg); }
      .version-list { display: grid; gap: 4px; max-height: calc(100vh - 190px); overflow: auto; }
      .version-link {
        display: flex; justify-content: space-between; gap: 8px; width: 100%;
        border-radius: 10px; padding: 9px 10px; background: transparent; text-align: left;
        font-family: var(--mono); font-size: 13px;
      }
      .version-link:hover, .version-link[aria-current="true"] { color: var(--ink); background: var(--bg); }
      .channel-count { font-family: var(--font); color: var(--ink-fade); font-size: 11px; }
      .timeline { min-width: 0; }
      .status-card { text-align: center; color: var(--ink-fade); padding: 56px 24px; }
      .retry-button { margin-top: 14px; border-radius: 980px; padding: 8px 14px; background: var(--azure); color: white; }
      .release {
        background: var(--bg-elevated);
        border-radius: 20px;
        padding: 24px 24px 18px;
        box-shadow: 0 1px 0 rgba(0,0,0,0.03);
      }
      .release-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .release-head h2 {
        margin: 0;
        font-size: 22px;
        letter-spacing: -0.02em;
        font-weight: 650;
        font-family: var(--mono);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding: 0 10px;
        border-radius: 980px;
        background: rgba(59,127,171,0.12);
        color: var(--azure);
        font-size: 12px;
        font-weight: 600;
      }
      .section {
        margin-top: 14px;
      }
      .section h3 {
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--ink-fade);
      }
      .section.added > h3 { color: #3e7a6b; }
      .section.fixed > h3 { color: #9a5b3c; }
      .section.improved > h3 { color: var(--azure); }
      .section.breaking > h3 { color: #a33b3b; }
      .subsection {
        margin-top: 14px;
      }
      .subsection h4 {
        margin: 0 0 8px;
        color: var(--ink);
        font-size: 16px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      ul {
        margin: 0;
        padding: 0 0 0 1.1em;
      }
      li {
        margin: 0 0 6px;
        color: var(--ink-soft);
        font-size: 14.5px;
        line-height: 1.5;
      }
      li strong, li b { color: var(--ink); font-weight: 600; }
      .empty {
        text-align: center;
        color: var(--ink-fade);
        padding: 40px 0;
      }
      @media (max-width: 720px) {
        .release-browser { grid-template-columns: 1fr; }
        .release-nav { position: static; }
        .version-list { display: flex; max-height: none; overflow-x: auto; padding-bottom: 4px; }
        .version-link { flex: 0 0 auto; width: auto; }
      }

      footer {
        border-top: 1px solid var(--line);
        padding: 22px 0 40px;
        color: var(--ink-fade);
        font-size: 12px;
      }
      .footer-inner {
        width: min(var(--wide), calc(100% - 40px));
        margin: 0 auto;
        display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      }
      .footer-links { display: flex; gap: 16px; }
      .footer-links a:hover { color: var(--ink-soft); }
      .preview-note {
        position: fixed; right: 14px; bottom: 14px; z-index: 50;
        font-size: 11px; color: var(--ink-soft);
        background: rgba(255,255,255,0.9);
        border: 1px solid var(--line); border-radius: 980px;
        padding: 6px 10px; box-shadow: var(--shadow-soft);
      }
      @media (max-width: 640px) {
        .nav-links a:not(.btn-link) { display: none; }
        .release { padding: 18px 16px 14px; }
      }
    </style>
  </head>
  <body>
    <header class="nav">
      <div class="nav-inner">
        <a class="nav-brand" href="./index.html">
          <img class="mark" data-logo-light="./logo-light.png" data-logo-dark="./logo-dark.png" src="./logo-light.png" alt="" width="18" height="18" />
          <span>Peer Agent</span>
        </a>
        <div class="nav-links">
          <a href="./docs.html" data-i18n="nav.docs">Docs</a>
          <a href="./index.html#mechanisms" data-i18n="nav.mechanisms">Why Peer</a>
          <a class="active" href="./changelog.html" data-i18n="nav.changelog">Changelog</a>
          <a href="https://github.com/ly-ccx/Peer-Agent" target="_blank" rel="noreferrer" data-i18n="nav.github">GitHub</a>
          <a class="btn-link" href="./index.html#get" data-i18n="nav.download">Download</a>
                    <button type="button" class="theme-toggle" data-mode="system" aria-label="Theme: System">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"></path>

              <path d="M8 20h8M12 16v4"></path>

          </button>
          <div class="lang lang-toggle" role="group" aria-label="Language">

            <button type="button" id="lang-zh" data-lang="zh" aria-pressed="false">中文</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="hero">
        <p class="kicker" data-i18n="hero.kicker">Release notes</p>
        <h1 data-i18n="hero.title">Changelog</h1>
        <p class="subhead" data-i18n="hero.sub">
          Product-facing notes for Peer Agent Desktop and CLI. Hosted here — not a git history dump.
        </p>
      </section>
      <section class="release-browser" aria-label="Release browser">
        <nav class="release-nav" aria-label="Release channels">
          <div class="channel-tabs" role="tablist" aria-label="Release channels">
            <button type="button" class="channel-tab" data-channel="stable" role="tab" aria-selected="true">正式版</button>
            <button type="button" class="channel-tab" data-channel="beta" role="tab" aria-selected="false">Beta</button>
          </div>
          <div id="version-list" class="version-list" aria-label="Versions"></div>

        <div id="timeline" class="timeline" aria-live="polite" aria-busy="true"></div>

    <footer>
      <div class="footer-inner">
        <div data-i18n="footer.copy">Peer Agent · early preview · MIT</div>
        <div class="footer-links">
          <a href="./index.html" data-i18n="footer.home">Home</a>
          <a href="./docs.html" data-i18n="footer.docs">Docs</a>
          <a href="./index.html#get" data-i18n="footer.download">Download</a>
        </div>
      </div>
    </footer>
    <div class="preview-note" data-i18n="preview.note">github pages</div>

    <script>
      (function () {
        var STORAGE_KEY = "peer-landing-lang";
        var LABELS = {"en": {"added": "What's New", "improved": "Improvements", "fixed": "Fixes", "changed": "Changes", "breaking": "Breaking", "known": "Known Issues", "note": "Notes", "other": "Notes"}, "zh": {"added": "新功能", "improved": "优化", "fixed": "修复", "changed": "变更", "breaking": "破坏性变更", "known": "已知问题", "note": "说明", "other": "说明"}};

        var ui = {
          en: {
            "nav.docs": "Docs",
            "nav.mechanisms": "Why Peer",
            "nav.changelog": "Changelog",
            "nav.github": "GitHub",
            "nav.download": "Download",
            "hero.kicker": "Release notes",
            "hero.title": "Changelog",
            "hero.sub": "Product-facing notes for Peer Agent Desktop and CLI. Hosted here — not a git history dump.",
            "footer.copy": "Peer Agent · early preview · MIT",
            "footer.home": "Home",
            "footer.docs": "Docs",
            "footer.download": "Download",
            "preview.note": "github pages",
            "latest": "Latest",
            "channel.stable": "Stable",
            "channel.beta": "Beta",
            "loading": "Loading release notes…",
            "loadError": "Release notes could not be loaded.",
            "retry": "Retry",
            "empty": "No release notes yet.",
            documentTitle: "Peer Agent — Changelog"
          },
          zh: {
            "nav.docs": "文档",
            "nav.mechanisms": "为什么",
            "nav.changelog": "更新日志",
            "nav.github": "GitHub",
            "nav.download": "下载",
            "hero.kicker": "版本说明",
            "hero.title": "更新日志",
            "hero.sub": "面向产品用户的 Desktop 与 CLI 更新说明。独立承载，不跳转到 git 历史。",
            "footer.copy": "Peer Agent · 早期预览 · MIT",
            "footer.home": "首页",
            "footer.docs": "文档",
            "footer.download": "下载",
            "preview.note": "GitHub Pages",
            "latest": "最新",
            "channel.stable": "正式版",
            "channel.beta": "Beta 版",
            "loading": "正在加载版本说明…",
            "loadError": "版本说明加载失败。",
            "retry": "重试",
            "empty": "暂无版本说明。",
            documentTitle: "Peer Agent — 更新日志"
          }
        };
        var state = { manifest: null, channel: "stable", selected: null, entry: null, lang: "en", request: 0 };

        function detectLang() {
          try {
            var saved = localStorage.getItem(STORAGE_KEY);
            if (saved === "en" || saved === "zh") return saved;
          } catch (e) {}
          var nav = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
          return String(nav).toLowerCase().startsWith("zh") ? "zh" : "en";
        }

        function formatInline(text) {
          // **bold**
          var esc = text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
          return esc.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        }

        function channelEntries(channel) {
          return state.manifest && state.manifest.channels[channel] ? state.manifest.channels[channel] : [];
        }

        function findMetadata(version) {
          var channels = state.manifest ? state.manifest.channels : {};
          return ["stable", "beta"].reduce(function (found, channel) {
            return found || (channels[channel] || []).find(function (entry) { return entry.version === version; });
          }, null);
        }

        function updateUrl(version, replace) {
          var url = new URL(window.location.href);
          url.searchParams.set("version", version);
          window.history[replace ? "replaceState" : "pushState"]({ version: version }, "", url.pathname + url.search + url.hash);
        }

        function renderStatus(key, retry) {
          var root = document.getElementById("timeline");
          if (!root) return;
          root.innerHTML = "";
          root.setAttribute("aria-busy", key === "loading" ? "true" : "false");
          var card = document.createElement("div");
          card.className = "release status-card";
          card.textContent = ui[state.lang][key];
          if (retry) {
            var button = document.createElement("button");
            button.type = "button";
            button.className = "retry-button";
            button.textContent = ui[state.lang].retry;
            button.addEventListener("click", retry);
            card.appendChild(document.createElement("br"));
            card.appendChild(button);
          }
          root.appendChild(card);
        }

        function renderNavigation() {
          document.querySelectorAll(".channel-tab").forEach(function (button) {
            var channel = button.getAttribute("data-channel");
            button.textContent = ui[state.lang]["channel." + channel] + " · " + channelEntries(channel).length;
            button.setAttribute("aria-selected", channel === state.channel ? "true" : "false");
          });
          var list = document.getElementById("version-list");
          if (!list) return;
          list.innerHTML = "";
          channelEntries(state.channel).forEach(function (entry) {
            var button = document.createElement("button");
            button.type = "button";
            button.className = "version-link";
            button.setAttribute("aria-current", entry.version === state.selected ? "true" : "false");
            button.textContent = entry.label;
            button.addEventListener("click", function () { selectVersion(entry.version, false); });
            list.appendChild(button);
          });
        }

        function renderEntry() {
          if (!state.entry) return;
          var root = document.getElementById("timeline");
          var entry = state.entry;
          var sections = entry[state.lang] && entry[state.lang].length ? entry[state.lang] : entry.en;
          root.innerHTML = "";
          root.setAttribute("aria-busy", "false");
          var card = document.createElement("article");
          card.className = "release";
          card.id = entry.version;
          var head = document.createElement("div");
          head.className = "release-head";
          var h2 = document.createElement("h2");
          h2.textContent = entry.label;
          head.appendChild(h2);
          if (state.manifest.latest[entry.channel] === entry.version) {
            var badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = ui[state.lang].latest;
            head.appendChild(badge);
          }
          card.appendChild(head);
          function renderItems(items) {
            var ul = document.createElement("ul");
            items.forEach(function (item) {
              var li = document.createElement("li");
              li.innerHTML = formatInline(item);
              ul.appendChild(li);
            });
            return ul;
          }

          (sections || []).forEach(function (sec) {
            var wrap = document.createElement("section");
            wrap.className = "section " + (sec.key || "other");
            var h3 = document.createElement("h3");
            h3.textContent = sec.title || (LABELS[state.lang] && LABELS[state.lang][sec.key]) || LABELS[state.lang].other;
            wrap.appendChild(h3);
            if (sec.items && sec.items.length) wrap.appendChild(renderItems(sec.items));
            (sec.subsections || []).forEach(function (subsection) {
              var subwrap = document.createElement("section");
              subwrap.className = "subsection";
              var h4 = document.createElement("h4");
              h4.textContent = subsection.title;
              subwrap.appendChild(h4);
              subwrap.appendChild(renderItems(subsection.items));
              wrap.appendChild(subwrap);
            });
            card.appendChild(wrap);
          });
          root.appendChild(card);
        }

        function loadVersion(version, force) {
          var metadata = findMetadata(version);
          if (!metadata) return Promise.reject(new Error("Unknown version: " + version));
          var request = ++state.request;
          renderStatus("loading", false);
          return fetch("./changelog-data/" + metadata.file, { cache: force ? "reload" : "default" })
            .then(function (response) { if (!response.ok) throw new Error("HTTP " + response.status); return response.json(); })
            .then(function (entry) { if (request !== state.request) return; state.entry = entry; renderEntry(); })
            .catch(function (error) {
              if (request === state.request) renderStatus("loadError", function () { loadVersion(state.selected, true).catch(function () {}); });
              throw error;
            });
        }

        function selectVersion(version, replace) {
          var metadata = findMetadata(version);
          if (!metadata) return false;
          state.channel = metadata.channel;
          state.selected = version;
          state.entry = null;
          renderNavigation();
          updateUrl(version, replace);
          loadVersion(version, false).catch(function () {});
          return true;
        }

        function selectChannel(channel) {
          var entries = channelEntries(channel);
          if (!entries.length) return;
          state.channel = channel;
          selectVersion(entries[0].version, false);
        }

        function applyLang(lang) {
          var pack = ui[lang] || ui.en;
          document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
          document.title = pack.documentTitle;
          document.querySelectorAll("[data-i18n]").forEach(function (el) {
            var key = el.getAttribute("data-i18n");
            if (key && pack[key] != null) el.textContent = pack[key];
          });
          var enBtn = document.getElementById("lang-en");
          var zhBtn = document.getElementById("lang-zh");
          if (enBtn) enBtn.setAttribute("aria-pressed", lang === "en" ? "true" : "false");
          if (zhBtn) zhBtn.setAttribute("aria-pressed", lang === "zh" ? "true" : "false");
          state.lang = lang;
          if (state.manifest) renderNavigation();
          if (state.entry) renderEntry();
        }

        function setLang(lang, persist) {
          if (lang !== "en" && lang !== "zh") lang = "en";
          applyLang(lang);
          if (persist) {
            try { localStorage.setItem(STORAGE_KEY, lang); } catch (e) {}
          }
        }

        document.querySelectorAll(".lang-toggle button").forEach(function (btn) {
          btn.addEventListener("click", function () {
            setLang(btn.getAttribute("data-lang"), true);
          });
        });
        document.querySelectorAll(".channel-tab").forEach(function (btn) {
          btn.addEventListener("click", function () { selectChannel(btn.getAttribute("data-channel")); });
        });
        window.addEventListener("popstate", function () {
          var requested = requestedVersion();
          if (requested && requested !== state.selected) selectVersion(requested, true);
        });

        function requestedVersion() {
          var url = new URL(window.location.href);
          var query = url.searchParams.get("version");
          var hash = decodeURIComponent(url.hash.replace(/^#/, ""));
          return query || (hash.indexOf("v") === 0 ? hash : null);
        }

        function loadManifest(force) {
          renderStatus("loading", false);
          return fetch("./changelog-data/manifest.json", { cache: force ? "reload" : "default" })
            .then(function (response) { if (!response.ok) throw new Error("HTTP " + response.status); return response.json(); })
            .then(function (manifest) {
              state.manifest = manifest;
              var requested = requestedVersion();
              var initial = findMetadata(requested) ? requested : (manifest.latest.stable || manifest.latest.beta);
              if (!initial) { renderStatus("empty", false); return; }
              selectVersion(initial, true);
            })
            .catch(function () {
              renderStatus("loadError", function () { loadManifest(true).catch(function () {}); });
            });
        }

        setLang(detectLang(), false);
        loadManifest(false);
      })();
    </script>
  
    <script>
      (function () {
        var KEY = "peer-theme";
        var order = ["system", "light", "dark"];
        function systemDark() {
          return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        }
        function normalizePref(pref) {
          return pref === "light" || pref === "dark" || pref === "system" ? pref : "system";
        }
        function resolveTheme(pref) {
          pref = normalizePref(pref);
          if (pref === "dark") return "dark";
          if (pref === "light") return "light";
          return systemDark() ? "dark" : "light";
        }
        function readPref() {
          try { return normalizePref(localStorage.getItem(KEY) || "system"); }
          catch (e) { return "system"; }
        }
        function writePref(pref) {
          try { localStorage.setItem(KEY, pref); } catch (e) {}
        }
        function labels(pref, theme) {
          if (pref === "system") return theme === "dark" ? "Theme: System (Dark)" : "Theme: System (Light)";
          return pref === "dark" ? "Theme: Dark" : "Theme: Light";
        }
        function applyLogos(theme) {
          document.querySelectorAll("img.mark[data-logo-light][data-logo-dark]").forEach(function (img) {
            var next = theme === "dark" ? img.getAttribute("data-logo-dark") : img.getAttribute("data-logo-light");
            if (next && img.getAttribute("src") !== next) img.setAttribute("src", next);
          });
        }
        function applyTheme(pref) {
          pref = normalizePref(pref);
          var theme = resolveTheme(pref);
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.setAttribute("data-theme-pref", pref);
          applyLogos(theme);
          document.querySelectorAll(".theme-toggle").forEach(function (btn) {
            btn.setAttribute("data-mode", pref);
            btn.setAttribute("aria-label", labels(pref, theme));
            btn.title = labels(pref, theme);
          });
        }
        function cyclePref(pref) {
          var i = order.indexOf(normalizePref(pref));
          return order[(i + 1) % order.length];
        }
        function bind() {
          document.querySelectorAll(".theme-toggle").forEach(function (btn) {
            if (btn.__themeBound) return;
            btn.__themeBound = true;
            btn.addEventListener("click", function () {
              var next = cyclePref(readPref());
              writePref(next);
              applyTheme(next);
            });
          });
        }
        applyTheme(readPref());
        bind();
        if (window.matchMedia) {
          var mq = window.matchMedia("(prefers-color-scheme: dark)");
          var onChange = function () {
            if (readPref() === "system") applyTheme("system");
          };
          if (mq.addEventListener) mq.addEventListener("change", onChange);
          else if (mq.addListener) mq.addListener(onChange);
        }
        document.addEventListener("DOMContentLoaded", function () {
          applyTheme(readPref());
          bind();
        });
      })();
    </script>

  </body>
</html>
