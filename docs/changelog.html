    <title>Peer Agent — Changelog</title>
    <style>
      :root {
        --bg: #f5f5f7;
        --bg-elevated: #ffffff;
        --ink: #1d1d1f;
        --ink-soft: #6e6e73;
        --ink-fade: #86868b;
        --line: rgba(0, 0, 0, 0.08);
        --graphite: #1a1d21;
        --graphite-hover: #2a2d33;
        --azure: #3b7fab;
        --azure-soft: #d8e4ee;
        --hairline: #dce0e8;
        --shadow-soft: 0 1px 2px rgba(0,0,0,.04), 0 12px 28px rgba(0,0,0,.06);
        --wide: 920px;
        --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
          "Inter", "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", system-ui, sans-serif;
        --mono: "SF Mono", "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: var(--font);
        color: var(--ink);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        line-height: 1.47;
        letter-spacing: -0.01em;
      }
      a { color: inherit; text-decoration: none; }
      button { font: inherit; }

      .nav {
        position: sticky; top: 0; z-index: 40; height: 48px;
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        background: rgba(245,245,247,0.72);
        border-bottom: 1px solid rgba(0,0,0,0.06);
      }
      .nav-inner {
        width: min(var(--wide), calc(100% - 40px));
        height: 100%; margin: 0 auto;
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
      }
      .nav-brand {
        display: inline-flex; align-items: center; gap: 8px;
        font-size: 14px; font-weight: 600; letter-spacing: -0.02em;
      }
      .mark {
        width: 15px; height: 15px; border-radius: 4px;
        background: linear-gradient(145deg, #1a1d21, #3a4048); position: relative;
      }
      .mark::after {
        content: ""; position: absolute; inset: 4px; border-radius: 1.5px; background: var(--azure);
      }
      .nav-links { display: flex; align-items: center; gap: 16px; }
      .nav-links a { font-size: 12px; color: rgba(0,0,0,0.8); opacity: 0.88; }
      .nav-links a:hover { opacity: 1; }
      .nav-links a.btn-link {
        color: #fff !important; background: var(--graphite); border-radius: 980px;
        padding: 6px 12px; opacity: 1; font-weight: 500;
      }
      .nav-links a.btn-link:hover { background: var(--graphite-hover); }
      .lang {
        display: inline-flex; align-items: center; height: 28px; padding: 2px;
        border-radius: 980px; background: rgba(0,0,0,0.04); gap: 1px;
      }
      .lang button {
        appearance: none; border: 0; background: transparent; color: var(--ink-fade);
        font-size: 11px; font-weight: 600; min-width: 30px; height: 24px;
        border-radius: 980px; cursor: pointer; padding: 0 8px;
      }
      .lang button[aria-pressed="true"] {
        background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08);
      }

      main {
        width: min(var(--wide), calc(100% - 40px));
        margin: 0 auto;
        padding: 56px 0 80px;
      }
      .hero {
        text-align: center;
        margin-bottom: 40px;
      }
      .kicker {
        margin: 0 0 12px;
        font-size: 15px; font-weight: 600; color: var(--azure);
      }
      h1 {
        margin: 0 0 10px;
        font-size: clamp(36px, 5vw, 52px);
        line-height: 1.08;
        letter-spacing: -0.03em;
        font-weight: 650;
      }
      .subhead {
        margin: 0 auto;
        max-width: 34em;
        font-size: 17px;
        color: var(--ink-soft);
      }

      .timeline {
        display: grid;
        gap: 14px;
      }
      .release {
        background: var(--bg-elevated);
        border-radius: 20px;
        padding: 24px 24px 18px;
        box-shadow: 0 1px 0 rgba(0,0,0,0.03);
      }
      .release-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .release-head h2 {
        margin: 0;
        font-size: 22px;
        letter-spacing: -0.02em;
        font-weight: 650;
        font-family: var(--mono);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding: 0 10px;
        border-radius: 980px;
        background: rgba(59,127,171,0.12);
        color: var(--azure);
        font-size: 12px;
        font-weight: 600;
      }
      .section {
        margin-top: 14px;
      }
      .section h3 {
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--ink-fade);
      }
      .section.added h3 { color: #3e7a6b; }
      .section.fixed h3 { color: #9a5b3c; }
      .section.improved h3 { color: var(--azure); }
      .section.breaking h3 { color: #a33b3b; }
      ul {
        margin: 0;
        padding: 0 0 0 1.1em;
      }
      li {
        margin: 0 0 6px;
        color: var(--ink-soft);
        font-size: 14.5px;
        line-height: 1.5;
      }
      li strong, li b { color: var(--ink); font-weight: 600; }
      .empty {
        text-align: center;
        color: var(--ink-fade);
        padding: 40px 0;
      }

      footer {
        border-top: 1px solid var(--line);
        padding: 22px 0 40px;
        color: var(--ink-fade);
        font-size: 12px;
      }
      .footer-inner {
        width: min(var(--wide), calc(100% - 40px));
        margin: 0 auto;
        display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      }
      .footer-links { display: flex; gap: 16px; }
      .footer-links a:hover { color: var(--ink-soft); }
      .preview-note {
        position: fixed; right: 14px; bottom: 14px; z-index: 50;
        font-size: 11px; color: var(--ink-soft);
        background: rgba(255,255,255,0.9);
        border: 1px solid var(--line); border-radius: 980px;
        padding: 6px 10px; box-shadow: var(--shadow-soft);
      }
      @media (max-width: 640px) {
        .nav-links a:not(.btn-link) { display: none; }
        .release { padding: 18px 16px 14px; }
      }
    </style>
  </head>

: [{"key": "added", "title": "新功能", "items": ["**CLI 固定用户上下文条**：会话区上方固定显示当前相关的用户消息；运行中跟本轮提问，回看时尽量跟随视口对应的提问。", "**CLI 订阅额度**：会话顶栏在订阅账号下显示额度信息，并与在线状态右对齐排布。", "**CLI 霓虹活动态**：运行中状态有更清晰的霓虹活动反馈，并支持天/时/分的耗时展示。", "**CLI 模型能力**：模型列表支持一键复制整行配置；顶栏显示模型 · 思考力度，并修正 Grok 默认思考级别。", "**CLI 新会话与快捷键**：新增 `/new` 开启空会话，支持 Ctrl+X 组合快捷键。", "**CLI 历史窗口**：对话渲染改为有界窗口，默认从最近压缩点连续展示到现在；`/history` 统一浏览压缩前归档。", "**CLI 代码高亮**：围栏代码块增加轻量语法高亮。", "**CLI Grok 登录续期**：遇到 `scope_upgrade_required` 时自动触发重新登录，且登录提示不再挡住输入框。", "**上下文与压缩统一**：Desktop / CLI 共享压缩进度估算、连续性 handoff 与 provider 用量口径，减少两端行为分叉。"]}, {"key": "improved", "title": "优化", "items": ["**Desktop 输入框浮起阴影**：聊天输入框四周增加轻微阴影，更有浮起层次。", "**Desktop 上下文展示**：隐藏用户不需要的内部 pending 细节，界面更干净。", "**CLI 压缩与历史**：压缩摘要输入预算与 Desktop 对齐；COMPACTED 行显示真实压缩方法；状态栏用单条紧凑进度条。", "**CLI 输入体验**：软换行、按实际折行增高输入框、Shift+Enter 换行；粘贴图片不再重复内容或嵌套破损 chip。", "**CLI 主题与配色**：跟随系统自动切换浅色/深色；composer 颜色实时同步；活动色与 crush 渐变更一致。", "**CLI 工具与 Goal**：工具名间距更紧凑；Goal Runner 内部 tick 不再刷进聊天；新建 Goal 立即显示最新任务。", "**上下文占用**：发送后不再错误塌成 0%；按「下一请求」预算投影占用，Desktop / CLI 口径对齐。", "**网络恢复**：CLI 在流中断、网络抖动后可恢复 provider 连接，减少半截会话。"]}, {"key": "fixed", "title": "修复", "items": ["**上下文回跳**：修复恢复投影低估导致发送后占用从约 4% 跳到 18% 等问题。", "**压缩与摘要**：修复中途自动压缩与 Desktop LLM 摘要不一致、压缩进度/连续性丢失等问题。", "**历史分页**：修复 earlier 历史卡死、分页边界不正确等问题。", "**Goal 绑定**：Goal Runner 绑定到所属会话，避免串会话；runner 停止时叶子任务正确标失败。", "**Provider 路由**：Anthropic 走 messages 协议，补齐 channel→wire 矩阵与 Gemini generateContent 路径；OpenAI 侧清理非法 function 名。", "**其他**：更新图标在有可用更新时正确显示；多处 Thinking / Markdown / 表格渲染边界修复。"]}, {"key": "other", "title": "CLI / npm", "items": ["本版 GitHub Release 继续附带 CLI 归档（与 Desktop 同 tag）：`peer-darwin-arm64.tar.gz`。", "可安装：`npm i -g @peer-agent/cli@beta`。", "安装后执行 `peer --version` 应输出 `peer 0.0.1-beta.42`。", "会话与设置仍落在 `~/.peer-agent`，与 Desktop 共享。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**CLI pinned user context bar**: Keeps the relevant user message fixed above the session; follows the active turn while running, and tracks the in-view question when scrolling history.", "**CLI subscription quota**: Session header shows quota for subscription accounts, right-aligned with online status.", "**CLI neon activity state**: Clearer neon activity feedback while running, with day/hour/minute duration.", "**CLI model capabilities**: One-click copy of a full model row; header shows model · thinking strength; fixes default Grok thinking level.", "**CLI new session & shortcuts**: Add `/new` for an empty session, plus Ctrl+X chord shortcuts.", "**CLI history window**: Bounded conversation rendering from the latest compact point to now; `/history` browses pre-compact archives.", "**CLI code highlighting**: Lightweight syntax highlighting for fenced code blocks.", "**CLI Grok re-auth**: Auto re-login on `scope_upgrade_required`; login prompts no longer block the input.", "**Shared context & compaction**: Desktop / CLI share compact progress estimates, continuity handoff, and provider usage accounting."]}, {"key": "improved", "title": "Improvements", "items": ["**Desktop composer shadow**: Subtle elevation shadow around the chat input.", "**Desktop context UI**: Hides internal pending details users do not need.", "**CLI compact & history**: Aligns compact input budget with Desktop; COMPACTED rows show the real method; status bar uses a single compact progress bar.", "**CLI input UX**: Soft wrap, auto-grow by wrapped lines, Shift+Enter newline; image paste no longer duplicates content or nests broken chips.", "**CLI theme & colors**: Follows system light/dark; composer colors stay in sync; activity colors match the crush gradient more closely.", "**CLI tools & Goal**: Tighter tool-name spacing; Goal Runner internal ticks no longer flood chat; new Goals show latest tasks immediately.", "**Context occupancy**: No longer collapses to 0% after send; projects occupancy from the next-request budget on Desktop and CLI.", "**Network recovery**: CLI can restore the provider connection after stream drops / network blips."]}, {"key": "fixed", "title": "Fixes", "items": ["**Context jump**: Fix restore projection under-estimates that made occupancy jump after send.", "**Compaction & summaries**: Align mid-run auto-compact with Desktop LLM summaries; restore compact progress / continuity.", "**History paging**: Fix stuck earlier-history and incorrect page boundaries.", "**Goal binding**: Bind Goal Runner to its owning session; mark leaf tasks failed when the runner stops.", "**Provider routing**: Anthropic via messages protocol, channel→wire matrix + Gemini generateContent path; strip illegal OpenAI function names.", "**Other**: Update badge shows correctly when an update is available; Thinking / Markdown / table rendering edge cases."]}, {"key": "other", "title": "CLI / npm", "items": ["This GitHub Release still ships the CLI archive under the same Desktop tag: `peer-darwin-arm64.tar.gz`.", "Install: `npm i -g @peer-agent/cli@beta`.", "After install, `peer --version` should print `peer 0.0.1-beta.42`.", "Sessions and settings still live under `~/.peer-agent` and are shared with Desktop."]}]}, {"version": "v0.0.1-beta.41", "label": "0.0.1-beta.41", "n": 41, "zh": [{"key": "added", "title": "新功能", "items": ["**CLI 技能与 MCP 管理**：新增 `peer skill` / `peer mcp` 管理命令，支持连接技能与 MCP 能力，并提供中英文界面。", "**TUI Goal 状态面板**：TUI 新增 Goal 状态面板，可查看目标执行进度。", "**TUI 交互问答**：`request_user_input` 已接入 TUI，Agent 提问可以直接在终端里回答。", "**TUI 品牌动画**：B3Wordmark 启动动画（逐行显现 + 信号呼吸）。"]}, {"key": "improved", "title": "优化", "items": ["**侧栏更干净**：移除工作区头部的橙色「其它工作区运行中」提示点——它太容易被误读为当前工作区状态；下拉列表内的绿色运行点保留，作为运行状态的单一来源。", "**压缩交接展示对齐**：TUI 的 compact handoff 呈现与 Desktop 对齐。"]}, {"key": "fixed", "title": "修复", "items": ["**Qoder 上下文窗口口径统一**：provider 配置窗口改为按 contextTier 档位投影后的可用输入窗口（如 1M 档 − 输出预留 = 980k），与实际发送链路同口径。修复切换模型后上下文圆环分母回退到过期值（328.8k/180k 显示 100%）以及压缩预检按错误窗口误判的问题。", "**TUI 跟随 macOS 浅色外观**：浅色模式下不再误用深色配色；输入区文字在浅色表面保持可读。", "**Goal Runner 交接串行化**：Desktop Goal Runner 交接不再并发错乱。", "**通知路由**：通知正确路由到会话所属工作区。", "**「加载更多」残留**：会话列表不再显示过期的加载更多按钮。", "**交互工具调用类型**：runtime-node 正确解析 interaction tool call 类型。", "**Provider 连接恢复**：连接异常后的恢复流程更稳。", "**工作台预览**：隐藏非活跃 workbench 预览，减少资源占用。", "**更新图标**：有可用更新时正确显示图标。", "**压缩摘要保留**：最近决策中的压缩摘要不再丢失。"]}, {"key": "other", "title": "CLI / npm", "items": ["本版 GitHub Release 继续附带 CLI 归档（与 Desktop 同 tag）：`peer-darwin-arm64.tar.gz`。", "可安装：`npm i -g @peer-agent/cli@beta`。", "安装后执行 `peer --version` 应输出 `peer 0.0.1-beta.41`。", "会话与设置仍落在 `~/.peer-agent`，与 Desktop 共享。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**CLI skill & MCP management**: New `peer skill` / `peer mcp` commands to connect skills and MCP capabilities, with Chinese/English UI.", "**TUI Goal status panel**: View goal execution progress in the TUI.", "**TUI interactive Q&A**: `request_user_input` is wired into the TUI so you can answer Agent questions in the terminal.", "**TUI brand animation**: B3Wordmark launch animation (line-by-line reveal + signal breath)."]}, {"key": "improved", "title": "Improvements", "items": ["**Cleaner sidebar**: Removed the orange “other workspaces running” header dot—too easy to misread as current-workspace status; green running dots inside the dropdown remain as the single source of truth.", "**Compact handoff display**: TUI compact handoff presentation aligns with Desktop."]}, {"key": "fixed", "title": "Fixes", "items": ["**Unified Qoder context-window accounting**: Provider config window uses the usable input window projected from contextTier (e.g. 1M tier − output reserve = 980k), same as the send path. Fixes the context ring denominator falling back to a stale value after model switch (328.8k/180k showing 100%) and compact preflight using the wrong window.", "**TUI follows macOS light appearance**: Light mode no longer wrongly uses dark colors; input text stays readable on light surfaces.", "**Goal Runner handoff serialization**: Desktop Goal Runner handoff no longer races concurrently.", "**Notification routing**: Notifications route to the workspace that owns the session.", "**Stale “load more”**: Session list no longer shows an outdated load-more button.", "**Interaction tool-call types**: runtime-node correctly parses interaction tool-call types.", "**Provider reconnect**: Recovery after connection errors is more solid.", "**Workbench preview**: Hide inactive workbench previews to save resources.", "**Update icon**: Shows correctly when an update is available."]}]}, {"version": "v0.0.1-beta.40", "label": "0.0.1-beta.40", "n": 40, "zh": [{"key": "improved", "title": "优化", "items": ["**上下文占用圆环**：主圆环改为显示实际发送给模型的上下文量，更符合「上下文占用」心智；自动压缩仍在后台按独立压力水位判定。", "**用量提示更干净**：圆环 hover 只保留「上下文」与缓存/额度信息，不再混入压缩压力文案。", "**过程块折叠偏好**：手动收起过程时间线后，流式更新中不会被自动展开重新打开。", "**侧栏状态更清晰**：区分进行中 / 已完成等状态；排队消息与 Goal 条目背景微调。"]}, {"key": "fixed", "title": "修复", "items": ["**OpenAI Responses 流挂起**：收到 `response.completed` / failed / `[DONE]` 后及时结束流，并增加空闲超时，避免 Grok 等模型把 `isStreaming` 卡死。", "**Goal Runner 不启动 / 递归启动**：intake 建 plan 后自动 kick runner；只在 goal-accepted 边沿启动，防止递归 auto-start；计划升级与 intake 流交接更稳。", "**切换会话丢队列**：跨会话切换时保留排队消息与草稿。", "**Workspace 黄点不灭**：无进行中任务时侧栏工作区黄点正确熄灭；路径末尾斜杠差异不再误判。", "**通知点击跳转**：系统通知点击可定位到对应源消息。", "**Responses 历史工具名**：回放时规范化带点号/空格的旧 function name，避免请求被拒。", "**TUI 恢复会话隔离**：按当前工作区过滤可恢复会话，并兼容旧 store。", "**模型选择器滚动跳动**：悬停上方模型不再强制滚回当前选中项。", "**过程时间线闪烁**：流式过程中时间线条目更稳定。"]}, {"key": "other", "title": "CLI / npm", "items": ["本版 GitHub Release 继续附带 CLI 归档（与 Desktop 同 tag）：`peer-darwin-arm64.tar.gz`。", "可安装：`npm i -g @peer-agent/cli@beta`（需仓库已配置 `NPM_TOKEN`；否则仅发 GitHub Release，可从 Release 资产手动装 CLI）。", "安装后执行 `peer --version` 应输出 `peer 0.0.1-beta.40`。", "会话与设置仍落在 `~/.peer-agent`，与 Desktop 共享。"]}], "en": [{"key": "improved", "title": "Improvements", "items": ["**Context occupancy ring**: The main ring now shows the actual context sent to the model, matching the “context occupancy” mental model; auto-compact still decides in the background using a separate pressure waterline.", "**Cleaner usage tooltip**: Ring hover keeps only context plus cache/quota info—no mixed compact-pressure copy.", "**Process-block collapse preference**: After you manually collapse the process timeline, stream updates no longer force it open again.", "**Clearer sidebar states**: Distinguish in-progress vs completed; queued messages and Goal rows get subtle background polish."]}, {"key": "fixed", "title": "Fixes", "items": ["**OpenAI Responses stream hang**: End the stream promptly on `response.completed` / failed / `[DONE]`, plus an idle timeout so models like Grok no longer stick `isStreaming`.", "**Goal Runner not starting / recursive start**: After intake creates a plan, kick the runner automatically; start only on the goal-accepted edge to prevent recursive auto-start; stabler plan upgrade and intake stream handoff.", "**Queue lost when switching sessions**: Keep queued messages and drafts across session switches.", "**Workspace yellow dot stuck on**: When no tasks are running, the sidebar workspace yellow dot turns off correctly; trailing slash path differences no longer mis-detect.", "**Notification click jump**: System notification clicks navigate to the source message.", "**Responses history tool names**: Normalize old function names with dots/spaces on replay so requests are not rejected.", "**TUI resume isolation**: Filter resumable sessions by current workspace and stay compatible with the old store.", "**Model picker scroll jump**: Hovering a model above no longer forces scroll back to the current selection.", "**Process timeline flicker**: Timeline items stay more stable during streaming."]}, {"key": "other", "title": "CLI / npm", "items": ["This GitHub Release still ships the CLI archive under the same Desktop tag: `peer-darwin-arm64.tar.gz`.", "Install: `npm i -g @peer-agent/cli@beta` (needs `NPM_TOKEN` in the repo; otherwise only the GitHub Release is published and you can install the CLI from Release assets manually).", "After install, `peer --version` should print `peer 0.0.1-beta.40`.", "Sessions and settings still live under `~/.peer-agent` and are shared with Desktop."]}]}, {"version": "v0.0.1-beta.39", "label": "0.0.1-beta.39", "n": 39, "zh": [{"key": "added", "title": "新功能", "items": ["**`@peer-agent/cli` npm 安装器**：可通过 npm 安装 CLI 包装包；postinstall 从同版本 GitHub Release 拉取平台 `peer` 二进制与 credential helper。", "**Goal 与 Desktop 共享**：TUI Goal 直接使用 Desktop 的 goal-plan-store；Goal 模式强化 intake，打包 CLI 可嵌入 goal store。", "**Frost 主题**：TUI 新增 Frost light/dark，wordmark 随主题变化。", "**上下文压力与自动压缩**：TUI 与 Desktop 对齐上下文压力展示；发送时按预算自动 compact，并增强压缩可恢复性。", "**任务完成提醒**：系统通知 + 侧栏未读绿点，任务结束后更易察觉。", "**Composer 运行态**：页脚运行中 spinner、思考状态停靠在输入区上方，与 mode 控件分层更清晰。", "**中文与交互打磨**：中文文案、图片 chips、圆角菜单、队列/侧栏/用量/重试倒计时等体验优化。"]}, {"key": "improved", "title": "优化", "items": ["思考与工具段按事件序交错展示；流结束后自动收起 process 面板。", "工具调用持久化与 Desktop 对齐，流失败可恢复；工具 running 状态更稳定。", "模型推理 effort 与 Desktop 对齐；无可用档位时隐藏 effort 控件。", "上下文环与 compaction 预算一致；mode 分割线全宽、空闲时隐藏。", "更新弹窗改为 changelog 卡片；去掉多余「更新就绪」toast。", "CLI 内容增加外边距，避免贴边；Workbench 顶栏间隙收紧。"]}, {"key": "fixed", "title": "修复", "items": ["打包 CLI 静态导入 goal-plan-store，避免运行时路径查找失败。", "思考状态改用 leading spinner；思考渲染进消息时间线，粘贴草稿不丢。", "图片路径粘连提取与 Desktop 附件持久化；发送后历史里正确显示图片 chips。", "回复结束后保持所选模型；恢复会话选择后关闭 resume picker。", "非法 tool-call JSON 参数可恢复；slash 建议忽略绝对路径。", "不再硬拦截 workspace 外路径；用户态与思考态展示更顺。"]}, {"key": "other", "title": "CLI / npm", "items": ["GitHub Release 继续附带 `peer-darwin-arm64.tar.gz`（与 Desktop 同 tag）。", "本版起可安装：`npm i -g @peer-agent/cli@beta`（需仓库已配置 `NPM_TOKEN`；否则仅发 GitHub Release，可从 Release 资产手动装 CLI）。", "安装后执行 `peer --version` 应输出 `peer 0.0.1-beta.39`。", "会话与设置仍落在 `~/.peer-agent`，与 Desktop 共享。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**`@peer-agent/cli` npm installer**: Install a CLI wrapper via npm; postinstall pulls the platform `peer` binary and credential helper from the same-version GitHub Release.", "**Goal shared with Desktop**: TUI Goal uses Desktop’s goal-plan-store directly; Goal mode strengthens intake; packaged CLI can embed the goal store.", "**Frost theme**: TUI adds Frost light/dark; wordmark follows the theme.", "**Context pressure & auto-compact**: TUI aligns context-pressure display with Desktop; auto-compact on send by budget, with stronger recoverability.", "**Task completion reminders**: System notifications plus unread green dots in the sidebar after tasks finish.", "**Composer running state**: Footer running spinner and thinking state dock above the input, layered more clearly with mode controls.", "**Chinese & interaction polish**: Chinese copy, image chips, rounded menus, queue/sidebar/usage/retry countdown UX."]}, {"key": "improved", "title": "Improvements", "items": ["Thinking and tool segments interleave by event order; process panel auto-collapses after stream end.", "Tool-call persistence aligns with Desktop; recoverable after stream failure; running tool state is stabler.", "Model reasoning effort aligns with Desktop; hide the effort control when no levels are available.", "Context ring matches compaction budget; mode divider is full width and hidden when idle.", "Update modal becomes a changelog card; remove the extra “update ready” toast.", "CLI content gains outer margin so it is not flush to edges; Workbench top-bar gap tightens."]}, {"key": "fixed", "title": "Fixes", "items": ["Packaged CLI statically imports goal-plan-store so runtime path lookup does not fail.", "Thinking state uses a leading spinner; thinking renders into the message timeline; paste drafts are kept.", "Sticky image-path extraction and Desktop attachment persistence; image chips show correctly in history after send.", "Keep the selected model after a reply ends; close the resume picker after restoring a session selection.", "Recoverable illegal tool-call JSON args; slash suggestions ignore absolute paths.", "No longer hard-block paths outside the workspace; user-state and thinking-state display feel smoother."]}, {"key": "other", "title": "CLI / npm", "items": ["GitHub Release still ships `peer-darwin-arm64.tar.gz` (same tag as Desktop).", "From this release you can install: `npm i -g @peer-agent/cli@beta` (requires `NPM_TOKEN` in the repo; otherwise only the GitHub Release is published and you can install CLI from Release assets manually).", "After install, `peer --version` should print `peer 0.0.1-beta.39`.", "Sessions and settings still live under `~/.peer-agent` and are shared with Desktop."]}]}, {"version": "v0.0.1-beta.38", "label": "0.0.1-beta.38", "n": 38, "zh": [{"key": "added", "title": "新功能", "items": ["**CLI 一等发布**：GitHub Release 与 Desktop 同 tag 附带 `peer-darwin-arm64.tar.gz`，可只装命令行、不装客户端。", "**`peer --version`**：CLI 支持 `--version` / `-v`，编译产物会内嵌发布版本号。", "**会话 @ 提及与图片附件（TUI）**：终端侧支持会话提及与图片附加，交互更接近客户端。", "**Qoder 模型目录**：优先走官方 SDK 拉模型目录，并修复私有 API / CLI wasm 场景下的目录加载。"]}, {"key": "improved", "title": "优化", "items": ["TUI 模式标签、工具层级、状态栏与帮助文案更清晰；mode 展示与 Desktop「Agent」语义对齐。", "TUI 压缩/恢复流程与侧栏「Load more」更稳。", "外观设置重做为 theme workshop；布局 class 与调色板动效恢复。", "应用图标统一主题化；Goal / Plan 面板与 Plan 页签可用性打磨。", "新建任务 ⌘N 在输入框聚焦时也可触发。"]}, {"key": "fixed", "title": "修复", "items": ["切换会话时不再丢失 composer 排队消息。", "侧栏会话 hover/active 边框样式清理。", "microcompact 空闲时避免上下文占用中途回落。", "TUI Qoder 私有路径、模型标签与 origin 工作区展示修正。"]}, {"key": "other", "title": "CLI（仅命令行）", "items": ["本版 GitHub Release 附带 CLI 归档（与 Desktop 同 tag / 同版本）：`peer-darwin-arm64.tar.gz`。", "归档内含 `peer` 与 `peer-credential-helper`，**必须放在同一目录**；不要只拷贝 `peer`。", "安装：解压后将该目录加入 `PATH`，执行 `peer --version` 应输出 `peer 0.0.1-beta.38`，再运行 `peer`。", "可不装 Desktop；会话与设置仍落在 `~/.peer-agent`，与客户端共享。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**CLI first-class release**: GitHub Release ships `peer-darwin-arm64.tar.gz` under the same tag as Desktop so you can install CLI only.", "**`peer --version`**: CLI supports `--version` / `-v`; build embeds the release version.", "**Session @ mentions & image attachments (TUI)**: Terminal supports session mentions and image attach, closer to Desktop.", "**Qoder model catalog**: Prefer the official SDK for catalogs; fixed private API / CLI wasm catalog loading."]}, {"key": "improved", "title": "Improvements", "items": ["Theme workshop layout classes and palette motion restored.", "App icons themed consistently; Goal / Plan panel and Plan tab usability polish.", "New Task ⌘N works even when the composer is focused."]}, {"key": "fixed", "title": "Fixes", "items": ["Switching sessions no longer drops composer queued messages.", "Cleaned sidebar session hover/active border styles.", "Microcompact idle no longer drops context occupancy mid-way.", "TUI Qoder private path, model labels, and origin workspace display fixes."]}, {"key": "other", "title": "CLI (command-line only)", "items": ["This GitHub Release ships the CLI archive under the same Desktop tag/version: `peer-darwin-arm64.tar.gz`.", "Contains `peer` and `peer-credential-helper`; **must stay in the same directory**—do not copy only `peer`.", "Install: unpack, add the directory to `PATH`, run `peer --version` (expect `peer 0.0.1-beta.38`), then `peer`.", "Desktop is optional; sessions and settings still live under `~/.peer-agent` and are shared with the app."]}]}, {"version": "v0.0.1-beta.37", "label": "0.0.1-beta.37", "n": 37, "zh": [{"key": "added", "title": "新功能", "items": ["**用量统计面板**：新增每日用量热力与区间统计，可回填缺失模型单价，并在每次发送后持久化真实 provider 用量。", "**订阅配额展示**：模型设置可查看订阅配额；用量旁支持配额 tooltip，并优先展示上次配额后再静默刷新。", "**Search Chats**：跨工作区搜索与切换任务会话，输入时本地过滤更跟手。", "**新建任务快捷键**：支持可配置的 New Task 快捷键（默认 ⌘N）。", "**队列消息可编辑排序**：排队中的消息可编辑内容并调整顺序。", "**附件拖拽排序**：聊天附件支持拖拽重排。", "**Git 分支前缀默认 PeerAgent/**：新建任务分支时默认带 `PeerAgent/` 前缀。", "**Gemini Code Assist 项目/Base URL**：完善项目与 base URL 解析，订阅鉴权编辑时更稳定。"]}, {"key": "improved", "title": "优化", "items": ["冷启动更快，品牌入场更短；侧栏 logo 预加载。", "上下文占用改为环形百分比，发送/流式过程中占用展示更稳定。", "工作台顶栏高度收敛到 40px；侧栏与 Goal 列表统一为轻浮层表面。", "Quick Chat 随内容高度自适应窗口，唤醒更快；菜单对齐触发器，可见时才刷新并节流流式事件。", "思考强度弹层按视口钳制，靠近边缘不再被裁切。", "活跃会话操作区宽度收紧；硬删除仅保留在「已归档」列表（侧栏与设置页），活跃列表只保留归档。", "多提供方压缩边界一致；流结束若尾随工具调用，最终正文仍可见。", "模式命名改为 Agent，去掉危险色强调。"]}, {"key": "fixed", "title": "修复", "items": ["修复 Google / OpenAI OAuth 经代理的 token 请求，以及设置页过期会话静默刷新。", "修复 Gemini OAuth 展示与 curated 模型目录；编辑时保留订阅鉴权。", "修复 Goal 计划在短暂流失败后状态恢复，以及 runner 流式消息持久化。", "修复侧栏仅在首条消息后创建会话、决策上下文在交互卡等待时仍可见。", "修复 Quick Chat 内容高度 IPC、紧凑菜单对齐，以及 TUI 共用 Desktop v2 模型目录。", "修复 Search Chats 输入过滤仅本地生效，避免误触发远端。"]}, {"key": "other", "title": "CLI（仅命令行）", "items": ["本版起 GitHub Release 与 Desktop **同 tag** 附带 CLI 归档：`peer-darwin-arm64.tar.gz`。", "归档内含 `peer` 与 `peer-credential-helper`，**必须放在同一目录**；不要只拷贝 `peer`。", "解压后执行 `peer --version` 应输出 `peer 0.0.1-beta.37`；可不装客户端，数据目录仍为 `~/.peer-agent`。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**Usage stats panel**: Daily heatmaps and range stats, backfill missing model unit prices, and persist real provider usage after each send.", "**Subscription quota display**: View subscription quota in model settings; quota tooltips beside usage, showing last quota first then silent refresh.", "**Search Chats**: Search and switch task sessions across workspaces with snappy local filtering while typing.", "**New Task shortcut**: Configurable New Task hotkey (default ⌘N).", "**Editable queued messages**: Edit and reorder messages while they are queued.", "**Drag-reorder attachments**: Chat attachments can be reordered by drag.", "**Default Git branch prefix PeerAgent/**: New task branches default to a `PeerAgent/` prefix.", "**Gemini Code Assist project/Base URL**: More solid project and base URL resolve when editing subscription auth."]}, {"key": "improved", "title": "Improvements", "items": ["Faster cold start and shorter brand entry; sidebar logo preloads.", "Context occupancy uses a ring percentage; more stable during send/stream.", "Workbench top bar converges to 40px; sidebar and Goal lists use light floating surfaces.", "Quick Chat window height follows content and wakes faster; menus align to triggers, refresh only when visible, and throttle stream events.", "Thinking-strength popover clamps to the viewport so edges no longer clip it.", "Active session action area is tighter; hard delete only appears under Archived (sidebar and Settings); active list only archives.", "Multi-provider compact boundaries stay consistent; trailing tool calls after stream end still leave final body visible.", "Mode naming becomes Agent; danger-color emphasis removed."]}, {"key": "fixed", "title": "Fixes", "items": ["Fixed Google / OpenAI OAuth token requests via proxy, and silent refresh of expired sessions on the settings page.", "Fixed Gemini OAuth display and curated model catalog; keep subscription auth when editing.", "Fixed Goal plan state restore after brief stream failures, and runner stream message persistence.", "Fixed sidebar creating a session only after the first message; decision context stays visible while waiting on interaction cards.", "Fixed Quick Chat content-height IPC, compact menu alignment, and TUI sharing Desktop v2 model catalogs.", "Search Chats input filter stays local-only so remote is not triggered by mistake."]}, {"key": "other", "title": "CLI (command-line only)", "items": ["From this release, the GitHub Release ships a CLI archive under the **same tag** as Desktop: `peer-darwin-arm64.tar.gz`.", "The archive contains `peer` and `peer-credential-helper`; **they must stay in the same directory**—do not copy only `peer`.", "After unpack, `peer --version` should print `peer 0.0.1-beta.37`; Desktop is optional; data still lives under `~/.peer-agent`."]}]}, {"version": "v0.0.1-beta.36", "label": "0.0.1-beta.36", "n": 36, "zh": [{"key": "added", "title": "新功能", "items": ["**纯字标启动页**：启动过渡改为主题自适应字标与黄支撑线，去掉流式泼墨/水墨 canvas，暗色浅字、浅色深墨，入场更干净。", "**macOS 毛玻璃 Chrome**：主窗口启用 vibrancy，侧栏与 Workbench 外壳使用半透明玻璃材质；正文主面保持实色对比度，并支持减少透明度偏好回退。", "**模型选项与渠道元数据**：支持提供方模型选项，刷新已保存模型元数据，并改善 Grok 渠道与目录信息展示。", "**Quick Chat 任务工作区标识**：快捷对话可识别并区分任务工作区，便于多任务并行。"]}, {"key": "improved", "title": "优化", "items": ["聊天热更新隔离、滚动与输入卡顿降低，跨设置页时保持聊天挂载。", "自动上下文压缩触发与用量展示对齐，预检路径更稳定。", "设置导航分组整理，聊天顶栏高度收敛到 36px。", "Goal 面板减少跨会话无效刷新；Explorer / Verifier 侧流改为 ephemeral，内部 JSON 不再写入聊天消息。"]}, {"key": "fixed", "title": "修复", "items": ["修复提供方 reasoning 默认值与 effort map 未正确尊重的问题。", "修复 Grok OAuth 连通性与渠道列表展示异常。", "修复 Qoder 能力元数据被覆盖丢失的问题。", "移除 token 用量旁「计费待接入」类占位文案。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**Wordmark-only splash**: Launch transition uses a theme-aware wordmark and yellow support line; removes stream ink/canvas effects. Dark mode uses light glyphs, light mode uses deep ink for a cleaner entry.", "**macOS frosted Chrome**: Main window vibrancy with translucent glass on the sidebar and Workbench shell; the main content surface stays solid for contrast, with reduced-transparency fallback.", "**Model options & channel metadata**: Provider model options, refresh of saved model metadata, and better Grok channel/catalog display.", "**Quick Chat task workspace labels**: Quick Chat can identify and distinguish task workspaces for parallel work."]}, {"key": "improved", "title": "Improvements", "items": ["Chat HMR isolation, less scroll/input jank; chat stays mounted across settings pages.", "Auto-compact triggers align with usage display; preflight path is more stable.", "Settings nav regrouped; chat top bar height converges to 36px.", "Goal panel avoids useless cross-session refresh; Explorer / Verifier side streams are ephemeral so internal JSON is not written into chat messages."]}, {"key": "fixed", "title": "Fixes", "items": ["Respect provider reasoning defaults and effort maps correctly.", "Fixed Grok OAuth connectivity and channel list display issues.", "Fixed Qoder capability metadata being overwritten/lost.", "Removed “billing not wired” style placeholder copy next to token usage."]}]}, {"version": "v0.0.1-beta.35", "label": "0.0.1-beta.35", "n": 35, "zh": [{"key": "added", "title": "新功能", "items": ["**桌面工作台升级**：浏览器和文档改为与会话绑定的横向标签页，可在同一会话中持续查看网页与文件，并在切换会话时保持内容归属清晰。", "**Quick Chat 浮窗体验**：新增更紧凑的选择浮层与独立快捷对话窗口，改善窗口定位、尺寸和跨窗口会话同步。", "**Goal Runner 持续执行**：补齐目标接收、自动推进、失败历史折叠和主窗口流路由，让已接受的目标能更稳定地交给 Runner 连续完成。", "**TUI 完整交互链路**：新增计划审批、权限确认、模式限定工具、会话保存与恢复，并优化欢迎页、输入区、命令选择器、Markdown 与 diff 展示。", "**模型与凭证支持扩展**：新增 Grok 官方订阅通道，改善模型发现和元数据展示，并统一 Desktop 与 TUI 的凭证存储与解析。", "**跨平台发布能力增强**：补充 macOS 签名、图标与更新发布流程，并完善共享 Rust 核心和 CLI 集成。"]}, {"key": "improved", "title": "优化", "items": ["长会话渲染、自动上下文压缩和运行时预检更加高效，压缩状态会严格归属当前会话。", "模型目录加载、渠道列表、启动过渡、侧栏分隔和版本入口等桌面细节得到统一优化。", "Quick Chat、TUI 输入器和动画效果进一步收敛视觉层级，波纹动画改为合成器友好的实现。", "归档会话入口移入设置，工作台标签和状态栏布局更紧凑、易于理解。"]}, {"key": "fixed", "title": "修复", "items": ["修复桌面安装包遗漏 `conversation-store` 运行时入口、导致应用启动时报 `ERR_MODULE_NOT_FOUND` 的问题，并新增打包产物入口完整性检查。", "修复切换页面、模式或窗口时，过期的空消息快照可能覆盖并清空完整聊天历史的问题；消息文件写入改为更安全的原子替换。", "修复非当前会话的 Browser 工具误展开网页面板，以及隐藏的 Browser WebView 仍可能显示的问题。", "修复 Quick Chat 刷新、窗口切换和跨窗口状态同步不及时的问题。", "修复 Goal 流被错误路由、计划恢复后无法继续，以及失败计划历史干扰当前执行的问题。", "修复上下文压缩未真正生效、压缩状态串到其他会话和恢复会话状态不完整的问题。", "修复模型提供方配置互相污染、认证字段冗余和凭证解析不一致的问题。", "修复 TUI 命令选择器遮挡、临时提示残留及恢复会话时状态不同步的问题。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**Desktop workbench upgrade**: Browser and documents become session-bound horizontal tabs so pages and files stay with the session when you switch chats.", "**Quick Chat floating UX**: More compact pickers and a dedicated quick-chat window with better placement, size, and cross-window session sync.", "**Goal Runner continuous execution**: Completes goal accept, auto-advance, failed-history collapse, and main-window stream routing so accepted goals finish more reliably under the Runner.", "**Full TUI interaction path**: Plan approval, permission confirm, mode-scoped tools, session save/restore, plus welcome, input, command picker, Markdown, and diff polish.", "**Broader model & credential support**: Official Grok subscription channel, better model discovery/metadata, and unified credential storage/resolve for Desktop and TUI.", "**Stronger cross-platform release**: macOS signing/icons/update pipeline plus shared Rust core and CLI integration."]}, {"key": "improved", "title": "Improvements", "items": ["More efficient long-session render, auto-compact, and runtime preflight; compact state is strictly session-owned.", "Unified desktop details for model catalog loading, channel lists, launch transition, sidebar splitters, and version entry.", "Quick Chat, TUI input, and animation hierarchy tightened; ripple animation is compositor-friendly.", "Archived-session entry moves into Settings; workbench tabs and status bar are denser and clearer."]}, {"key": "fixed", "title": "Fixes", "items": ["Fixed packaged app missing `conversation-store` runtime entry (`ERR_MODULE_NOT_FOUND`) and added packaged entry integrity checks.", "Fixed stale empty message snapshots overwriting full chat history when switching page/mode/window; message file writes use safer atomic replace.", "Fixed Browser tools from non-current sessions expanding the web panel, and hidden Browser WebViews still showing.", "Fixed Quick Chat refresh, window switch, and cross-window sync lag.", "Fixed Goal streams mis-routed, plans unable to continue after restore, and failed plan history interfering with current runs.", "Fixed compaction not actually applying, compact state leaking across sessions, and incomplete session restore.", "Fixed provider config cross-contamination, redundant auth fields, and inconsistent credential resolve.", "Fixed TUI command picker occlusion, sticky temporary tips, and desynced restore state."]}]}, {"version": "v0.0.1-beta.34", "label": "0.0.1-beta.34", "n": 34, "zh": [{"key": "added", "title": "新功能", "items": ["**Quick Chat 快捷入口**：新增全局快捷键和独立的 Quick Chat 窗口，可在不离开当前工作的情况下快速发起对话，并持续查看关联任务。", "**目标计划待审批条**：当计划等待你开始、调整或取消时，聊天底部会展示紧凑审批条，直接提供三个操作；完整计划详情仍保留在右侧。", "**思考强度调节**：聊天输入区新增思考强度控制，可按任务需要调整模型的推理投入。", "**会话与浏览内容关联**：浏览器中的内容可以与对应会话绑定，方便在同一上下文中继续工作。", "**终端模型提供方支持**：TUI 现可接入共享的 OpenAI 兼容模型提供方配置。"]}, {"key": "improved", "title": "优化", "items": ["优化目标计划的关系、状态和下一步操作展示，让执行进度与待办决策更清晰。", "更新桌面端品牌字标与相关视觉细节。", "改善切换模型后的能力状态同步，以及长会话自动压缩后的上下文延续。"]}, {"key": "fixed", "title": "修复", "items": ["修复 Quick Chat 在切换空间或刷新过程中可能消失、卡住的问题。", "修复流式请求短暂失败后，Goal Runner 可能无法继续推进后续任务的问题。", "修复部分计划状态恢复后未能正确显示待用户决策入口的问题。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**Quick Chat entry**: Global shortcut and a dedicated Quick Chat window for starting chats without leaving current work, with ongoing linked tasks.", "**Pending plan approval strip**: When a plan waits for start / adjust / cancel, a compact approval bar appears at the chat bottom with three actions; full plan detail stays on the right.", "**Thinking strength control**: Composer adds a thinking-strength control to tune model reasoning effort per task.", "**Session linked to browsing content**: Browser content can bind to its session so work continues in the same context.", "**Terminal model providers**: TUI can use shared OpenAI-compatible provider configs."]}, {"key": "improved", "title": "Improvements", "items": ["Clearer goal plan relations, status, and next actions.", "Updated desktop wordmark and related visual details.", "Better capability-state sync after model switches, and better continuity after long-session auto-compact."]}, {"key": "fixed", "title": "Fixes", "items": ["Fixed Quick Chat disappearing or sticking across space switches / refreshes.", "Fixed Goal Runner failing to continue after brief stream failures.", "Fixed some restored plan states not showing the pending-decision entry correctly."]}]}, {"version": "v0.0.1-beta.33", "label": "0.0.1-beta.33", "n": 33, "zh": [{"key": "improved", "title": "优化", "items": ["**计划卡片改为无边框悬浮设计**：移除执行中计划与历史计划的明显实体描边，使用表面层级、柔和阴影和留白建立更轻盈的卡片层次。", "**计划卡片交互反馈更自然**：补充默认、悬停和按下状态的语义化阴影，并适配暗色主题、键盘焦点和减少动效偏好。", "**执行中计划默认展开**：重新进入会话或恢复任务后，当前活动计划直接展示目标、任务进度与执行轨迹，减少重复展开操作。", "**全屏提问浮层布局优化**：调整问题确认界面的对齐与视觉层级，使操作焦点更明确。"]}, {"key": "fixed", "title": "修复", "items": ["修复模型流式请求暂时失败后，Goal Runner 可能停止推进、无法继续执行剩余任务的问题。", "修复活动计划在部分状态恢复场景中没有自动展开的问题。"]}], "en": [{"key": "improved", "title": "Improvements", "items": ["**Borderless floating plan cards**: Removed heavy outlines on active and historical plans; surface layers, soft shadows, and spacing create a lighter hierarchy.", "**More natural plan-card feedback**: Semantic shadows for default / hover / pressed, with dark theme, keyboard focus, and reduced-motion support.", "**Active plans expand by default**: Re-entering a session or resuming work shows goal, task progress, and run trace immediately.", "**Fullscreen question overlay layout**: Clearer alignment and visual hierarchy for confirmations."]}, {"key": "fixed", "title": "Fixes", "items": ["Fixed Goal Runner stopping after a temporary model stream failure and failing to continue remaining tasks.", "Fixed active plans not auto-expanding after some state restore paths."]}]}, {"version": "v0.0.1-beta.32", "label": "0.0.1-beta.32", "n": 32, "zh": [{"key": "added", "title": "新功能", "items": ["**本地运行时能力进一步模块化**：新增可复用的 Runtime SDK、Node 宿主适配器与受治理的运行管线，为后续接入更多本地能力和宿主形态打下基础。", "**计划创建后提供下一步操作**：Goal 模式生成计划后会展示可继续执行的操作入口，减少计划与执行之间的中断。", "**上下文压缩过程可追踪**：消息轨道新增压缩节点，便于识别自动压缩发生的位置和执行状态。"]}, {"key": "improved", "title": "优化", "items": ["**自动压缩生命周期更稳定**：统一压缩进度、完成事件和上下文统计更新链路，压缩完成后能够及时刷新界面状态。", "**当前问题导航更可靠**：优化长对话滚动时当前问题条的状态处理，减少切换和流式输出期间的显示抖动。"]}, {"key": "fixed", "title": "修复", "items": ["修复自动压缩提醒可能在处理中途提前消失的问题。", "修复自动压缩完成后底部上下文数字未同步更新的问题。", "修复当前问题条在部分滚动与流式更新场景下状态不稳定的问题。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**More modular local runtime**: Reusable Runtime SDK, Node host adapter, and governed run pipeline for more local capabilities and host shapes later.", "**Next actions after plan creation**: Goal mode shows continue-run entry points after generating a plan so plan→execute is less interrupted.", "**Trackable context compaction**: Message rail adds compact nodes so you can see where auto-compact happened and its status."]}, {"key": "improved", "title": "Improvements", "items": ["**More stable auto-compact lifecycle**: Unified progress, completion events, and context stats so the UI refreshes promptly after compact.", "**More reliable current-question nav**: Better state handling while scrolling long chats and during streaming."]}, {"key": "fixed", "title": "Fixes", "items": ["Fixed auto-compact notices disappearing too early mid-process.", "Fixed bottom context numbers not updating after auto-compact finished.", "Fixed current-question bar instability in some scroll/stream update cases."]}]}, {"version": "v0.0.1-beta.31", "label": "0.0.1-beta.31", "n": 31, "zh": [{"key": "other", "title": "新增", "items": ["**GPT-5.6 模型档位**：订阅模型目录新增 Sol、Terra、Luna 三档，便于按任务复杂度选择合适的推理能力。"]}, {"key": "improved", "title": "优化", "items": ["**当前问题导航更清晰**：滚动长对话时展示当前回合问题，并与正文内容区保持统一对齐，方便确认上下文。", "**界面毛玻璃效果统一**：当前问题条与「我的消息」导航面板采用一致的半透明模糊效果，提升层级辨识度。", "**流式回答结构更稳定**：优化思考内容与最终正文的分组处理，减少生成过程中内容归类不一致的问题。"]}, {"key": "fixed", "title": "修复", "items": ["修复当前问题条左右边界不对称的问题。", "修复连续流式片段中思考区与最终回答可能错误连接的问题。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**GPT-5.6 model tiers**: Subscription catalog adds Sol, Terra, and Luna tiers so you can match reasoning strength to task complexity."]}, {"key": "improved", "title": "Improvements", "items": ["**Clearer current-question navigation**: Long chats show the current turn’s question aligned with the content column.", "**Unified frosted-glass treatment**: Current-question bar and “My messages” nav share the same translucent blur.", "**More stable stream structure**: Better grouping of thinking vs final body to reduce mis-classification mid-generation."]}, {"key": "fixed", "title": "Fixes", "items": ["Fixed asymmetric left/right padding on the current-question bar.", "Fixed thinking and final answer incorrectly joining across consecutive stream fragments."]}]}, {"version": "v0.0.1-beta.30", "label": "0.0.1-beta.30", "n": 30, "zh": [{"key": "improved", "title": "优化", "items": ["**思考区默认折叠、更清爽**：AI 思考过程默认收起，只显示一行「正在思考」并带光扫动效；需要查看细节时手动展开即可。"]}, {"key": "fixed", "title": "修复", "items": ["修复思考面板在生成过程中反复展开/收起的抖动问题（活跃态改为整段流式期间稳定判定）。", "修复需要你选择/回复时，选项面板被折叠区遮住看不见的问题（交互卡现始终显示在折叠区之外）。", "修复打包后应用启动崩溃的问题：runtime-core 现随包编译产出正式产物，不再把 TypeScript 源码打进安装包导致主进程加载失败。"]}], "en": [{"key": "improved", "title": "Improvements", "items": ["**Thinking area defaults to collapsed**: AI thinking stays collapsed to a single “Thinking…” row with a shimmer; expand only when you need detail."]}, {"key": "fixed", "title": "Fixes", "items": ["Fixed thinking panel flapping open/closed during generation (active state stays stable for the whole stream).", "Fixed option panels being hidden under collapsed regions when a reply/choice is required—interaction cards now stay outside the collapse.", "Fixed packaged app launch crash: runtime-core now ships compiled artifacts instead of TypeScript sources that broke main-process loading."]}]}, {"version": "v0.0.1-beta.29", "label": "0.0.1-beta.29", "n": 29, "zh": [{"key": "added", "title": "新功能", "items": ["**长回复时用户消息保持置顶**：AI 长时间回复过程中，你发出的那条消息会稳定停留在可视区顶部，方便对照上下文。", "**聊天回合上下文改进**：优化多轮对话的上下文组织与处理详情的呈现。"]}, {"key": "improved", "title": "优化", "items": ["引入 runtime-core 核心包，统一能力注册、权限合并、生命周期 Hook 与证据处理逻辑，为后续稳定性打基础。", "改进 compaction（上下文压缩）状态处理。", "思考区在完成后自动折叠，界面更清爽。"]}, {"key": "fixed", "title": "修复", "items": ["修复聊天自动滚动的动画抖动问题（改为无动画即时定位）。", "修复 ChatGPT 订阅标签未本地化的问题。", "修复输入框队列在多会话间串扰的问题（现按会话隔离）。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**Keep the user message pinned during long replies**: While the AI streams a long answer, your last message stays at the top of the viewport for easier comparison.", "**Better turn context**: Improved multi-turn context organization and how processing details are presented."]}, {"key": "improved", "title": "Improvements", "items": ["Introduced the runtime-core package to unify capability registration, permission merge, lifecycle hooks, and evidence handling.", "Improved compaction state handling.", "Thinking panels auto-collapse when finished for a cleaner UI."]}, {"key": "fixed", "title": "Fixes", "items": ["Fixed chat auto-scroll jank (instant reposition without animation).", "Localized the ChatGPT subscription label.", "Isolated the composer queue per session so multi-session use no longer crosstalks."]}]}, {"version": "v0.0.1-beta.28", "label": "0.0.1-beta.28", "n": 28, "zh": [{"key": "added", "title": "新功能", "items": ["**ChatGPT 订阅模型目录展开为多条可选模型**：订阅记录不再只绑定一个当前模型，聊天菜单二级即可列出该订阅下的全部模型，并支持会话级独立切换；空目录时优雅降级。"]}, {"key": "improved", "title": "优化", "items": ["**升级体系 UI 改进**：有新版本时显示「新版本」文字 Tag（替代原红点），更直观；下载中环形进度旁显示百分比文字；下载完成后版本号旁持久挂「安装」按钮，设置页升级面板也提供一致的安装入口。"]}, {"key": "fixed", "title": "修复", "items": ["修复极致模型（Qoder Ultimate）在多轮工具调用时报错 `unexpected tool_use_id found in tool_result blocks`：发送前合并相邻的 assistant 消息，且带工具调用的 assistant 不再发送空内容，保证工具消息正确配对。", "修复更新下载完成卡片右上角 ✕ 关闭按钮与安装按钮重叠的问题。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**ChatGPT subscription catalogs expand to many models**: A subscription is no longer locked to one current model; the chat menu can list every model under that subscription with per-session switching, and degrades gracefully when the catalog is empty."]}, {"key": "improved", "title": "Improvements", "items": ["**Update UI polish**: Available updates show a “New version” text tag instead of a red dot; download ring shows percent text; after download an Install action stays next to the version, with a matching install entry in Settings."]}, {"key": "fixed", "title": "Fixes", "items": ["Fixed Qoder Ultimate multi-tool-call error `unexpected tool_use_id found in tool_result blocks` by merging adjacent assistant messages before send and not sending empty assistant content when tool calls are present.", "Fixed the finished-download card’s close (✕) button overlapping the Install button."]}]}, {"version": "v0.0.1-beta.27", "label": "0.0.1-beta.27", "n": 27, "zh": [{"key": "added", "title": "新功能", "items": ["**新增 Qoder 模型供应商**：可接入 Qoder 私有供应商，模型目录在聊天菜单里展开为「供应商 → 模型」的悬浮父子菜单，未配置密钥的模型自动置灰；设置页的模型增删改不受影响。", "**模型与思考模式随会话绑定并持久化**：每个会话各自记住所选模型与思考强度，切换会话或重启后自动恢复；首选模型失效时回退到默认，不会中断对话。"]}, {"key": "improved", "title": "优化", "items": ["处理「安装 / 配置 / 管理 MCP」类请求更准确：助手会优先识别自己就是 MCP host 并查看自身注册表，而不是先去扫描外部客户端配置。"]}, {"key": "fixed", "title": "修复", "items": ["修复连接在传输中途恢复时，「正在重试连接」横幅一直残留不消失的问题。", "修复 Goal 模式下纯问答结束后，仍残留「执行中 0/1」目标契约的问题。", "修复侧边栏删除确认的冗余「确认？」文字，并修正确认按钮垂直错位。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**Qoder model provider**: Connect Qoder private providers; the chat model menu expands as provider → model hover submenus, and models without keys are grayed out. Settings add/edit/remove is unchanged.", "**Model & thinking mode bound per session**: Each session remembers its model and thinking strength across switches and restarts; if the preferred model is invalid it falls back without breaking the chat."]}, {"key": "improved", "title": "Improvements", "items": ["MCP install/configure/manage requests are handled more accurately: the assistant recognizes it is itself an MCP host and checks its own registry first instead of scanning external client configs."]}, {"key": "fixed", "title": "Fixes", "items": ["Fixed the “retrying connection” banner sticking after a mid-transport recovery.", "Fixed pure Q&A in Goal mode leaving a leftover “running 0/1” goal contract.", "Removed redundant “Confirm?” copy on sidebar delete confirms and fixed vertical button misalignment."]}]}, {"version": "v0.0.1-beta.26", "label": "0.0.1-beta.26", "n": 26, "zh": [{"key": "added", "title": "新功能", "items": ["**Goal 模式先判别再建目标**：Goal 模式下你的第一条消息不再被直接当成目标，而是先进入判别阶段——纯问答会静默还原为普通聊天，目标含糊会主动向你追问澄清，目标明确才正式建立并开始自驱执行，避免“发什么都建目标”。", "**新增 qoder CLI 供应商**：模型供应商支持接入 qoder CLI，通过本地 CLI 鉴权，不在应用内保存远端密钥。", "**模型列表改为分组手风琴**：LLM 设置里的模型按分组折叠展示，同组共享凭证、各模型独立参数；模型抽屉与图标统一优化，交互更清爽。"]}, {"key": "fixed", "title": "修复", "items": ["修复切换会话时聊天滚动位置丢失，现在每个会话各自记住滚动位置。", "修复给某个分组「加模型」时，重复显示已从分组继承的供应商级字段（渠道/鉴权/BaseURL/APIKey 等）。", "修正 ChatGPT 订阅模式下的上下文窗口对齐。", "修复流式重连时正文重复显示的问题。", "修复流式重连时工具调用片段重复的问题。", "修复会话列表刷新期间闪现“暂无会话”空窗，并防止慢请求晚返回覆盖新视图。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**Goal entry is more deliberate**: Ambiguous goals ask you for clarification first; only clear goals create a formal plan and start self-driven execution—avoids “everything becomes a goal”.", "**Added qoder CLI provider**: Model providers can use qoder CLI with local CLI auth; remote keys are not stored in the app.", "**Model list as grouped accordion**: LLM settings group models with shared credentials and per-model params; model drawer and icons are cleaner."]}, {"key": "fixed", "title": "Fixes", "items": ["Session scroll position is remembered per session when switching chats.", "“Add model” in a group no longer re-shows provider-level fields already inherited (channel / auth / BaseURL / API key).", "Aligned context-window sizing for ChatGPT subscription mode.", "Fixed body text duplication on stream reconnect.", "Fixed tool-call fragment duplication on stream reconnect.", "Fixed a flash of “no sessions” while the list refreshes, and slow late responses no longer overwrite the newer view."]}]}, {"version": "v0.0.1-beta.25", "label": "0.0.1-beta.25", "n": 25, "zh": [{"key": "added", "title": "新功能", "items": ["**Goal 自动执行绑定工作区**：Goal 自动推进时会锁定到目标代码仓工作区执行，跨仓库场景下操作落点更准确，并新增运行轨迹追踪，Goal 面板能看到每一步的执行来源。", "**App UI 语义 Token 层**：新增 `--ui-*` 语义 token，聊天界面样式统一迁移到该 token 体系，主题一致性和后续换肤维护更省心。"]}, {"key": "improved", "title": "优化", "items": ["**添加/编辑模型改为弹窗**：设置里添加和编辑模型供应商都改用居中 Overlay 弹窗，不再挤在列表底部，多个供应商时定位更清晰。", "**任务拆解措辞更像人话**：Goal 任务拆解生成的子任务标题减少术语堆砌和编号塞信息，改为一句话讲清\"这步做什么\"，降低阅读负担。"]}, {"key": "fixed", "title": "修复", "items": ["**修复取消请求跨域鉴权 401**：聊天取消（cancel）改走同域网关，不再裸 fetch 跨域直连，修复跨域场景下的鉴权失败。", "**修复思考态动画**：去掉\"思考中\"激活态多余的三点，并修顺 shimmer 光扫效果。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**Goal auto-run binds a workspace**: Auto-advance locks onto the target code workspace so cross-repo actions land correctly, with run-trace tracking visible in the Goal panel.", "**App UI semantic token layer**: Introduced `--ui-*` semantic tokens and migrated chat styles onto them for more consistent themes and easier restyling."]}, {"key": "improved", "title": "Improvements", "items": ["**Add/edit model uses a modal**: Provider add/edit in Settings opens a centered Overlay instead of crowding the list bottom.", "**More human task titles**: Goal task breakdown uses plain one-line titles instead of jargon stacks and numbered packing."]}, {"key": "fixed", "title": "Fixes", "items": ["**Cancel no longer 401s across origins**: Chat cancel goes through the same-origin gateway instead of bare cross-origin fetch.", "**Thinking-state animation**: Removed extra ellipsis on the active thinking state and smoothed the shimmer sweep."]}]}, {"version": "v0.0.1-beta.24", "label": "0.0.1-beta.24", "n": 24, "zh": [{"key": "added", "title": "新功能", "items": ["**Goal 自动执行闭环**：批准计划后可进入完整自动推进流程，支持运行状态持久化、偏航防护、权限确认、证据记录和完成验证。", "**Workbench 文件预览**：右侧 Workbench 文件树点击文件后可直接查看内容，支持 Markdown 渲染、JSON 格式化、源码行号视图和 Diff 视图切换。", "**Goal 待批准提示**：侧边栏会显示存在待批准计划的会话，便于回到对应任务继续处理。"]}, {"key": "improved", "title": "优化", "items": ["**移除占位终端入口**：Workbench 不再显示没有真实交互能力的「终端」tab，避免误导；shell 输出仍保留在会话工具执行记录中。", "**Goal 执行护栏增强**：强化范围扩张、不可逆操作、完成判定和重复漂移检测，降低自动执行过程中偏离计划的风险。", "**Goal 语义统一**：梳理 Goal/Plan 模式的提示词、工具说明和门禁语义，让批准、执行和恢复流程更一致。"]}, {"key": "fixed", "title": "修复", "items": ["**修复中止请求未完整取消的问题**：聊天 abort 会更可靠地传递到 provider、shell、浏览器控制等本地执行链路。", "**修复自动压缩后当前轮丢失的问题**：上下文压缩会保留当前用户轮次，避免压缩后续推缺少最新指令。", "**减少重复检测误判**：降低正常长输出或相似片段被错误识别为模型重复的概率。", "**修复压缩后重复 assistant 消息**：重新连接流式输出时不会再重复显示已有 assistant 内容。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**Goal auto-run loop**: After approving a plan, enter a full auto-advance flow with run-state persistence, drift protection, permission confirms, evidence recording, and completion verification.", "**Workbench file preview**: Click files in the right workbench tree to preview content with Markdown rendering, JSON formatting, source line numbers, and Diff view switching.", "**Goal pending-approval cues**: The sidebar highlights sessions with plans waiting for approval so you can return to them."]}, {"key": "improved", "title": "Improvements", "items": ["**Removed placeholder Terminal entry**: Workbench no longer shows a Terminal tab without real interaction; shell output still lives in session tool-run records.", "**Stronger Goal guardrails**: Better scope expansion, irreversible-action, completion, and repeated-drift checks during auto-run.", "**Unified Goal semantics**: Aligned Goal/Plan prompts, tool docs, and gate meanings for approve / run / resume."]}, {"key": "fixed", "title": "Fixes", "items": ["**Abort is more complete**: Chat abort propagates more reliably to provider, shell, browser control, and other local execution paths.", "**Auto-compact no longer drops the current turn**: Compaction keeps the current user turn so the latest instruction is not lost.", "**Fewer false repetition hits**: Long normal output or similar fragments are less likely to be treated as model loops.", "**No duplicate assistant after compact**: Reconnecting a stream no longer re-renders existing assistant content."]}]}, {"version": "v0.0.1-beta.23", "label": "0.0.1-beta.23", "n": 23, "zh": [{"key": "added", "title": "新功能", "items": ["**计划批准即自动执行**：Plan 模式下点击「批准并执行」后，计划会自动连续推进直到完成，无需再手动逐步驱动；执行全程复用 Goal 模式的完整护栏（续推上下文注入、防偏航 re-anchor、完成验证门）。"]}, {"key": "improved", "title": "优化", "items": ["**Explorer 并行调查提速**：同一轮内的多个 Explorer 子调查改为并发池执行（默认并发 5、上限 8），移除累计上限限制，单个 Explorer 失败不再中断整轮；底部进度显示「本轮已完成/本轮总数」。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**Approve plan starts auto-run**: In Plan mode, “Approve & run” advances the plan continuously to completion without manual step-by-step driving; execution reuses Goal mode’s full guardrails (continuation context, anti-drift re-anchor, completion verification gate)."]}, {"key": "improved", "title": "Improvements", "items": ["**Faster parallel Explorer work**: Multiple Explorer sub-investigations in the same turn run in a concurrency pool (default 5, max 8), cumulative caps removed, one Explorer failure no longer aborts the whole turn; bottom progress shows “done this turn / total this turn”."]}]}, {"version": "v0.0.1-beta.22", "label": "0.0.1-beta.22", "n": 22, "zh": [{"key": "added", "title": "新功能", "items": ["**MCP 管理页焕新**：MCP 连接改为卡片式布局，点击卡片从右侧滑出详情抽屉，可查看连接状态、管理工具开关与凭证，与技能页体验一致。"]}, {"key": "improved", "title": "优化", "items": ["**MCP OAuth 配置大幅简化**：检测到连接需要认证时自动切换为 OAuth 2.0；回调地址改为只读展示（不再需要手填）；授权端点支持自动发现，多数情况无需手动配置。", "**统一的操作确认弹窗**：删除等危险操作的确认框改用应用内统一样式，替换系统原生弹窗。"]}, {"key": "fixed", "title": "修复", "items": ["修复移除 MCP 连接后重新添加会残留重复凭证的问题。", "新增流式输出复读检测：模型陷入异常复读时自动收口本轮，避免持续消耗。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**MCP management page refresh**: MCP connections use a card layout; open a card to slide out a right detail drawer for connection status, tool toggles, and credentials—aligned with the skills page."]}, {"key": "improved", "title": "Improvements", "items": ["**Much simpler MCP OAuth setup**: When a connection needs auth, it switches to OAuth 2.0 automatically; callback URL is read-only (no hand-fill); authorization endpoints support discovery so most cases need no manual config.", "**Unified confirm dialogs**: Dangerous actions like delete use the in-app confirm style instead of native system alerts."]}, {"key": "fixed", "title": "Fixes", "items": ["Fixed leftover duplicate credentials when removing and re-adding an MCP connection.", "Added stream repetition detection: if the model loops abnormally, the turn is closed early to avoid runaway spend."]}]}, {"version": "v0.0.1-beta.21", "label": "0.0.1-beta.21", "n": 21, "zh": [{"key": "added", "title": "新功能", "items": ["**全新全局动效体系**：统一了整个应用的动画语言，界面切换、弹窗进出、加载状态更顺滑一致。重点修复了升级流程的视觉断裂——点击「更新」后弹窗会朝左上角平滑收拢，同时左上角进度环即时点亮，清晰指引你关注下载进度。", "**自驱 Goal 模式**：新增独立的 Goal（目标）模式，可自主推进多步骤任务；Plan（计划）模式回归为纯审批门，批准后交由你掌控节奏，两种模式职责更清晰。"]}, {"key": "fixed", "title": "修复", "items": ["修复流式回复过程中侧边栏会话列表偶发被清空、需切换工作区或发新消息才恢复的问题。", "修复更新说明弹窗内「新功能／修复」条目丢失前导符号、内容糊成一片的问题，列表层级与间距更清晰。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**New global motion system**: Unified animation language across the app for smoother, more consistent transitions, modals, and loading states. Fixed the upgrade-flow visual break—after you click Update, the modal collapses toward the top-left while the progress ring lights up immediately so download progress is easy to follow.", "**Self-driven Goal mode**: Added a dedicated Goal mode that can advance multi-step work on its own; Plan mode returns to a pure approval gate so you keep the pace after approve. Responsibilities of the two modes are clearer."]}, {"key": "fixed", "title": "Fixes", "items": ["Fixed the sidebar session list occasionally clearing during streaming replies until you switched workspace or sent a new message.", "Fixed release-note bullets in the update modal losing leading markers and collapsing into a wall of text; list hierarchy and spacing are clearer."]}]}, {"version": "v0.0.1-beta.20", "label": "0.0.1-beta.20", "n": 20, "zh": [{"key": "added", "title": "新功能", "items": ["**输入框模型切换**：聊天输入框新增模型下拉菜单，可在发送前直接切换本次对话使用的模型，无需进设置。"]}, {"key": "fixed", "title": "修复", "items": ["修复助手回复中偶发的“伪工具调用”文本泄漏，异常片段会被拦截并中和，不再展示给用户。", "修复 Plan 计划标题在某些情况下被内容中的句点（如版本号 `dev/0.0.1`）截断的问题，标题显示更完整。", "修复侧边栏会话压缩进度不能实时更新的问题，长会话压缩状态展示更及时。", "修复运行中的会话无法切换置顶状态的问题。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**Model switch in the composer**: pick the model for this turn from a dropdown before send, without opening Settings."]}, {"key": "fixed", "title": "Fixes", "items": ["Blocked and neutralized occasional “pseudo tool-call” text leaks in assistant replies.", "Plan titles are no longer truncated at periods inside content (e.g. version `dev/0.0.1`).", "Sidebar session compaction progress now updates in real time.", "Running sessions can toggle pin state again."]}]}, {"version": "v0.0.1-beta.19", "label": "0.0.1-beta.19", "n": 19, "zh": [{"key": "added", "title": "新功能", "items": ["**MCP 一键 OAuth 登录**：HTTP 类型的 MCP 服务新增一键 OAuth 登录入口，可自动跳转授权，接入需要身份验证的服务更顺畅。"]}, {"key": "improved", "title": "优化", "items": ["**Plan 模式**：原「Goal 模式」正式更名为「Plan 模式」（含工作台标签与内部标识），命名更贴合“先规划再执行”的实际体验，并保持向后兼容。", "**上下文用量统计更准**：上下文计数口径重新梳理，压缩后能正确回落，长会话的用量显示更真实可信（ADR 42）。", "**Plan 审批卡对齐**：聊天流中的「批准并执行」审批卡与聊天内容列居中对齐，视觉更整齐。", "**任务推进更稳**：Plan 模式任务推进不再受固定次数/轮次上限熔断，改由“无进展”双信号护栏判定停止，复杂任务更不容易被中途打断。"]}, {"key": "fixed", "title": "修复", "items": ["修复重载应用后，需要身份验证的 MCP 服务未稳定显示登录引导的问题。", "修复运行中的会话仍显示置顶操作的问题。", "修复 Plan 面板指示箭头方向的显示细节。", "优化聊天流订阅的内部实现，提升多会话并发时流式消息路由的稳定性。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**One-click MCP OAuth login**: HTTP MCP services get a one-click OAuth entry that jumps to authorization automatically."]}, {"key": "improved", "title": "Improvements", "items": ["**Plan mode**: former “Goal mode” is renamed to “Plan mode” (workbench tab and internal ids), better matching plan-then-execute while staying backward compatible.", "**More accurate context usage**: recounting rules reset correctly after compaction (ADR 42).", "**Plan approval card alignment**: “Approve & run” cards center with the chat content column.", "**Stabler task advance**: Plan mode no longer hard-stops on fixed turn caps; dual no-progress guards decide when to stop so complex work is less likely cut mid-way."]}, {"key": "fixed", "title": "Fixes", "items": ["After app reload, auth-required MCP services more reliably show login guidance.", "Running sessions no longer show pin actions incorrectly.", "Fixed Plan panel indicator arrow direction details.", "Improved chat-stream subscription internals for multi-session streaming stability."]}]}, {"version": "v0.0.1-beta.18", "label": "0.0.1-beta.18", "n": 18, "zh": [{"key": "added", "title": "新功能", "items": ["**置顶会话**：支持将重要会话固定在侧边栏顶部，切换和回访常用对话更方便。", "**文件拖拽上传体验**：聊天区新增文件拖拽覆盖层，拖入文件时有更明确的投放反馈。", "**Goal 模式审批联动**：打通 Goal 模式聊天审批与右侧面板联动，任务确认流程更连贯。"]}, {"key": "improved", "title": "优化", "items": ["优化桌面端运行时与侧边栏状态处理，提升会话列表、置顶状态和窗口交互的一致性。", "会话列表会同步显示上下文压缩中的状态，长会话处理过程更清晰。", "Thinking 折叠头部调整为流动微光条样式，思考过程展示更轻量。", "简化 MCP 连接配置流程，降低首次接入和维护成本。"]}, {"key": "fixed", "title": "修复", "items": ["修复切换会话后工具调用进度可能残留的问题。", "修复切换会话后历史流式错误状态可能残留的问题。", "修复历史压缩后部分会话记录未正确保留的问题。", "修复置顶会话、侧边栏分隔线和下拉菜单浮层的若干显示细节问题。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**Pin sessions**: keep important chats at the top of the sidebar for faster revisit.", "**File drag-and-drop UX**: chat area shows a drop overlay with clearer feedback when dragging files in.", "**Goal mode approval linkage**: chat approval cards sync with the right panel for a smoother confirm flow."]}, {"key": "improved", "title": "Improvements", "items": ["Desktop runtime and sidebar state handling are more consistent for session list, pin state, and window interactions.", "Session list shows in-progress context compaction status for long chats.", "Thinking collapse header uses a flowing shimmer bar for a lighter look.", "Simplified MCP connection setup for first-time and ongoing maintenance."]}, {"key": "fixed", "title": "Fixes", "items": ["Fixed tool-call progress lingering after switching sessions.", "Fixed historical stream error state lingering after switching sessions.", "Fixed some session records not retained correctly after history compaction.", "Fixed display details for pinned sessions, sidebar dividers, and dropdown overlays."]}]}, {"version": "v0.0.1-beta.17", "label": "0.0.1-beta.17", "n": 17, "zh": [{"key": "added", "title": "新功能", "items": ["**本地 MCP 连接支持 OAuth 2.0 授权**：连接本地 MCP 服务时支持标准 OAuth 2.0 授权码流程，接入需要登录的 MCP 服务更加顺畅。"]}, {"key": "improved", "title": "优化", "items": ["上下文用量估算更准确：计入工具 schema 的占用并修正中日韩字符的计数方式，用量进度条更贴近真实情况。", "统一上下文用量为完整会话量口径，消除回合结束时进度条数值跳变的问题。"]}, {"key": "fixed", "title": "修复", "items": ["修复读取含工具调用语法的文本后，模型可能把工具指令输出到正文并导致回合中断的问题；同时增加响应守卫兜底，自动纠偏。", "修复历史压缩时未复用已解析的 provider 配置的问题。", "修复模型下拉菜单被遮挡、裁剪的显示问题。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**Local MCP connections support OAuth 2.0**: standard authorization-code flow makes login-required MCP services smoother to connect."]}, {"key": "improved", "title": "Improvements", "items": ["More accurate context usage estimates: tool schemas are counted and CJK character weighting is corrected.", "Context usage uses full-session accounting so the progress bar no longer jumps at turn end."]}, {"key": "fixed", "title": "Fixes", "items": ["Fixed cases where reading text with tool-call syntax could leak tool instructions into the body and break the turn; response guards auto-correct.", "History compaction now reuses the already-resolved provider config.", "Fixed model dropdown menus being clipped or covered."]}]}, {"version": "v0.0.1-beta.16", "label": "0.0.1-beta.16", "n": 16, "zh": [{"key": "added", "title": "新功能", "items": ["**会话列表常态展示相对时间**：左侧会话列表默认显示「几分钟前 / 昨天」等相对时间，更快定位最近会话。", "**Agent 调用内置浏览器自动切换视图**：当 Agent 使用内置浏览器工具时，工作台会自动展开并切到「浏览器」标签，操作过程实时可见。"]}, {"key": "improved", "title": "优化", "items": ["拖拽左栏分隔条时改用 rAF 合并写入，拖动更顺滑、卡顿明显减轻。", "描述为空的技能不再被加载或借用，避免无效技能干扰技能列表。"]}, {"key": "fixed", "title": "修复", "items": ["统一历史压缩的用量估算口径，进度条与触发阈值一致，达到阈值后会在回合结束时自动触发压缩。", "修复 GPT 订阅上下文窗口被误设为 1M 的问题，改为 258K。", "修复 OAuth 会话过期时仍可激活该 provider 的问题，并在过期时给出显性提示。", "修复 OAuth 重新登录时端口被占用导致登录失败的问题。", "登录成功后自动清除此前残留的错误提示。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**Relative timestamps in the session list** by default (“a few minutes ago / yesterday”) to find recent chats faster.", "**Agent browser tools auto-switch the view**: when the Agent uses the embedded browser, the workbench expands to the Browser tab so actions are visible live."]}, {"key": "improved", "title": "Improvements", "items": ["Left rail resize uses rAF-coalesced writes for smoother dragging.", "Skills with empty descriptions are no longer loaded or borrowed."]}, {"key": "fixed", "title": "Fixes", "items": ["Unified history-compaction usage estimates so the progress bar matches the trigger threshold; auto-compact runs at turn end when over threshold.", "Fixed GPT subscription context window wrongly set to 1M; now 258K.", "Expired OAuth sessions can no longer activate that provider, with an explicit expired hint.", "Fixed OAuth re-login failures when the port was already in use.", "Successful login clears leftover error banners."]}]}, {"version": "v0.0.1-beta.15", "label": "0.0.1-beta.15", "n": 15, "zh": [{"key": "added", "title": "新功能", "items": ["**左侧会话栏可自由调节**：拖动右边缘即可改变宽度，拖到足够窄会自动收起；主区顶栏左上角新增一个与右侧对称的开关按钮，一键展开/收起左栏，也支持 ⌘B 快捷键。", "**支持从 a1 公共仓借用技能**：通过软链接投影复用公共技能仓里的技能，无需重复安装。"]}, {"key": "improved", "title": "优化", "items": ["能力胶囊并入 MCP 工具列表并去除描边，能力区视觉更统一。", "工作台打开时默认激活的标签由「终端」改为「目标」，更贴合常用流程。"]}, {"key": "fixed", "title": "修复", "items": ["修复首个会话未使用「会话绑定的工作区根目录」的问题。", "修复 MCP 工具偶发被误报为「不可用」的问题，并支持按服务折叠列表。", "修复点击文件夹路径链接被误导入 Diff 视图的问题，现在按真实类型正确分流。", "MCP 刷新列表改为批量重新拉取清单，并补充刷新状态反馈。", "修复历史压缩进度卡在 87% 后瞬跳完成的问题，收尾更平滑。", "修复下载更新时左上角进度环被横条遮挡的问题，并强化更新弹窗的过渡动画。"]}], "en": [{"key": "added", "title": "What's New", "items": ["**Resizable left session rail**: drag the right edge to resize; collapse when narrow enough. A toggle matching the right side sits in the main top bar (also ⌘B).", "**Borrow skills from the a1 public repo** via soft-link projection without reinstalling."]}, {"key": "improved", "title": "Improvements", "items": ["Capability chips merge into the MCP tool list without outlines for a unified look.", "Workbench default tab when opened is Goal instead of Terminal."]}, {"key": "fixed", "title": "Fixes", "items": ["First session now uses the session-bound workspace root correctly.", "Fixed MCP tools occasionally reported as “unavailable”, and added per-service collapse.", "Folder path links no longer open the Diff view; routing follows real path type.", "MCP list refresh re-fetches manifests in batch and shows refresh status.", "Fixed history compaction progress stuck at 87% then jumping to done.", "Fixed the top-left progress ring being covered by a bar during update download, and improved update modal transitions."]}]}, {"version": "v0.0.1-beta.14", "label": "0.0.1-beta.14", "n": 14, "zh": [{"key": "added", "title": "新功能", "items": ["设置页新增**「能力」分区**：统一整合技能安装入口与 MCP 服务管理，能力的查看、安装与配置集中在一处。", "会话头部新增**已挂载能力指示器**：实时显示当前已挂载的能力，并按访问级别动态呈现状态。", "设置页新增 **Git 分区**：可配置分支名前缀，该前缀会自动注入 Agent 上下文，让 Agent 按你的规范创建分支。", "工作台**文件夹路径 chip 可点击**：点击即打开「文件」视图并定位到对应目录；文件树改为真实懒加载，大目录展开更快更省资源。", "新增**自定义应用菜单**：并将 ⌘R 重新绑定为刷新内嵌浏览器页面。", "切换工作区后**自动激活会话**：优先选中第一个进行中的会话，否则选中第一个会话，省去手动点击。"]}, {"key": "improved", "title": "优化", "items": ["工作区下拉菜单补齐**退场动画**，并支持**点击外部自动关闭**，交互更顺滑。", "面板拖拽手柄高亮改为**边框变色**，消除接缝处的双线问题，视觉更干净。"]}, {"key": "fixed", "title": "修复", "items": ["修复点击**未改动文件**时 Diff 视图显示空白的问题：现在无改动文件会自动展示文件完整内容。", "修复能力工作台 **MCP 标签页**描述重复、嵌入态下多余留白的问题。"]}], "en": [{"key": "added", "title": "What's New", "items": ["Settings adds a **Capabilities** section that unifies skill install entry points and MCP service management.", "Session header shows a **mounted capabilities indicator** with live status by access level.", "Settings adds a **Git** section for branch-name prefixes injected into Agent context so branches follow your convention.", "Workbench **folder path chips are clickable**: open the Files view and jump to the directory; the tree uses real lazy-loading for large folders.", "Added a **custom app menu** and rebound ⌘R to refresh the embedded browser page.", "After switching workspace, a session is **auto-activated** (prefer the first in-progress session, else the first session)."]}, {"key": "improved", "title": "Improvements", "items": ["Workspace dropdown adds an **exit animation** and closes on outside click.", "Panel drag-handle highlight uses **border color** instead of double-line seams."]}, {"key": "fixed", "title": "Fixes", "items": ["Clicking an **unchanged file** no longer shows a blank Diff view; full file content is shown instead.", "Fixed **MCP tab** duplicate descriptions and extra padding in embedded capability workbench mode."]}]}, {"version": "v0.0.1-beta.13", "label": "0.0.1-beta.13", "n": 13, "zh": [{"key": "added", "title": "新功能", "items": ["工作台新增**内嵌浏览器**：可像普通浏览器一样在面板内访问网页（地址栏、前进/后退/刷新/停止、加载与错误提示）；同时支持 **Agent 操控浏览器**（导航、点击、输入、截图、读取页面），操作均经权限确认。", "Diff 面板支持一键**切换查看文件完整内容**：除查看改动外，可直接查看目标文件完整文本（带行号、只读）。"]}, {"key": "improved", "title": "优化", "items": ["应用更新改为**后台静默下载**：不再全屏霸屏，下载完成后右下角弹卡片，点击即可安装，关闭/弹出均带动画。", "底部状态栏的**轮次与工具调用计数**实时反映真实执行进度。", "自动压缩历史时的**进度显示更准确**。", "收紧工作台顶部留白，Diff 标题栏上提铺满，界面更紧凑。"]}, {"key": "fixed", "title": "修复", "items": ["修复查找框**输入框与向上箭头无法点击**的问题。", "修复 mac 端更新下载在部分网络环境下失败的问题（改走系统代理）。", "修复历史长文本预览条**无内容时点不开**，并压成单行展示。", "修复 Markdown 列表的**圆点/序号丢失**问题。", "修复目标计划在特定情况下残留**僵尸“执行中”计划**的问题。", "文件搜索越权路径现在统一经过**权限确认**，更安全。"]}], "en": [{"key": "added", "title": "What's New", "items": ["Workbench adds an **embedded browser**: browse pages in-panel (address bar, back/forward/reload/stop, loading and error states); **Agent can drive the browser** (navigate, click, type, screenshot, read page) with permission confirmation.", "Diff panel can **switch to full file content** in one click: beyond the patch, view the full target file (line numbers, read-only)."]}, {"key": "improved", "title": "Improvements", "items": ["App updates use **silent background download**: no full-screen takeover; a bottom-right card appears when ready to install, with enter/exit animations.", "Bottom status bar **turn and tool-call counts** reflect real progress live.", "Auto-compaction progress is **more accurate**.", "Tighter workbench top padding and a flush Diff title bar for a denser UI."]}, {"key": "fixed", "title": "Fixes", "items": ["Fixed the find box where the input and up-arrow could not be clicked.", "Fixed macOS update downloads failing on some networks by using the system proxy.", "Fixed long-history preview bars that would not open when empty, and collapsed them to a single line.", "Fixed missing Markdown list bullets/numbers.", "Fixed zombie “running” goal plans in certain cases.", "Out-of-scope file search paths now go through **permission confirmation**."]}]}, {"version": "v0.0.1-beta.12", "label": "0.0.1-beta.12", "n": 12, "zh": [{"key": "added", "title": "新功能", "items": ["配色面板新增 **custom 自定义配色体系**，可调出专属主题，并提供实时代码预览效果。"]}, {"key": "improved", "title": "优化", "items": ["工具调用展示压缩为极简单行，聊天界面更清爽。", "Diff 视图的增删色块整行铺满、去掉行号列分隔，改动一目了然。"]}, {"key": "fixed", "title": "修复", "items": ["修复 Claude（opus-4-8 等）**推理过程不可见**的问题，深度思考的思考摘要现在能正常展示。", "修复思考强度**档位被降级**的问题：Anthropic / OpenAI 各档位（含 xhigh 超深度）现在完整显示，不再被压成四档。", "多行输入时，输入框会**随内容自动增高**（到上限后内部滚动），不再把内容压在一行里。", "为目标计划的探索子任务数量补上**安全上限**，防止异常情况下失控消耗资源。"]}], "en": [{"key": "added", "title": "What's New", "items": ["Color panel adds a **custom palette system** for personal themes, with live code preview."]}, {"key": "improved", "title": "Improvements", "items": ["Tool-call display is compressed to a minimal single line for a cleaner chat UI.", "Diff view fills whole rows for add/remove blocks and drops the line-number column divider so changes stand out."]}, {"key": "fixed", "title": "Fixes", "items": ["Fixed invisible Claude (e.g. opus-4-8) reasoning summaries so deep-thinking content shows correctly.", "Fixed thinking-level downgrades: Anthropic / OpenAI levels (including xhigh) now display fully instead of being collapsed to four tiers.", "Multi-line input auto-grows with content (then scrolls internally at the cap) instead of staying one line.", "Added a safety cap on goal plan explorer subtasks to prevent runaway resource use."]}]}, {"version": "v0.0.1-beta.11", "label": "0.0.1-beta.11", "n": 11, "zh": [{"key": "added", "title": "新功能", "items": ["工作台 diff 视图支持解析并打开跨仓库文件路径，聊天里的文件路径链接可直接点击跳转。", "模型配置支持「复制」：可基于已有非订阅 provider 快速复制一份配置（订阅类型除外）。", "Anthropic xhigh 推理档忠实映射到原生 `output_config.effort=xhigh`，不再折叠到 high。"]}, {"key": "improved", "title": "优化", "items": ["右侧工作台默认宽度从 420 调大到 600，信息展示更从容。", "同会话内新建后续计划时也会自动展开工作台。", "更新弹窗的吉祥物图标改为圆角。", "清理上下文压缩中已失效的 `targetRatio` / `keepRecentCount` 死代码（不改变运行行为）。"]}, {"key": "fixed", "title": "修复", "items": ["按文件是否真实存在来判定路径链接，不再把 git 分支名、`org/repo` 仓库名误判为可点击的本地文件路径。", "修复目标计划面板的滚动问题：卡片不再被压缩，主体可正常滚动，进度条在主卡片正确显示。"]}], "en": [{"key": "added", "title": "What's New", "items": ["Workbench diff view can resolve and open cross-repo file paths; chat path links jump directly.", "Model configs support “Duplicate”: quickly copy an existing non-subscription provider (subscription types excluded).", "Anthropic xhigh reasoning maps faithfully to native `output_config.effort=xhigh` instead of collapsing to high."]}, {"key": "improved", "title": "Improvements", "items": ["Default right workbench width increased from 420 to 600 for more breathing room.", "Creating a follow-up plan in the same session also auto-expands the workbench.", "Update modal mascot icon now uses rounded corners.", "Removed dead `targetRatio` / `keepRecentCount` code from context compaction (no runtime behavior change)."]}, {"key": "fixed", "title": "Fixes", "items": ["Path links are only clickable when the file actually exists; git branch names and `org/repo` repo names are no longer treated as local paths.", "Fixed goal plan panel scrolling: cards no longer collapse, the body scrolls correctly, and the progress bar shows on the main card."]}]}, {"version": "v0.0.1-beta.10", "label": "0.0.1-beta.10", "n": 10, "zh": [{"key": "added", "title": "新功能", "items": ["聊天区新增顶部会话标题栏，可查看/操作当前会话。", "新增右侧工作台侧边面板，集成「目标 / 终端 / 浏览器 / 文件」分栏。", "聊天消息里的文件路径现在可点击直接打开。", "目标面板可见性优化，目标计划更易查看。"]}, {"key": "improved", "title": "优化", "items": ["运行状态改为圆点指示器，操作按钮右对齐，更简洁。", "工作台仅在新建目标计划时自动展开，不再频繁打断。"]}, {"key": "fixed", "title": "修复", "items": ["修复侧栏自动折叠且非全屏时，会话标题与 macOS 红绿灯重叠的问题。", "修复工作台开关图标与其他图标重叠的问题。", "修复安装更新时安装包无法覆盖的问题（打开安装包后主动退出）。"]}], "en": [{"key": "added", "title": "What's New", "items": ["Added a session title bar at the top of the chat area for viewing and managing the current session.", "Added a right-side workbench panel with Goal / Terminal / Browser / Files tabs.", "File paths in chat messages are now clickable and open directly.", "Improved goal panel visibility so plans are easier to inspect."]}, {"key": "improved", "title": "Improvements", "items": ["Running status uses a dot indicator, with action buttons right-aligned for a cleaner layout.", "The workbench auto-expands only when creating a new goal plan, reducing interruptions."]}, {"key": "fixed", "title": "Fixes", "items": ["Fixed session titles overlapping macOS traffic lights when the sidebar auto-collapses outside fullscreen.", "Fixed the workbench toggle icon overlapping other icons.", "Fixed installer overwrite failures during updates (the app quits after opening the package)."]}]}, {"version": "v0.0.1-beta.9", "label": "0.0.1-beta.9", "n": 9, "zh": [{"key": "added", "title": "新功能", "items": ["自动检查更新：应用运行期间每小时自动检查一次新版本，发现更新时会在左下角版本号旁亮起红点提示。"]}, {"key": "improved", "title": "优化", "items": ["侧边栏版本号去掉了外层胶囊边框，视觉更简洁。", "弹窗关闭时新增自然的退场动画，不再瞬间消失。", "重新设计了 batch_search（批量搜索）工具卡片，更简洁清晰。"]}], "en": [{"key": "added", "title": "What's New", "items": ["Automatic update checks: while the app is running it checks for a new version every hour, and shows a red badge next to the version number when one is available."]}, {"key": "improved", "title": "Improvements", "items": ["Removed the capsule border around the sidebar version label for a cleaner look.", "Added a natural exit animation when closing modals instead of an abrupt disappear.", "Redesigned the batch_search tool card to be simpler and clearer."]}]}, {"version": "v0.0.1-beta.8", "label": "0.0.1-beta.8", "n": 8, "zh": [{"key": "improved", "title": "优化", "items": ["下载更新时的图标现在会跟随浅色/深色主题自动切换，不再出现两张图标叠加的情况。"]}, {"key": "fixed", "title": "修复", "items": ["修复 macOS 上自动更新报「代码签名校验失败」导致无法更新的问题：现在会自动下载安装包并在下载完成后引导你打开，手动拖入「应用程序」即可完成更新。", "修复从历史消息分叉新建会话时，新会话因丢失工作区归属而在左侧列表被隐藏的问题。"]}], "en": [{"key": "improved", "title": "Improvements", "items": ["The download-update icon now follows light/dark theme automatically, without stacking two icons."]}, {"key": "fixed", "title": "Fixes", "items": ["Fixed macOS auto-update failures caused by “code signature verification failed”: the app now downloads the installer and guides you to open it so you can drag it into Applications.", "Fixed sessions forked from history being hidden in the sidebar after losing workspace ownership."]}]}, {"version": "v0.0.1-beta.7", "label": "0.0.1-beta.7", "n": 7, "zh": [{"key": "improved", "title": "优化", "items": ["更新弹窗的「更新内容」现在支持富文本展示，不再出现 `<p>` 等原始标签。", "发布说明改为按版本维护，发布前会自动校验，确保每个版本都有清晰的更新内容。"]}, {"key": "fixed", "title": "修复", "items": ["修复自动更新下载失败（404）的问题：此前更新清单中的下载链接与实际安装包文件名不一致，导致无法下载新版本。", "修复「发现新版本」弹窗中更新内容显示为 HTML 源码的问题。"]}], "en": [{"key": "improved", "title": "Improvements", "items": ["Release notes in the update modal now render as rich text instead of raw tags like `<p>`.", "Release notes are maintained per version and validated before publish so every release has clear update content."]}, {"key": "fixed", "title": "Fixes", "items": ["Fixed auto-update download failures (404) caused by mismatched download URLs and installer filenames in the update manifest.", "Fixed the “New version available” modal showing release notes as raw HTML source."]}]}];

        };

        function detectLang() {
          try {
            var saved = localStorage.getItem(STORAGE_KEY);
            if (saved === "en" || saved === "zh") return saved;
          } catch (e) {}
          var nav = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
          return String(nav).toLowerCase().startsWith("zh") ? "zh" : "en";
        }

        function formatInline(text) {
          // **bold**
          var esc = text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
          return esc.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        }

        function renderTimeline(lang) {
          var root = document.getElementById("timeline");
          if (!root) return;
          root.innerHTML = "";
          if (!ENTRIES.length) {
            var empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = ui[lang].empty;
            root.appendChild(empty);
            return;
          }
          ENTRIES.forEach(function (entry, idx) {
            var sections = entry[lang] && entry[lang].length ? entry[lang] : entry.en;
            var card = document.createElement("article");
            card.className = "release";
            card.id = entry.version;

            var head = document.createElement("div");
            head.className = "release-head";
            var h2 = document.createElement("h2");
            h2.textContent = entry.label;
            head.appendChild(h2);
            if (idx === 0) {
              var badge = document.createElement("span");
              badge.className = "badge";
              badge.textContent = ui[lang].latest;
              head.appendChild(badge);
            }
            card.appendChild(head);

            (sections || []).forEach(function (sec) {
              var wrap = document.createElement("div");
              wrap.className = "section " + (sec.key || "other");
              var h3 = document.createElement("h3");
              h3.textContent = (LABELS[lang] && LABELS[lang][sec.key]) || sec.title || LABELS[lang].other;
              wrap.appendChild(h3);
              var ul = document.createElement("ul");
              (sec.items || []).forEach(function (item) {
                var li = document.createElement("li");
                li.innerHTML = formatInline(item);
                ul.appendChild(li);
              });
              wrap.appendChild(ul);
              card.appendChild(wrap);
            });
            root.appendChild(card);
          });
        }

        function applyLang(lang) {
          var pack = ui[lang] || ui.en;
          document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
          document.title = pack.documentTitle;
          document.querySelectorAll("[data-i18n]").forEach(function (el) {
            var key = el.getAttribute("data-i18n");
            if (key && pack[key] != null) el.textContent = pack[key];
          });
          var enBtn = document.getElementById("lang-en");
          var zhBtn = document.getElementById("lang-zh");
          if (enBtn) enBtn.setAttribute("aria-pressed", lang === "en" ? "true" : "false");
          if (zhBtn) zhBtn.setAttribute("aria-pressed", lang === "zh" ? "true" : "false");
          renderTimeline(lang);
        }

        function setLang(lang, persist) {
          if (lang !== "en" && lang !== "zh") lang = "en";
          applyLang(lang);
          if (persist) {
            try { localStorage.setItem(STORAGE_KEY, lang); } catch (e) {}
          }
        }

        document.querySelectorAll(".lang-toggle button").forEach(function (btn) {
          btn.addEventListener("click", function () {
            setLang(btn.getAttribute("data-lang"), true);
          });
        });

        setLang(detectLang(), false);
      })();
    </script>
