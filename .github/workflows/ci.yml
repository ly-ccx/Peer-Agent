# Pull request CI for the 0.1.0 line and main.
# No release secrets. A timing flake may fail one file under full parallel
# load; that file is retried once before the job fails.
name: CI

on:
  pull_request:
    branches:
      - main
      - 'PeerAgent/dev/**'
  push:
    branches:
      - PeerAgent/dev/0.1.0

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.check_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Required-check IDs are a branch-protection contract, independent of
        # the runner image. Keep the legacy macOS ID while retiring macos-14.
        include:
          - os: macos-15
            check_name: ci-macos-14
          - os: ubuntu-latest
            check_name: ci-ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.22.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Node 22's test runner cancels an async test whose only timer is
          # unref'd. The suite was verified on Node 25.
          node-version: 25
          cache: pnpm

      - name: Require Node >= 24
        run: node -e "const major = Number(process.versions.node.split('.')[0]); if (major < 24) { console.error('Node ' + process.versions.node + ' is below 24'); process.exit(1); }"

      - name: Test Linux dependency bootstrap
        run: node --test scripts/ci-install-linux-deps.test.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux credential-helper build deps
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: bash scripts/ci-install-linux-deps.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check packaged main-process imports
        run: |
          node --test scripts/check-packaged-main-imports.test.mjs
          node scripts/check-packaged-main-imports.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture check
        run: pnpm architecture:check

      - name: Test
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          # Desktop tests and retries include real Electron windows.
          display=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            display=(xvfb-run -a)
          fi
          log="${RUNNER_TEMP}/peer-test.log"
          set +e
          "${display[@]}" pnpm test 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          echo "::warning::Full test run failed. Retrying each failed file once."
          files=$(grep -oE '(apps|packages|scripts|marketplace)/[A-Za-z0-9_./-]+\.test\.(mjs|ts|tsx)' "$log" | sort -u)
          if [ -z "$files" ]; then
            echo "::error::Could not identify a failed test file to retry."
            exit "$code"
          fi
          retry_failed=0
          printf '%s\n' "$files" > "$RUNNER_TEMP/retry-files.txt"
          # macOS runners ship Bash 3.2, which has no mapfile.
          while IFS= read -r file; do
            [ -n "$file" ] && [ -f "$file" ] || continue
            echo "::group::retry $file"
            if [[ "$file" == apps/tui/* ]]; then
              bun test "$file" || retry_failed=1
            else
              "${display[@]}" node --test --test-reporter=tap "$file" || retry_failed=1
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/retry-files.txt"
          exit "$retry_failed"

      - name: Bot shell Electron smoke (macOS)
        if: runner.os == 'macOS'
        run: pnpm --filter @peer-agent/desktop smoke:bots --accessibility --diagnostics --streaming --effort-stability --work-surfaces --output "$RUNNER_TEMP/bot-shell-report.json"

      - name: Bot shell Electron smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @peer-agent/desktop smoke:bots --accessibility --diagnostics --streaming --effort-stability --work-surfaces --output "$RUNNER_TEMP/bot-shell-report.json"

      - name: Preserve bot shell report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bot-shell-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/bot-shell-report.json
            ${{ runner.temp }}/bot-shell-failure.png
            ${{ runner.temp }}/bot-shell-trace.zip
            ${{ runner.temp }}/bot-shell-protocol.log
            ${{ runner.temp }}/bot-shell-main-*
          if-no-files-found: ignore
