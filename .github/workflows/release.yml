# Peer Agent — Release (tag-driven)
#
# 触发：推送符合 v* 的 tag。通道由 tag 名语义分流：
#   - v1.2.3            → 正式 Release（latest 通道）
#   - v1.2.3-beta.N     → 预发布 Release（beta 通道，prerelease=true）
#
# 链路（拆分 build / publish，消除并行发布竞态）：
#   meta      → 从 tag 解析版本 / 通道 / releaseType / prerelease（单一事实源）
#   build     → matrix（mac + win + linux）各自构建 Desktop，electron-builder --publish never
#               只产出安装包与更新清单（*-mac.yml / *.yml / *-linux.yml），不直接发布，
#               产物经 upload-artifact 上传。
#   build-cli → 构建 CLI 归档（peer + peer-credential-helper 同目录），
#               当前矩阵：darwin-arm64（macos-14）+ linux-x64（ubuntu-latest）。
#               关键失败阻断整个 Release。
#   release   → 单个 job 下载 Desktop + CLI 产物，一次性创建/更新同一个 GitHub Release。
#
# 为什么拆分：mac、win、linux 三个 matrix job 若各自 --publish 到同一 tag，会并发
#   抢建 Release，导致同一 tag 出现多个 Release、产物被劈开（electron-builder
#   + Actions matrix 的已知竞态）。集中到单个 release job 发布可彻底消除。
#
# 签名：mac 必须使用 Developer ID Application 证书（secrets MAC_CSC_LINK /
#       MAC_CSC_KEY_PASSWORD，Team ID 82672N97RP）签名，缺失即失败——应用内更新
#       由 Squirrel 校验新旧包签名身份一致，一旦发出 ad-hoc 包会切断后续热更新链。
#       Windows / Linux 仍未签名（CSC_IDENTITY_AUTO_DISCOVERY=false）。
# 公证：mac 构建以 secrets APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD 提交公证并 staple，
#       缺失即失败，避免发出未公证的首装 dmg。
name: Release

on:
  push:
    tags:
      - 'v*'

# release job 需要写 Releases 的权限（GITHUB_TOKEN 自动注入）。
permissions:
  contents: write

jobs:
  # ── 单一事实源：从 tag 解析版本与通道，供 build / release 复用 ──
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      releaseType: ${{ steps.meta.outputs.releaseType }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch main release source
        shell: bash
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check release readiness
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:readiness-check

      - name: Run release:source-check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_MAIN_REF: origin/main
        run: npm run release:source-check

      - name: Derive version & channel from tag
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-beta.* || "$VERSION" == *-alpha.* || "$VERSION" == *-rc.* ]]; then
            CHANNEL=beta
            RELEASE_TYPE=prerelease
            PRERELEASE=true
          else
            CHANNEL=latest
            RELEASE_TYPE=release
            PRERELEASE=false
          fi
          {
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "releaseType=$RELEASE_TYPE"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Tag=$TAG Version=$VERSION Channel=$CHANNEL ReleaseType=$RELEASE_TYPE Prerelease=$PRERELEASE"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            ebflags: --mac
          - os: windows-latest
            platform: win
            ebflags: --win
          - os: ubuntu-latest
            platform: linux
            ebflags: --linux --x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.22.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Stamp version from tag
        shell: bash
        run: node scripts/stamp-version.mjs "${{ needs.meta.outputs.version }}"

      - name: Install Linux desktop build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config fakeroot dpkg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Rust native binaries（host 架构）。electron-builder.yml extraResources
      # 从 target/release/ 拷贝 peer-credential-helper。
      # 注意（阶段一）：Windows arm64 安装包将打包 x64 native binaries（在 win-arm64
      # 上以模拟方式运行）；arm64-native 交叉编译留待阶段二。
      # Linux Desktop 阶段一仅 x64；linux-arm64 Desktop 留待后续。
      - name: Build Rust native binaries
        run: cargo build --locked --release --package peer-credential-helper

      - name: Build frontend
        run: pnpm --filter @peer-agent/desktop build

      # 只构建、不发布（--publish never）。electron-builder 仍会按通道语义生成
      # 更新清单（beta-mac.yml / beta.yml / beta-linux.yml 或
      # latest-mac.yml / latest.yml / latest-linux.yml）。
      # 证书只注入 mac：全局 CSC_LINK 会被 Windows 构建拿去跑 signtool。
      - name: Build (electron-builder, no publish)
        working-directory: apps/desktop
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = "mac" ]; then
            if [ -z "$MAC_CSC_LINK" ] || [ -z "$MAC_CSC_KEY_PASSWORD" ]; then
              echo "::error::MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD secrets are required: an ad-hoc signed mac build breaks in-app updates."
              exit 1
            fi
            if [ -z "$MAC_APPLE_ID" ] || [ -z "$MAC_APPLE_APP_SPECIFIC_PASSWORD" ]; then
              echo "::error::APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD secrets are required to notarize the mac build."
              exit 1
            fi
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            export APPLE_ID="$MAC_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID=82672N97RP
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm exec electron-builder ${{ matrix.ebflags }} --publish never \
            --config.publish.channel=${{ needs.meta.outputs.channel }} \
            --config.publish.releaseType=${{ needs.meta.outputs.releaseType }}

      # Squirrel 安装的是 zip 里的 .app，因此 .app 与 zip 解压结果都要核对 Team ID、
      # 公证票据（stapler）与 Gatekeeper 评估。
      - name: Verify macOS Developer ID signature and notarization
        if: matrix.platform == 'mac'
        shell: bash
        env:
          MAC_TEAM_ID: 82672N97RP
        run: |
          set -euo pipefail
          verify_app() {
            local app="$1"
            codesign --verify --deep --strict --verbose=2 "$app"
            local details
            details="$(codesign -dv --verbose=4 "$app" 2>&1)"
            echo "$details" | grep -E '^(Authority|TeamIdentifier)=' || true
            if ! echo "$details" | grep -qx "TeamIdentifier=$MAC_TEAM_ID"; then
              echo "::error::$app is not signed by Team ID $MAC_TEAM_ID"
              exit 1
            fi
            if ! echo "$details" | grep -q '^Authority=Developer ID Application:'; then
              echo "::error::$app is not signed with a Developer ID Application certificate"
              exit 1
            fi
            if ! xcrun stapler validate "$app"; then
              echo "::error::$app has no stapled notarization ticket"
              exit 1
            fi
            local assessment
            assessment="$(spctl -a -vvv -t exec "$app" 2>&1 || true)"
            echo "$assessment"
            if ! echo "$assessment" | grep -q 'source=Notarized Developer ID'; then
              echo "::error::$app is not accepted by Gatekeeper as Notarized Developer ID"
              exit 1
            fi
          }
          shopt -s nullglob
          apps=(dist-electron/mac*/"Peer Agent.app")
          zips=(dist-electron/Peer-Agent-*-arm64.zip)
          if [ ${#apps[@]} -eq 0 ] || [ ${#zips[@]} -eq 0 ]; then
            echo "::error::mac .app or update zip not found in dist-electron"
            exit 1
          fi
          for app in "${apps[@]}"; do verify_app "$app"; done
          for zip in "${zips[@]}"; do
            out="$(mktemp -d)"
            ditto -x -k "$zip" "$out"
            verify_app "$out/Peer Agent.app"
          done

      - name: Verify packaged runtime entries
        run: pnpm --filter @peer-agent/desktop verify:packaged

      # 上传各平台产物（安装包 + blockmap + 更新清单）给 release job 汇总。
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.blockmap
            dist-electron/*.yml
          if-no-files-found: error
          retention-days: 5

  # ── CLI 一等发布：peer + peer-credential-helper 同归档 ──
  # 当前矩阵：macos-14 → peer-darwin-arm64.tar.gz
  #           ubuntu-latest → peer-linux-x64.tar.gz
  # 失败策略：needs 纳入 release，任一 CLI 目标失败阻断整个 tag 发布。
  build-cli:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.22.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux credential-helper build deps
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cli-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Stamp version from tag
        shell: bash
        run: node scripts/stamp-version.mjs "${{ needs.meta.outputs.version }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages export dist/*; clean CI must build them before bun compile.
      - name: Build workspace packages for CLI
        run: |
          set -euo pipefail
          pnpm --filter @peer-agent/protocol build
          pnpm --filter @peer-agent/runtime-core build
          pnpm --filter @peer-agent/runtime-sdk build
          pnpm --filter @peer-agent/runtime-node build
          pnpm --filter @peer-agent/credential-helper build
          pnpm --filter @peer-agent/conversation-store build

      - name: Build CLI (peer + credential helper)
        env:
          PEER_CLI_VERSION: ${{ needs.meta.outputs.version }}
        run: pnpm --filter @peer-agent/tui build

      - name: Verify peer --version
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(./apps/tui/dist/peer --version)"
          echo "peer --version → $OUT"
          test "$OUT" = "peer ${{ needs.meta.outputs.version }}"
          test -x ./apps/tui/dist/peer
          test -x ./apps/tui/dist/peer-credential-helper

      - name: Package CLI archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.meta.outputs.version }}"
          node scripts/package-cli-archive.mjs "${{ matrix.target }}"
          ls -la cli-dist
          echo "Packaged CLI ${VERSION} → cli-dist/peer-${{ matrix.target }}.tar.gz"

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-cli-${{ matrix.target }}
          path: cli-dist/*
          if-no-files-found: error
          retention-days: 5

  # ── 单 job 集中发布：下载所有平台产物，一次性写入同一个 Release ──
  release:
    needs: [meta, build, build-cli]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (release notes source)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp -f {} release-assets/ \;
          echo "=== release-assets ==="
          ls -la release-assets
          # CLI 归档必须在 Release 资产中（当前：darwin-arm64 + linux-x64）
          test -f release-assets/peer-darwin-arm64.tar.gz
          test -f release-assets/peer-linux-x64.tar.gz
          # Desktop Linux 一等产物：AppImage + .deb + 更新清单
          shopt -s nullglob
          linux_appimages=(release-assets/*.AppImage)
          linux_debs=(release-assets/*.deb)
          test "${#linux_appimages[@]}" -ge 1
          test "${#linux_debs[@]}" -ge 1
          test -f release-assets/latest-linux.yml -o -f release-assets/beta-linux.yml
          # Desktop mac：zip + 更新清单供 0.0.18 起的应用内更新；dmg 供更早版本手动安装。
          mac_dmgs=(release-assets/Peer-Agent-*-arm64.dmg)
          mac_zips=(release-assets/Peer-Agent-*-arm64.zip)
          test "${#mac_dmgs[@]}" -ge 1
          test "${#mac_zips[@]}" -ge 1
          test -f release-assets/latest-mac.yml -o -f release-assets/beta-mac.yml

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.meta.outputs.version }}
          body_path: release-notes/v${{ needs.meta.outputs.version }}.md
          prerelease: ${{ needs.meta.outputs.prerelease }}
          files: release-assets/*
          fail_on_unmatched_files: true

  # ── npm 发布：Open Runtime 库 + CLI 安装器 ──
  # 1) protocol / runtime-core / runtime-sdk：开放 Runtime 产品面（随 VERSION stamp）
  # 2) @peer-agent/cli：CLI 薄安装器（postinstall 拉 GitHub Release 二进制）
  # monorepo 源码 TUI 包是 @peer-agent/tui；对外安装器才是 @peer-agent/cli。
  # runtime-node 保持 private，永不 publish。
  # 无 NPM_TOKEN 时跳过 npm 发布（GitHub Release 仍会发布）。
  publish-npm:
    needs: [meta, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Setup Node / pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Enable corepack
        run: corepack enable

      - name: Install monorepo deps
        run: pnpm install --frozen-lockfile

      - name: Stamp version onto managed packages
        run: node scripts/stamp-version.mjs ${{ needs.meta.outputs.version }}

      - name: Build open runtime libraries
        run: |
          pnpm --filter @peer-agent/protocol build
          pnpm --filter @peer-agent/runtime-core build
          pnpm --filter @peer-agent/runtime-sdk build

      - name: Guard runtime package manifests
        run: node scripts/check-runtime-packages.mjs --contents

      - name: Publish open runtime libraries to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN not set — skip npm publish (GitHub Release still published)."
            exit 0
          fi
          VERSION="${{ needs.meta.outputs.version }}"
          if [[ "$VERSION" == *"-beta."* ]]; then
            TAG=beta
          elif [[ "$VERSION" == *"-alpha."* ]]; then
            TAG=alpha
          elif [[ "$VERSION" == *"-rc."* ]]; then
            TAG=rc
          else
            TAG=latest
          fi
          echo "Publishing open runtime packages @$VERSION with dist-tag $TAG"
          # Publish leaf → dependent order so dependencies resolve after publish.
          # Exact-version lookup makes release reruns idempotent: npm versions are immutable.
          for pkg in protocol runtime-core runtime-sdk; do
            SPEC="@peer-agent/$pkg@$VERSION"
            if npm view "$SPEC" version >/dev/null 2>&1; then
              echo "→ $SPEC already exists; skipping"
              continue
            fi
            echo "→ Publishing $SPEC"
            # pnpm publish rewrites workspace: deps to registry versions.
            pnpm --filter "@peer-agent/$pkg" publish --access public --tag "$TAG" --no-git-checks
          done

      - name: Publish @peer-agent/cli to npm
        working-directory: packages/npm-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # 发布包装包本身时不要在 CI 里再下二进制（用户装包时 postinstall 才下）
          PEER_AGENT_SKIP_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN not set — skip npm publish (GitHub Release still published)."
            exit 0
          fi
          # beta/alpha/rc → npm dist-tag；正式版走 latest
          VERSION="${{ needs.meta.outputs.version }}"
          if [[ "$VERSION" == *"-beta."* ]]; then
            TAG=beta
          elif [[ "$VERSION" == *"-alpha."* ]]; then
            TAG=alpha
          elif [[ "$VERSION" == *"-rc."* ]]; then
            TAG=rc
          else
            TAG=latest
          fi
          echo "Publishing @peer-agent/cli@$VERSION with dist-tag $TAG"
          # 包装包无 build 步骤；--ignore-scripts 避免 monorepo 探测/误下
          # scoped 包需 --access public（package.json publishConfig 已声明）
          npm publish --access public --tag "$TAG" --ignore-scripts
