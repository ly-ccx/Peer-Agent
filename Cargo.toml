[workspace]
members = [
  "crates/peer-credential-helper",
  "crates/peer-protocol",
  "crates/peer-tui",
  "crates/peer-cli",
  "crates/peer-store",
  "crates/peer-runtime",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.29.0", features = ["bracketed-paste"] }
