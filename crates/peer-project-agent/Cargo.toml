[package]
name = "peer-project-agent"
version = "0.1.0-rc.45"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
test-fixtures = ["peer-runtime/test-fixtures", "peer-store/test-fixtures"]

[dependencies]
peer-protocol = { path = "../peer-protocol" }
peer-store = { path = "../peer-store" }
peer-runtime = { path = "../peer-runtime" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64 = "=0.22.1"
flate2 = "=1.1.11"
rusqlite = { version = "=0.37.0", features = ["bundled", "limits"] }
tempfile = "3.23.0"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
uuid = { version = "=1.18.1", features = ["v4"] }
tokio = { version = "=1.48.0", features = ["rt", "macros", "sync", "time", "process"] }
tokio-util = { version = "=0.7.17", features = ["rt"] }
regex = "=1.13.1"

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "=1.48.0", features = ["test-util", "macros", "rt-multi-thread", "net", "io-util"] }
