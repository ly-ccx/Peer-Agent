[package]
name = "peer-cli"
version = "0.1.0-rc.44"
edition.workspace = true
rust-version.workspace = true
publish = false
default-run = "peer-native"

[features]
test-fixtures = ["peer-runtime/test-fixtures", "dep:sha2"]

[[bin]]
name = "peer-native"
path = "src/main.rs"

[dependencies]
peer-core-rpc = { path = "../peer-core-rpc" }
peer-project-agent = { path = "../peer-project-agent" }
peer-protocol = { path = "../peer-protocol" }
peer-tui = { path = "../peer-tui" }
peer-runtime = { path = "../peer-runtime" }
peer-store = { path = "../peer-store" }
tempfile = "3.23.0"
crossterm.workspace = true
ratatui.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
tokio = { version = "=1.48.0", features = ["rt", "time", "io-std", "io-util"] }
uuid = { version = "=1.18.1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
crossterm = { workspace = true, features = ["use-dev-tty"] }
signal-hook = "0.3.18"
rustix = { version = "1.1.4", features = ["event", "pty", "fs"] }

[target.'cfg(windows)'.dependencies]
fs2 = "0.4.3"
tokio = { version = "=1.48.0", features = ["signal"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.4", features = ["pipe"] }

[dev-dependencies]
md-5 = "=0.10.6"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
base64 = "=0.22.1"
url = "=2.5.8"

[[bin]]
name = "mcp-test-fixture"
path = "tests/fixtures/mcp.rs"
required-features = ["test-fixtures"]
test = false

[[bin]]
name = "mcp-helper-test-fixture"
path = "../peer-runtime/tests/fixtures/helper.rs"
required-features = ["test-fixtures"]
test = false
