[package]
name = "peer-cli"
version = "0.1.0-rc.40"
edition.workspace = true
rust-version.workspace = true
publish = false
default-run = "peer-native"

[features]
test-fixtures = ["peer-runtime/test-fixtures", "dep:sha2"]

[[bin]]
name = "peer-native"
path = "src/main.rs"

[dependencies]
peer-protocol = { path = "../peer-protocol" }
peer-tui = { path = "../peer-tui" }
peer-runtime = { path = "../peer-runtime" }
crossterm.workspace = true
ratatui.workspace = true
serde_json.workspace = true
signal-hook = "0.3.18"
sha2 = { workspace = true, optional = true }
tokio = { version = "=1.48.0", features = ["rt", "time", "io-std", "io-util"] }
rustix = { version = "1.1.4", features = ["event", "pty"] }

[dev-dependencies]
tempfile = "3.23.0"
peer-store = { path = "../peer-store" }
url = "=2.5.8"

[[bin]]
name = "mcp-test-fixture"
path = "tests/fixtures/mcp.rs"
required-features = ["test-fixtures"]
test = false

[[bin]]
name = "mcp-helper-test-fixture"
path = "../peer-runtime/tests/fixtures/helper.rs"
required-features = ["test-fixtures"]
test = false
