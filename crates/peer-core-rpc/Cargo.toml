[package]
name = "peer-core-rpc"
version = "0.1.0-rc.40"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
peer-protocol = { path = "../peer-protocol" }
peer-store = { path = "../peer-store" }
peer-runtime = { path = "../peer-runtime" }
peer-project-agent = { path = "../peer-project-agent" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "=1.48.0", features = ["rt", "macros", "io-std", "io-util", "net", "sync", "time"] }
uuid = { version = "=1.18.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "=1.48.0", features = ["test-util", "macros", "rt", "io-util", "net", "sync", "time"] }
