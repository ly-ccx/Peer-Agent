[package]
name = "peer-credential-helper"
version = "0.0.1-beta.41"
edition = "2024"
rust-version = "1.85"

[dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
base64 = "0.22.1"
fs2 = "0.4.3"
keyring = { version = "3.6.3", default-features = false }
rand = "0.8.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
subtle = "2.6.1"
thiserror = "2.0.17"
zeroize = "1.8.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3.23.0"
