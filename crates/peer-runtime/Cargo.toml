[package]
name = "peer-runtime"
version = "0.1.0-rc.40"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
test-fixtures = ["peer-store/test-fixtures"]

[dependencies]
peer-store = { path = "../peer-store" }
peer-protocol = { path = "../peer-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "=1.48.0", features = ["rt", "macros", "process", "io-util", "sync", "time", "net", "fs"] }
tokio-util = { version = "=0.7.17", features = ["rt"] }
zeroize = "1.8.2"
time = { version = "=0.3.55", features = ["parsing", "formatting"] }
uuid = { version = "=1.18.1", features = ["v4"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli", "deflate"] }
sha2.workspace = true
sha1 = "=0.10.7"
rustls = { version = "=0.23.46", default-features = false, features = ["std"] }
base64 = "=0.22.1"
percent-encoding = "=2.3.2"
regex = "=1.13.1"
aho-corasick = "=1.1.4"
icu_collator = "=2.1.1"
icu_casemap = "=2.1.1"
icu_locale_core = "=2.1.1"
aes = { version = "=0.8.4", features = ["zeroize"] }
cbc = { version = "=0.1.2", features = ["zeroize"] }
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
hkdf = "=0.12.4"
rsa = { version = "=0.10.0", features = ["pkcs1v15"] }
md-5 = "=0.10.6"
rmcp = { version = "=3.10.0", default-features = false, features = ["client", "auth"] }
http = "1.4.0"
getrandom = "=0.3.4"
bytes = "=1.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.12"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process", "fs"] }

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "=0.14.11"
libc = "0.2.186"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
nix = { version = "=0.29.0", default-features = false, features = ["fs"] }
tempfile = "3.23.0"

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "=1.48.0", features = ["test-util"] }

[[bin]]
name = "helper-test-fixture"
path = "tests/fixtures/helper.rs"
required-features = ["test-fixtures"]
test = false

[[example]]
name = "coordination-conformance"
required-features = ["test-fixtures"]

[[example]]
name = "goal-conformance"
required-features = ["test-fixtures"]

[[example]]
name = "goal-mirror-conformance"
required-features = ["test-fixtures"]

[[example]]
name = "instruction-conformance"
required-features = ["test-fixtures"]
