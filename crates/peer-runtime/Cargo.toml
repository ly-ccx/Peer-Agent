[package]
name = "peer-runtime"
version = "0.1.0-rc.40"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
test-fixtures = ["peer-store/test-fixtures"]

[dependencies]
peer-store = { path = "../peer-store" }
peer-protocol = { path = "../peer-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "=1.48.0", features = ["rt", "macros", "process", "io-util", "sync", "time", "net"] }
tokio-util = { version = "=0.7.17", features = ["rt"] }
zeroize = "1.8.2"
time = { version = "=0.3.55", features = ["parsing", "formatting"] }
rustix = { version = "1.1.4", features = ["process", "fs"] }
uuid = { version = "=1.18.1", features = ["v4"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2.workspace = true
sha1 = "=0.10.7"
rustls = { version = "=0.23.46", default-features = false, features = ["std"] }
base64 = "=0.22.1"
percent-encoding = "=2.3.2"
aho-corasick = "=1.1.4"
rmcp = { version = "=3.10.0", default-features = false, features = ["client", "auth"] }
http = "1.4.0"
getrandom = "=0.3.4"

[target.'cfg(target_os = "macos")'.dependencies]
tempfile = "3.23.0"

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "=1.48.0", features = ["test-util"] }

[[bin]]
name = "helper-test-fixture"
path = "tests/fixtures/helper.rs"
required-features = ["test-fixtures"]
test = false

[[example]]
name = "coordination-conformance"
required-features = ["test-fixtures"]

[[example]]
name = "goal-conformance"
required-features = ["test-fixtures"]

[[example]]
name = "goal-mirror-conformance"
required-features = ["test-fixtures"]

[[example]]
name = "instruction-conformance"
required-features = ["test-fixtures"]
