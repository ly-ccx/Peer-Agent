<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peer · 高保真稿</title>
<!--
  HI-FI MOCK — throwaway.
  Screenshot strip: goal lamp above composer, locator footer.
  Click lamp → workbench Goal card (任务线 → 发版线, 合并进 0.0.9).
  Footer never does merge.
-->
<style>
  :root {
    --chrome-canvas: #FAFBFC;
    --chrome-raised: #F3F5F8;
    --chrome-sunken: #EBEEF3;
    --chrome-hover: #F0F2F6;
    --chrome-active: #E5E8EE;
    --chrome-hairline: #DCE0E8;
    --paper-sheet: #F7F9FC;
    --control-fill: #EAEDF2;
    --graphite: #1A1D21;
    --graphite-soft: #525660;
    --graphite-fade: #878B95;
    --graphite-mute: #B0B4BC;
    --azure: #3B7FAB;
    --warn: #3B6FAB;
    --warn-soft: #E6EEF6;
    --success: #3E7A6B;
    --success-soft: #E4F0EC;
    --cinnabar: #9A3B3B;
    --sans: Inter, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    --chat-max: 760px;
    --sidebar: 248px;
    --wb: 380px;
    --shadow-pop: 0 8px 24px rgba(16, 24, 40, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans); color: var(--graphite); background: #D8DEE6;
    font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  .desk {
    height: 100%; max-width: 1440px; margin: 0 auto;
    display: flex; flex-direction: column;
    background: var(--chrome-canvas);
    box-shadow: 0 24px 80px rgba(26,29,33,.14);
  }
  .osbar {
    height: 38px; flex: none; display: flex; align-items: center; gap: 8px;
    padding: 0 14px; background: var(--chrome-raised);
    border-bottom: 1px solid var(--chrome-hairline);
  }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: #D8DEE6; display: block; }
  .osbar .app-name { font-size: 12px; color: var(--graphite-fade); font-weight: 560; }
  .osbar .hint { margin-left: auto; font-size: 11px; color: var(--graphite-mute); }

  .shell {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: var(--sidebar) minmax(0, 1fr) 0;
    transition: grid-template-columns 180ms var(--ease);
  }
  .shell.is-wb { grid-template-columns: var(--sidebar) minmax(0, 1fr) var(--wb); }

  .sb {
    background: color-mix(in srgb, var(--chrome-raised) 92%, transparent);
    border-right: 1px solid var(--chrome-hairline);
    display: flex; flex-direction: column; padding: 12px 10px 16px; min-height: 0;
  }
  .sb-new {
    display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; margin-bottom: 8px;
    border-radius: 8px; background: var(--graphite); color: #F7F9FC; font-weight: 560;
  }
  .sb-nav, .task-row {
    width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; color: var(--graphite-soft);
  }
  .sb-nav { display: flex; align-items: center; gap: 8px; }
  .sb-nav:hover, .task-row:hover { background: var(--chrome-hover); color: var(--graphite); }
  .sb-nav.is-on, .task-row.is-on { background: var(--chrome-active); color: var(--graphite); font-weight: 560; }
  .sb-nav .counts { margin-left: auto; font-size: 11px; color: var(--graphite-fade); }
  .sb-nav .counts b { color: var(--graphite); }
  .ws-label { margin: 16px 10px 6px; font-size: 11px; letter-spacing: .06em; color: var(--graphite-mute); text-transform: uppercase; }
  .task-row .name { display: block; font-weight: 560; }
  .task-row .meta { display: block; font-size: 11px; color: var(--graphite-fade); margin-top: 2px; }

  .main { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--chrome-canvas); }
  .screen { flex: 1; min-height: 0; display: none; flex-direction: column; }
  .screen.is-on { display: flex; animation: enter 180ms var(--ease); }
  @keyframes enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .screen, .shell { animation: none; transition: none; } }

  .chat-head {
    height: 44px; flex: none; display: flex; align-items: center; gap: 10px;
    padding: 0 20px; border-bottom: 1px solid var(--chrome-hairline);
  }
  .chat-head h1 { font-size: 13px; font-weight: 620; }
  .chat-head .sub { color: var(--graphite-fade); font-size: 12px; }

  .thread { flex: 1; min-height: 0; overflow: auto; padding: 28px 28px 12px; }
  .col { max-width: var(--chat-max); margin: 0 auto; }
  .bubble {
    max-width: 92%; padding: 10px 12px; margin-bottom: 16px;
    border-radius: 12px; background: var(--chrome-sunken); color: var(--graphite-soft);
  }
  .bubble.me { margin-left: auto; background: var(--control-fill); color: var(--graphite); }

  /* Composer stack matches screenshot */
  .composer-stack {
    flex: none; padding: 8px 20px 10px;
    display: flex; flex-direction: column; align-items: center;
  }
  .composer-stack > * { width: 100%; max-width: var(--chat-max); }

  .goal-lamp {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 12px; margin: 0 auto 8px;
    border: 1px solid var(--chrome-hairline); border-radius: 12px;
    background: color-mix(in srgb, var(--chrome-raised) 86%, #fff);
    color: var(--graphite-soft); text-align: left;
  }
  .goal-lamp:hover { background: var(--chrome-hover); }
  .goal-lamp-label { font-weight: 600; color: var(--graphite); }
  .goal-lamp-summary { color: var(--graphite-fade); font-size: 12px; }
  .goal-lamp-active {
    margin-left: auto; display: inline-flex; align-items: center; gap: 8px; min-width: 0;
  }
  .goal-lamp-title {
    max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--graphite-soft); font-size: 12px;
  }
  .goal-lamp-status {
    flex: none; font-size: 11px; font-family: var(--mono); font-weight: 650;
    padding: 2px 6px; border-radius: 4px;
  }
  .goal-lamp-status.warn { color: var(--warn); background: var(--warn-soft); }
  .goal-lamp-status.ok { color: var(--success); background: var(--success-soft); }
  .goal-lamp-caret { color: var(--graphite-mute); }

  .composer {
    border: 1px solid var(--chrome-hairline); border-radius: 16px;
    background: #fff; padding: 12px 14px 10px;
    box-shadow: 0 1px 2px rgba(26,29,33,.04);
  }
  .composer textarea {
    width: 100%; border: 0; outline: none; resize: none; min-height: 36px;
    background: transparent; color: var(--graphite); font-size: 14px;
  }
  .composer textarea::placeholder { color: var(--graphite-fade); }
  .composer-bar {
    display: flex; align-items: center; gap: 10px; margin-top: 8px;
    color: var(--graphite-fade); font-size: 12.5px;
  }
  .plus {
    width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center; color: var(--graphite-soft); font-size: 16px;
  }
  .model { color: var(--graphite-soft); }
  .think { color: var(--azure); }
  .send {
    margin-left: auto; width: 32px; height: 32px; border-radius: 50%;
    background: var(--control-fill); color: var(--graphite-soft); font-size: 14px;
  }

  .locator {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 2px 4px 6px; color: var(--graphite-fade); font-size: 12px;
  }
  .loc { display: inline-flex; align-items: center; gap: 5px; }
  .loc.danger { color: var(--cinnabar); }
  .loc.mono { font-family: var(--mono); }
  .loc input { accent-color: var(--graphite); }
  .usage { margin-left: auto; font-size: 11px; color: var(--graphite-mute); }

  /* Workbench */
  .wb {
    min-width: 0; min-height: 0; overflow: hidden;
    border-left: 1px solid var(--chrome-hairline);
    background: var(--chrome-raised); display: flex; flex-direction: column;
  }
  .wb-head {
    height: 44px; flex: none; display: flex; align-items: center; gap: 8px;
    padding: 0 14px; border-bottom: 1px solid var(--chrome-hairline);
    font-weight: 620; font-size: 13px;
  }
  .wb-body { flex: 1; min-height: 0; overflow: auto; padding: 16px; }
  .goal-card {
    background: var(--paper-sheet); border: 1px solid var(--chrome-hairline);
    border-radius: 14px; padding: 16px;
  }
  .goal-card header { display: flex; align-items: flex-start; gap: 10px; }
  .goal-card h2 { font-size: 15px; letter-spacing: -.02em; }
  .badge {
    margin-left: auto; height: 22px; padding: 0 9px; border-radius: 999px;
    font-size: 11px; font-weight: 650; white-space: nowrap;
    background: var(--control-fill); color: var(--graphite-soft);
  }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.ok { background: var(--success-soft); color: var(--success); }
  .goal-meta { margin-top: 4px; font-size: 12px; color: var(--graphite-fade); }
  .route {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center;
    margin: 14px 0 12px; padding: 10px; border-radius: 12px; background: var(--chrome-sunken);
  }
  .route.is-blocked { background: var(--warn-soft); }
  .route.is-ok { background: var(--success-soft); }
  .node {
    min-width: 0; padding: 8px 10px; border-radius: 10px;
    background: #fff; border: 1px solid var(--chrome-hairline);
  }
  .node .k { display: block; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--graphite-mute); margin-bottom: 2px; }
  .node .v { font-family: var(--mono); font-size: 12px; font-weight: 620; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arrow { color: var(--graphite-fade); font-size: 18px; }
  .route.is-blocked .arrow { color: var(--warn); }
  .why { margin: 0 0 12px; color: var(--graphite); }
  .btn {
    height: 32px; padding: 0 14px; border-radius: 8px; font-weight: 600;
    background: var(--control-fill); transition: transform 120ms var(--ease);
  }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--graphite); color: #F7F9FC; }
  .btn.ghost { border: 1px solid var(--chrome-hairline); background: transparent; color: var(--graphite-soft); }

  .radar-page { flex: 1; min-height: 0; overflow: auto; padding: 28px 36px 48px; }
  .radar-page h1 { font-size: 22px; letter-spacing: -.03em; margin-bottom: 4px; }
  .lead { color: var(--graphite-soft); margin-bottom: 22px; }
  .group-kicker { font-size: 12px; color: var(--graphite-fade); margin: 4px 0 10px; }
  .radar-card {
    width: min(720px, 100%); text-align: left; margin-bottom: 10px;
    display: grid; grid-template-columns: 72px 1fr auto; gap: 14px; align-items: center;
    background: #fff; border: 1px solid var(--chrome-hairline); border-radius: 14px; padding: 14px 16px;
  }
  .radar-card:hover { background: var(--chrome-hover); }
  .radar-card .kind { font-size: 12px; font-weight: 650; color: var(--warn); }
  .radar-card h3 { font-size: 15px; margin-bottom: 4px; }
  .chip { display: inline-block; background: var(--control-fill); border-radius: 999px; padding: 2px 8px; font-size: 11px; color: var(--graphite-fade); }

  .picker {
    position: absolute; bottom: 52px; left: 0; width: 280px; max-height: 320px;
    background: color-mix(in srgb, var(--chrome-raised) 92%, #fff);
    border: 1px solid var(--chrome-hairline); border-radius: 14px;
    box-shadow: var(--shadow-pop); overflow: hidden; display: none; z-index: 8;
  }
  .picker.is-on { display: block; }
  .picker-search { padding: 10px 12px; color: var(--graphite-mute); border-bottom: 1px solid var(--chrome-hairline); }
  .picker-group { padding: 8px 12px 4px; font-size: 11px; color: var(--graphite-mute); }
  .picker-row {
    width: 100%; display: flex; justify-content: space-between;
    padding: 8px 12px; font-family: var(--mono); font-size: 12px;
  }
  .picker-row:hover, .picker-row.is-on { background: var(--chrome-active); }
  .picker-row span { color: var(--graphite-mute); font-family: var(--sans); }
  .picker-foot {
    width: 100%; text-align: left; padding: 10px 12px;
    border-top: 1px solid var(--chrome-hairline); color: var(--graphite-soft);
  }
  .branch-chip {
    display: inline-flex; align-items: center; gap: 6px;
    height: 26px; padding: 0 8px; border-radius: 6px;
    font-family: var(--mono); font-size: 12px; color: var(--graphite-soft);
  }
  .branch-chip:hover { background: var(--chrome-hover); }

  .overlay {
    position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--chrome-sunken) 42%, transparent); backdrop-filter: blur(8px);
  }
  .overlay.is-on { display: flex; }
  .dialog {
    width: min(400px, calc(100vw - 48px)); background: #fff; border-radius: 14px;
    box-shadow: var(--shadow-pop); padding: 20px; animation: enter 180ms var(--ease);
  }
  .dialog h2 { font-size: 15px; margin-bottom: 6px; }
  .dialog p { color: var(--graphite-soft); margin-bottom: 12px; }
  .dialog input {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--chrome-hairline); outline: none; margin-bottom: 14px;
  }
  .dialog-actions { display: flex; justify-content: space-between; align-items: center; }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(8px);
    background: var(--graphite); color: #F7F9FC; padding: 8px 14px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: opacity 180ms var(--ease), transform 180ms var(--ease); z-index: 30;
  }
  .toast.is-on { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<div class="desk">
  <header class="osbar">
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="app-name">Peer</div>
    <div class="hint">完整稿 · 灯条 / 输入栏 / 底栏定位器 · 合回在工作台</div>
  </header>
  <div class="shell" id="shell">
    <aside class="sb">
      <button class="sb-new" data-act="draft">＋ 新对话</button>
      <button class="sb-nav" data-screen="radar" id="navRadar">工作台
        <span class="counts"><b id="needCount">2</b> 待你</span>
      </button>
      <button class="sb-nav is-on" data-screen="home" id="navHome">家</button>
      <div class="ws-label">peer_agent</div>
      <button class="task-row is-on" data-act="open-home" data-id="merge009" id="rowMerge">
        <span class="name">画高保真产品稿</span>
        <span class="meta" id="rowMergeMeta">合不进 0.0.9</span>
      </button>
      <button class="task-row" data-act="open-home" data-id="ascii">
        <span class="name">分支名强制 ASCII</span>
        <span class="meta">还没进 0.0.9</span>
      </button>
      <button class="task-row" data-act="draft">
        <span class="name">新对话</span>
        <span class="meta">源头 0.0.9</span>
      </button>
    </aside>
    <section class="main">
      <div class="screen is-on" id="screen-home"></div>
      <div class="screen" id="screen-radar"></div>
      <div class="screen" id="screen-draft"></div>
    </section>
    <aside class="wb" id="wb"></aside>
  </div>
</div>
<div class="overlay" id="overlay"></div>
<div class="toast" id="toast" role="status"></div>
<script>
const seed = {
  merge009: {
    title: "画高保真产品稿",
    status: "stopped",
    progress: "4 / 4",
    from: "画高保真产品稿",
    to: "0.0.9",
    why: "你正在 0.0.9 上改别的东西，还没提交。没法把这条任务合进去。",
    bubble: "完整的设计稿出一下",
  },
  ascii: {
    title: "分支名强制 ASCII",
    status: "pending",
    progress: "4 / 4",
    from: "ASCII 分支名",
    to: "0.0.9",
    why: "活已经做完，还停在任务线上，没有合进 0.0.9。",
    bubble: "新分支名强制 ASCII，避免中文枝名。",
  },
};
let tasks = JSON.parse(JSON.stringify(seed));
const state = { screen: "home", selected: "merge009", wb: false, picker: false, overlay: false, created010: false };
const LABEL = { stopped: "合不进 0.0.9", pending: "还没进 0.0.9", merged: "已进 0.0.9" };

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("is-on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("is-on"), 1600);
}
function lampStatus(t) {
  return `<span class="goal-lamp-status ${t.status === "merged" ? "ok" : "warn"}">${LABEL[t.status]}</span>`;
}
function route(t) {
  const blocked = t.status !== "merged";
  return `<div class="route ${blocked ? "is-blocked" : "is-ok"}">
    <div class="node"><span class="k">任务线</span><span class="v">${t.from}</span></div>
    <div class="arrow">${blocked ? "↛" : "→"}</div>
    <div class="node"><span class="k">发版线</span><span class="v">${t.to}</span></div>
  </div>`;
}
function action(id, t) {
  if (t.status === "stopped") {
    return `<p class="why">${t.why}</p>
      <button class="btn primary" data-act="merge" data-id="${id}">再试一次，合并进 0.0.9</button>`;
  }
  if (t.status === "pending") {
    return `<p class="why">${t.why}</p>
      <button class="btn primary" data-act="merge" data-id="${id}">合并进 0.0.9</button>`;
  }
  return `<p class="why">已经合并进 <b>peer_agent / 0.0.9</b>。发版看的是这条线。</p>`;
}
function composerCard(placeholder) {
  return `<div class="composer">
    <textarea placeholder="${placeholder}"></textarea>
    <div class="composer-bar">
      <span class="plus">＋</span>
      <span class="model">Grok 官方 · grok-4.6 ▾</span>
      <span class="think">⚡ 超高强度思考</span>
      <span>500k</span>
      <button class="send" type="button">↑</button>
    </div>
  </div>`;
}
function locator(opts) {
  const { head, task, isolated, usage } = opts;
  return `<div class="locator">
    <span class="loc">peer_agent</span>
    <span class="loc">Agent ▾</span>
    <span class="loc danger">完全访问 ▾</span>
    <span class="loc mono">⎇ 在 ${head}</span>
    ${task ? `<span class="loc">⌘ Worktree · ${task}</span>` : ""}
    ${isolated ? `<label class="loc"><input type="checkbox" checked disabled> 隔离执行</label>` : ""}
    ${usage ? `<span class="usage">◐ ${usage}</span>` : ""}
  </div>`;
}

function renderHome() {
  const t = tasks[state.selected];
  const isolated = t.status !== "merged";
  document.getElementById("screen-home").innerHTML = `
    <div class="chat-head">
      <h1>${t.title}</h1>
      <span class="sub">peer_agent · 源头 0.0.9</span>
    </div>
    <div class="thread"><div class="col">
      <div class="bubble me">${t.bubble}</div>
    </div></div>
    <div class="composer-stack">
      <button class="goal-lamp" data-act="open-wb">
        <span class="goal-lamp-label">目标计划</span>
        <span class="goal-lamp-summary">6 个目标计划</span>
        <span class="goal-lamp-active">
          <span class="goal-lamp-title">${t.title}</span>
          ${lampStatus(t)}
          <span class="goal-lamp-caret">›</span>
        </span>
      </button>
      ${composerCard("输入消息，@ 引用文件或会话")}
      ${locator({ head: "0.0.9", task: isolated ? t.title : null, isolated, usage: "59%" })}
    </div>`;
}

function renderRadar() {
  const open = Object.entries(tasks).filter(([, t]) => t.status !== "merged");
  const cards = open.map(([id, t]) => `
    <button class="radar-card" data-act="open-home" data-id="${id}">
      <span class="kind">要你处理</span>
      <div>
        <h3>${t.title}</h3>
        <span class="chip">peer_agent / 0.0.9 · ${LABEL[t.status]}</span>
      </div>
      <span class="btn">查看进度 →</span>
    </button>`).join("");
  document.getElementById("screen-radar").innerHTML = `
    <div class="radar-page">
      <h1>需要你</h1>
      <p class="lead">按源头分支归组。点叶子回到家里，合回只在工作台 Goal 卡上做。</p>
      <div class="group-kicker">peer_agent / 0.0.9 · ${open.length} 条还没进这版</div>
      ${cards || `<p class="lead">没有还没进 0.0.9 的叶子。</p>`}
    </div>`;
}

function renderDraft() {
  document.getElementById("screen-draft").innerHTML = `
    <div class="chat-head">
      <h1>新对话</h1>
      <span class="sub">草稿 · 还没绑任务线</span>
    </div>
    <div class="thread"><div class="col">
      <div class="bubble">从已经发出的 0.0.9 开 0.0.10，作为下一版源头。</div>
    </div></div>
    <div class="composer-stack" style="position:relative">
      ${composerCard("说下一件要做的事…")}
      ${locator({ head: state.created010 ? "0.0.10" : "0.0.9" })}
      <div class="picker ${state.picker ? "is-on" : ""}" id="picker" style="left:20px">
        <div class="picker-search">搜索分支…</div>
        <div class="picker-group">本地分支</div>
        <button class="picker-row is-on">0.0.9<span>本地</span></button>
        <button class="picker-row">0.0.8<span>本地</span></button>
        ${state.created010 ? `<button class="picker-row">0.0.10<span>本地</span></button>` : ""}
        <button class="picker-foot" data-act="open-create">创建分支</button>
      </div>
    </div>`;
  const loc = document.querySelector("#screen-draft .locator .loc.mono");
  if (loc) {
    loc.outerHTML = `<button class="branch-chip loc mono" data-act="toggle-picker">⎇ 在 ${state.created010 ? "0.0.10" : "0.0.9"}</button>`;
  }
}

function renderWb() {
  const t = tasks[state.selected];
  document.getElementById("wb").innerHTML = `
    <div class="wb-head">Goal · ${t.title}</div>
    <div class="wb-body">
      <article class="goal-card">
        <header>
          <div>
            <h2>${t.title}</h2>
            <div class="goal-meta">${t.progress} 已做完 · 源头 0.0.9</div>
          </div>
          <span class="badge ${t.status === "merged" ? "ok" : "warn"}">${LABEL[t.status]}</span>
        </header>
        ${route(t)}
        ${action(state.selected, t)}
      </article>
    </div>`;
}

function renderOverlay() {
  const el = document.getElementById("overlay");
  if (!state.overlay) { el.className = "overlay"; el.innerHTML = ""; return; }
  el.className = "overlay is-on";
  el.innerHTML = `<div class="dialog" onclick="event.stopPropagation()">
    <h2>创建分支</h2>
    <p>从 0.0.9 创建。确认后，这个工作区的源头会切到新分支。</p>
    <input id="newName" value="0.0.10" placeholder="分支名">
    <div class="dialog-actions">
      <button class="btn ghost" data-act="close-overlay">取消 Esc</button>
      <button class="btn primary" data-act="confirm-create">从 0.0.9 创建</button>
    </div>
  </div>`;
}

function renderChrome() {
  document.getElementById("navHome").classList.toggle("is-on", state.screen === "home" || state.screen === "draft");
  document.getElementById("navRadar").classList.toggle("is-on", state.screen === "radar");
  const open = Object.values(tasks).filter((t) => t.status !== "merged").length;
  document.getElementById("needCount").textContent = open;
  document.getElementById("rowMergeMeta").textContent = LABEL[tasks.merge009.status];
  document.querySelectorAll(".screen").forEach((el) => el.classList.toggle("is-on", el.id === "screen-" + state.screen));
  document.getElementById("shell").classList.toggle("is-wb", state.wb && state.screen === "home");
}

function render() {
  renderHome();
  renderRadar();
  renderDraft();
  renderWb();
  renderOverlay();
  renderChrome();
}

function apply(act, id) {
  if (act === "open-home") { state.selected = id; state.screen = "home"; state.wb = true; state.picker = false; }
  if (act === "draft") { state.screen = "draft"; state.wb = false; state.picker = false; }
  if (act === "open-wb") { state.wb = true; state.screen = "home"; }
  if (act === "toggle-picker") state.picker = !state.picker;
  if (act === "open-create") { state.picker = false; state.overlay = true; }
  if (act === "close-overlay") state.overlay = false;
  if (act === "confirm-create") {
    state.overlay = false;
    state.created010 = true;
    toast("已从 0.0.9 创建 0.0.10，源头切到 0.0.10");
  }
  if (act === "merge" && tasks[id]) {
    tasks[id].status = "merged";
    tasks[id].progress = "已进这版";
    toast("已合并进 0.0.9");
  }
}

document.body.addEventListener("click", (e) => {
  const nav = e.target.closest("[data-screen]");
  if (nav) {
    state.screen = nav.dataset.screen;
    state.wb = nav.dataset.screen === "home" ? state.wb : false;
    state.picker = false;
    render();
    return;
  }
  const btn = e.target.closest("[data-act]");
  if (btn) { apply(btn.dataset.act, btn.dataset.id); render(); return; }
  if (e.target.id === "overlay") { state.overlay = false; render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.overlay) { state.overlay = false; render(); }
});
render();
</script>
</body>
</html>
